<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Janjua Traders - Image Editor</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    font-family: Arial, "Noto Nastaliq Urdu", sans-serif;
    background: #f1f3f6;
    color: #222;
}

h1 {
    text-align: center;
    font-size: 22px;
    margin: 5px 0 18px;
}

.editor {
    max-width: 1100px;
    margin: auto;
}

.controls {
    background: white;
    padding: 15px;
    border-radius: 14px;
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
    margin-bottom: 18px;
}

.control-group {
    margin-bottom: 14px;
}

.control-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 6px;
}

input,
select,
button,
textarea {
    font-family: inherit;
}

input[type="text"],
input[type="number"],
textarea,
select {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
}

textarea {
    min-height: 55px;
    resize: vertical;
}

button {
    border: none;
    border-radius: 8px;
    padding: 10px 13px;
    margin: 3px;
    cursor: pointer;
    background: #222;
    color: white;
    font-size: 14px;
}

button:hover {
    opacity: .88;
}

.btn-green {
    background: #198754;
}

.btn-blue {
    background: #1769aa;
}

.btn-red {
    background: #c62828;
}

.btn-gold {
    background: #b8860b;
}

.color-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

.color-btn {
    width: 34px;
    height: 34px;
    padding: 0;
    border: 2px solid #ddd;
}

.star-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

.star-color {
    width: 34px;
    height: 34px;
    padding: 0;
    border-radius: 50%;
}

.format-row {
    display: flex;
    flex-wrap: wrap;
}

.format-row button {
    min-width: 48px;
}

.feature-box {
    border: 1px solid #ddd;
    padding: 12px;
    border-radius: 10px;
    margin-top: 10px;
    background: #fafafa;
}

.feature-title {
    font-weight: bold;
    margin-bottom: 8px;
}

.download-row {
    text-align: center;
    margin-top: 15px;
}

#canvas {
    display: block;
    max-width: 100%;
    height: auto;
    margin: auto;
    background: white;
    box-shadow: 0 5px 25px rgba(0,0,0,.18);
}

.preview-area {
    background: #ddd;
    padding: 15px;
    border-radius: 14px;
    overflow: auto;
}

.small-note {
    font-size: 12px;
    color: #666;
    margin-top: 5px;
}

.logo-preview {
    max-width: 100px;
    max-height: 60px;
    display: none;
    margin-top: 8px;
}

.direction-row {
    text-align: center;
}

.hidden {
    display: none;
}
</style>
</head>

<body>

<div class="editor">

<h1>Janjua Traders — Digital Marketing Image Editor</h1>

<div class="controls">

<!-- IMAGE -->
<div class="control-group">
<label>1. پروڈکٹ تصویر منتخب کریں</label>
<input type="file" id="imageInput" accept="image/*">
</div>

<!-- LOGO -->
<div class="control-group">
<label>2. اپنا Monogram / Logo</label>
<input type="file" id="logoInput" accept="image/*">
<img id="logoPreview" class="logo-preview">
</div>

<!-- PANEL SIDE -->
<div class="control-group">
<label>3. معلومات والا Panel</label>

<div class="direction-row">
<button onclick="setPanelSide('right')" class="btn-blue">
دائیں طرف
</button>

<button onclick="setPanelSide('left')" class="btn-blue">
بائیں طرف
</button>
</div>
</div>

<!-- PANEL BACKGROUND -->
<div class="control-group">
<label>4. Panel Background</label>

<select id="panelBackground" onchange="draw()">
<option value="dark">Dark Premium</option>
<option value="light">White</option>
<option value="gold">Golden</option>
<option value="black">Black</option>
<option value="blue">Blue</option>
<option value="gradient">Premium Gradient</option>
</select>
</div>

<!-- TEXT -->
<div class="control-group">

<label>5. عبارت</label>

<textarea
id="featureText"
placeholder="مثلاً: مضبوط اور پائیدار کوالٹی"
></textarea>

<div class="format-row">

<button onclick="addFeature()"
class="btn-green">
⭐ Star کے ساتھ شامل کریں
</button>

<button onclick="clearText()"
class="btn-red">
صاف کریں
</button>

</div>

</div>

<!-- TEXT SIZE -->
<div class="control-group">

<label>
Text Size:
<span id="fontSizeValue">32</span> px
</label>

<input
type="range"
id="fontSize"
min="18"
max="70"
value="32"
oninput="updateFontSize()"
>

</div>

<!-- TEXT COLOR -->
<div class="control-group">

<label>Text Color</label>

<div class="color-row">

<button class="color-btn"
style="background:#ffffff"
onclick="setTextColor('#ffffff')"></button>

<button class="color-btn"
style="background:#000000"
onclick="setTextColor('#000000')"></button>

<button class="color-btn"
style="background:#ff0000"
onclick="setTextColor('#ff0000')"></button>

<button class="color-btn"
style="background:#ffd700"
onclick="setTextColor('#ffd700')"></button>

<button class="color-btn"
style="background:#00aaff"
onclick="setTextColor('#00aaff')"></button>

<button class="color-btn"
style="background:#00c853"
onclick="setTextColor('#00c853')"></button>

<button class="color-btn"
style="background:#ff6d00"
onclick="setTextColor('#ff6d00')"></button>

<button class="color-btn"
style="background:#e91e63"
onclick="setTextColor('#e91e63')"></button>

<button class="color-btn"
style="background:#9c27b0"
onclick="setTextColor('#9c27b0')"></button>

</div>
</div>

<!-- FORMATTING -->
<div class="control-group">

<label>Text Style</label>

<div class="format-row">

<button onclick="toggleBold()">
<b>B</b>
</button>

<button onclick="toggleItalic()">
<i>I</i>
</button>

<button onclick="toggleUnderline()">
<u>U</u>
</button>

</div>

</div>

<!-- STAR COLOR -->
<div class="control-group">

<label>Star Color</label>

<div class="star-row">

<button class="star-color"
style="background:#ffd700"
onclick="setStarColor('#ffd700')"></button>

<button class="star-color"
style="background:#ffffff"
onclick="setStarColor('#ffffff')"></button>

<button class="star-color"
style="background:#000000"
onclick="setStarColor('#000000')"></button>

<button class="star-color"
style="background:#ff0000"
onclick="setStarColor('#ff0000')"></button>

<button class="star-color"
style="background:#00aaff"
onclick="setStarColor('#00aaff')"></button>

<button class="star-color"
style="background:#00c853"
onclick="setStarColor('#00c853')"></button>

<button class="star-color"
style="background:#ff6d00"
onclick="setStarColor('#ff6d00')"></button>

<button class="star-color"
style="background:#e91e63"
onclick="setStarColor('#e91e63')"></button>

</div>

</div>

<!-- PRODUCT INFORMATION -->
<div class="control-group">

<label>Product Information</label>

<div class="format-row">

<button onclick="addPreset('پاکستان کی بنی ہوئی پروڈکٹ')">
پاکستان
</button>

<button onclick="addPreset('مضبوط اور پائیدار چیز')">
پائیداری
</button>

<button onclick="addPreset('بہترین کوالٹی')">
کوالٹی
</button>

<button onclick="addPreset('کم قیمت')">
کم قیمت
</button>

<button onclick="addPreset('خوبصورت ڈیزائن')">
ڈیزائن
</button>

<button onclick="addPreset('بہترین انتخاب')">
بہترین انتخاب
</button>

</div>

</div>

<!-- REMOVE LAST -->
<div class="control-group">

<button onclick="removeLastFeature()" class="btn-red">
آخری Star ختم کریں
</button>

<button onclick="clearFeatures()" class="btn-red">
تمام Stars ختم کریں
</button>

</div>

<!-- DOWNLOAD -->
<div class="download-row">

<button
onclick="downloadImage('jpg')"
class="btn-green">
JPG Download
</button>

<button
onclick="downloadImage('png')"
class="btn-blue">
PNG Download
</button>

</div>

</div>

<!-- PREVIEW -->
<div class="preview-area">

<canvas id="canvas"></canvas>

</div>

</div>


<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const imageInput =
document.getElementById("imageInput");

const logoInput =
document.getElementById("logoInput");

const logoPreview =
document.getElementById("logoPreview");

const featureText =
document.getElementById("featureText");

const fontSize =
document.getElementById("fontSize");

let productImage = null;
let logoImage = null;

let panelSide = "right";

let textColor = "#ffffff";
let starColor = "#ffd700";

let currentFontSize = 32;

let isBold = false;
let isItalic = false;
let isUnderline = false;

let features = [];


/* =====================================================
IMAGE
===================================================== */

imageInput.addEventListener("change", function(e) {

    const file = e.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(event) {

        const img = new Image();

        img.onload = function() {

            productImage = img;

            draw();

        };

        img.src = event.target.result;

    };

    reader.readAsDataURL(file);

});


/* =====================================================
LOGO
===================================================== */

logoInput.addEventListener("change", function(e) {

    const file = e.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(event) {

        const img = new Image();

        img.onload = function() {

            logoImage = img;

            logoPreview.src =
                event.target.result;

            logoPreview.style.display =
                "block";

            draw();

        };

        img.src = event.target.result;

    };

    reader.readAsDataURL(file);

});


/* =====================================================
PANEL SIDE
===================================================== */

function setPanelSide(side) {

    panelSide = side;

    draw();
}


/* =====================================================
TEXT SIZE
===================================================== */

function updateFontSize() {

    currentFontSize =
        parseInt(fontSize.value);

    document.getElementById(
        "fontSizeValue"
    ).textContent =
        currentFontSize;

    draw();
}


/* =====================================================
TEXT COLOR
===================================================== */

function setTextColor(color) {

    textColor = color;

    draw();
}


/* =====================================================
STAR COLOR
===================================================== */

function setStarColor(color) {

    starColor = color;

    draw();
}


/* =====================================================
FORMAT
===================================================== */

function toggleBold() {

    isBold = !isBold;

    draw();
}


function toggleItalic() {

    isItalic = !isItalic;

    draw();
}


function toggleUnderline() {

    isUnderline =
        !isUnderline;

    draw();
}


/* =====================================================
ADD FEATURE
===================================================== */

function addFeature() {

    const text =
        featureText.value.trim();

    if (!text) {

        alert(
            "پہلے عبارت لکھیں۔"
        );

        return;
    }

    features.push({

        text: text,

        color: textColor,

        starColor: starColor,

        fontSize: currentFontSize,

        bold: isBold,

        italic: isItalic,

        underline: isUnderline

    });

    featureText.value = "";

    draw();
}


/* =====================================================
PRESET
===================================================== */

function addPreset(text) {

    featureText.value = text;

    addFeature();
}


/* =====================================================
REMOVE LAST
===================================================== */

function removeLastFeature() {

    if (features.length > 0) {

        features.pop();

        draw();
    }
}


/* =====================================================
CLEAR
===================================================== */

function clearFeatures() {

    features = [];

    draw();
}


/* =====================================================
CLEAR TEXT
===================================================== */

function clearText() {

    featureText.value = "";

}


/* =====================================================
PANEL BACKGROUND
===================================================== */

function getPanelBackground() {

    const value =
        document.getElementById(
            "panelBackground"
        ).value;

    return value;
}


/* =====================================================
DRAW STAR
===================================================== */

function drawStar(
    x,
    y,
    outerRadius,
    innerRadius,
    color
) {

    ctx.save();

    ctx.fillStyle = color;

    ctx.beginPath();

    let rotation =
        Math.PI / 2 * 3;

    const spikes = 5;

    const step =
        Math.PI / spikes;

    ctx.moveTo(
        x,
        y - outerRadius
    );

    for (
        let i = 0;
        i < spikes;
        i++
    ) {

        ctx.lineTo(
            x +
            Math.cos(rotation) *
            outerRadius,

            y +
            Math.sin(rotation) *
            outerRadius
        );

        rotation += step;

        ctx.lineTo(
            x +
            Math.cos(rotation) *
            innerRadius,

            y +
            Math.sin(rotation) *
            innerRadius
        );

        rotation += step;
    }

    ctx.lineTo(
        x,
        y - outerRadius
    );

    ctx.closePath();

    ctx.fill();

    ctx.restore();
}


/* =====================================================
WRAP TEXT
===================================================== */

function wrapText(
    text,
    maxWidth,
    font
) {

    ctx.font = font;

    const words =
        text.split(" ");

    const lines = [];

    let line = "";

    for (
        let i = 0;
        i < words.length;
        i++
    ) {

        const testLine =
            line +
            (line ? " " : "") +
            words[i];

        const width =
            ctx.measureText(
                testLine
            ).width;

        if (
            width > maxWidth &&
            line
        ) {

            lines.push(line);

            line =
                words[i];

        } else {

            line =
                testLine;
        }
    }

    if (line) {

        lines.push(line);
    }

    return lines;
}


/* =====================================================
DRAW
===================================================== */

function draw() {

    if (!productImage) {

        canvas.width = 900;
        canvas.height = 600;

        ctx.fillStyle = "#eeeeee";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        ctx.fillStyle = "#555";

        ctx.font =
            "28px Arial";

        ctx.textAlign =
            "center";

        ctx.fillText(
            "پہلے Product Image منتخب کریں",
            canvas.width / 2,
            canvas.height / 2
        );

        return;
    }


    /* =================================================
       ORIGINAL IMAGE RATIO
       ================================================= */

    const imgWidth =
        productImage.naturalWidth;

    const imgHeight =
        productImage.naturalHeight;


    const panelWidth =
        Math.max(
            330,
            Math.min(
                430,
                imgWidth * .34
            )
        );


    const finalWidth =
        imgWidth +
        panelWidth;


    const finalHeight =
        imgHeight;


    canvas.width =
        finalWidth;

    canvas.height =
        finalHeight;


    /* BACKGROUND */

    ctx.fillStyle =
        "#ffffff";

    ctx.fillRect(
        0,
        0,
        finalWidth,
        finalHeight
    );


    /* =================================================
       IMAGE
       ================================================= */

    let imageX = 0;

    if (panelSide === "right") {

        imageX = 0;

    } else {

        imageX =
            panelWidth;
    }


    ctx.drawImage(
        productImage,
        imageX,
        0,
        imgWidth,
        imgHeight
    );


    /* =================================================
       PANEL
       ================================================= */

    let panelX;

    if (panelSide === "right") {

        panelX =
            imgWidth;

    } else {

        panelX =
            0;
    }


    const background =
        getPanelBackground();


    if (background === "dark") {

        ctx.fillStyle =
            "#171717";

    } else if (
        background === "light"
    ) {

        ctx.fillStyle =
            "#f7f7f7";

    } else if (
        background === "gold"
    ) {

        ctx.fillStyle =
            "#b8860b";

    } else if (
        background === "black"
    ) {

        ctx.fillStyle =
            "#000000";

    } else if (
        background === "blue"
    ) {

        ctx.fillStyle =
            "#12355b";

    } else {

        const gradient =
            ctx.createLinearGradient(
                panelX,
                0,
                panelX + panelWidth,
                finalHeight
            );

        gradient.addColorStop(
            0,
            "#111111"
        );

        gradient.addColorStop(
            .5,
            "#242424"
        );

        gradient.addColorStop(
            1,
            "#8b6914"
        );

        ctx.fillStyle =
            gradient;
    }


    ctx.fillRect(
        panelX,
        0,
        panelWidth,
        finalHeight
    );


    /* =================================================
       PANEL BORDER
       ================================================= */

    ctx.strokeStyle =
        "#d4af37";

    ctx.lineWidth = 5;

    ctx.strokeRect(
        panelX + 3,
        3,
        panelWidth - 6,
        finalHeight - 6
    );


    /* =================================================
       LOGO
       ================================================= */

    if (logoImage) {

        const maxLogoWidth =
            panelWidth * .45;

        const maxLogoHeight =
            90;

        let lw =
            logoImage.naturalWidth;

        let lh =
            logoImage.naturalHeight;


        const scale =
            Math.min(
                maxLogoWidth / lw,
                maxLogoHeight / lh,
                1
            );

        lw *= scale;
        lh *= scale;


        const logoX =
            panelX +
            (panelWidth - lw) / 2;

        const logoY = 25;


        ctx.drawImage(
            logoImage,
            logoX,
            logoY,
            lw,
            lh
        );
    }


    /* =================================================
       TITLE
       ================================================= */

    ctx.fillStyle =
        "#d4af37";

    ctx.font =
        "bold 24px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        "JANJUA TRADERS",
        panelX +
        panelWidth / 2,
        145
    );


    /* =================================================
       FEATURES
       ================================================= */

    let y = 200;

    const starRadius = 18;

    const textAreaWidth =
        panelWidth - 75;


    features.forEach(
        function(feature) {

            let style = "";

            if (feature.bold) {

                style += "bold ";
            }

            if (feature.italic) {

                style += "italic ";
            }


            const font =
                style +
                feature.fontSize +
                "px Arial";


            const lines =
                wrapText(
                    feature.text,
                    textAreaWidth,
                    font
                );


            /* STAR */

            const starX =
                panelSide === "right"
                    ? panelX + 35
                    : panelX +
                      panelWidth - 35;


            drawStar(
                starX,
                y - 8,
                starRadius,
                8,
                feature.starColor
            );


            /* TEXT */

            ctx.fillStyle =
                feature.color;

            ctx.font =
                font;

            ctx.textAlign =
                panelSide === "right"
                    ? "left"
                    : "right";


            let textX;

            if (
                panelSide === "right"
            ) {

                textX =
                    panelX + 65;

            } else {

                textX =
                    panelX +
                    panelWidth -
                    65;
            }


            lines.forEach(
                function(line) {

                    ctx.fillText(
                        line,
                        textX,
                        y
                    );


                    if (
                        feature.underline
                    ) {

                        const width =
                            ctx.measureText(
                                line
                            ).width;

                        let underlineX;

                        if (
                            panelSide === "right"
                        ) {

                            underlineX =
                                textX;

                        } else {

                            underlineX =
                                textX -
                                width;
                        }


                        ctx.strokeStyle =
                            feature.color;

                        ctx.lineWidth = 2;

                        ctx.beginPath();

                        ctx.moveTo(
                            underlineX,
                            y + 5
                        );

                        ctx.lineTo(
                            underlineX +
                            width,
                            y + 5
                        );

                        ctx.stroke();
                    }


                    y +=
                        feature.fontSize +
                        10;
                }
            );


            y += 25;
        }
    );


    /* =================================================
       FOOTER
       ================================================= */

    ctx.fillStyle =
        "#d4af37";

    ctx.font =
        "bold 18px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        "Digital Marketing Platform",
        panelX +
        panelWidth / 2,
        finalHeight - 35
    );

}


/* =====================================================
DOWNLOAD
===================================================== */

function downloadImage(type) {

    if (!productImage) {

        alert(
            "پہلے Product Image منتخب کریں۔"
        );

        return;
    }


    const link =
        document.createElement("a");


    if (type === "jpg") {

        link.download =
            "janjua-traders-product.jpg";

        link.href =
            canvas.toDataURL(
                "image/jpeg",
                0.95
            );

    } else {

        link.download =
            "janjua-traders-product.png";

        link.href =
            canvas.toDataURL(
                "image/png"
            );
    }


    link.click();
}


/* =====================================================
INITIAL
===================================================== */

draw();

</script>

</body>
</html>
