<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Janjua Traders Image Editor</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:12px;
    background:#e9edf2;
    font-family:Arial,"Noto Nastaliq Urdu",sans-serif;
    color:#222;
}

.editor{
    width:100%;
    max-width:1100px;
    margin:auto;
}

h1{
    text-align:center;
    font-size:22px;
    margin:5px 0 15px;
}

.controls{
    background:#fff;
    border-radius:15px;
    padding:14px;
    box-shadow:0 5px 20px rgba(0,0,0,.12);
    margin-bottom:15px;
}

.section{
    margin-bottom:15px;
}

.section label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

input[type="file"],
input[type="text"],
textarea,
select{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

textarea{
    min-height:55px;
}

button{
    border:0;
    border-radius:8px;
    padding:9px 12px;
    margin:3px;
    cursor:pointer;
    background:#222;
    color:#fff;
}

button:hover{
    opacity:.85;
}

.feature-buttons{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:6px;
}

.feature-buttons button{
    background:#333;
    min-height:42px;
}

.active{
    outline:3px solid #d4af37;
}

.color-grid{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
}

.color{
    width:34px;
    height:34px;
    padding:0;
    border:2px solid #999;
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
}

.green{
    background:#198754;
}

.blue{
    background:#1769aa;
}

.red{
    background:#c62828;
}

.gold{
    background:#b8860b;
}

.preview{
    background:#cfd4da;
    padding:10px;
    border-radius:15px;
    overflow:auto;
}

canvas{
    display:block;
    margin:auto;
    max-width:100%;
    height:auto;
    box-shadow:0 8px 25px rgba(0,0,0,.3);
}

.small{
    font-size:12px;
    color:#666;
}

#logoPreview{
    display:none;
    max-width:90px;
    max-height:60px;
    margin-top:7px;
}

</style>
</head>

<body>

<div class="editor">

<h1>Janjua Traders — Digital Marketing Editor</h1>

<div class="controls">

<!-- IMAGE -->

<div class="section">

<label>1۔ Product Image</label>

<input
type="file"
id="imageInput"
accept="image/*">

</div>


<!-- LOGO -->

<div class="section">

<label>2۔ اپنا Logo / Monogram</label>

<input
type="file"
id="logoInput"
accept="image/*">

<img
id="logoPreview">

</div>


<!-- PANEL SIDE -->

<div class="section">

<label>3۔ Information Panel</label>

<button
onclick="setSide('right')"
class="blue">

دائیں طرف Panel

</button>

<button
onclick="setSide('left')"
class="blue">

بائیں طرف Panel

</button>

</div>


<!-- FEATURES -->

<div class="section">

<label>
4۔ تیار عبارت — صرف Button دبائیں
</label>

<div class="feature-buttons">

<button onclick="selectFeature(1)">
⭐ 1 — خوبصورت
</button>

<button onclick="selectFeature(2)">
⭐ 2 — پائیدار
</button>

<button onclick="selectFeature(3)">
⭐ 3 — مضبوط
</button>

<button onclick="selectFeature(4)">
⭐ 4 — بہترین کوالٹی
</button>

<button onclick="selectFeature(5)">
⭐ 5 — کم قیمت
</button>

<button onclick="selectFeature(6)">
⭐ 6 — پاکستانی پروڈکٹ
</button>

<button onclick="selectFeature(7)">
⭐ 7 — بہترین انتخاب
</button>

<button onclick="selectFeature(8)">
⭐ 8 — قابل اعتماد
</button>

</div>

<p class="small">
Button دبانے سے Star اور عبارت خود اپنی مخصوص جگہ پر لگ جائے گی۔
</p>

</div>


<!-- CUSTOM TEXT -->

<div class="section">

<label>
5۔ اپنی مرضی کی عبارت
</label>

<textarea
id="customText"
placeholder="مثلاً: اصل اور معیاری پروڈکٹ">
</textarea>

<button
onclick="addCustomFeature()"
class="gold">

⭐ Custom عبارت شامل کریں

</button>

</div>


<!-- TEXT COLOR -->

<div class="section">

<label>
6۔ Text Color
</label>

<div class="color-grid">

<button
class="color"
style="background:#ffffff"
onclick="setTextColor('#ffffff')"></button>

<button
class="color"
style="background:#000000"
onclick="setTextColor('#000000')"></button>

<button
class="color"
style="background:#ff0000"
onclick="setTextColor('#ff0000')"></button>

<button
class="color"
style="background:#ffd700"
onclick="setTextColor('#ffd700')"></button>

<button
class="color"
style="background:#00aaff"
onclick="setTextColor('#00aaff')"></button>

<button
class="color"
style="background:#00c853"
onclick="setTextColor('#00c853')"></button>

<button
class="color"
style="background:#ff6d00"
onclick="setTextColor('#ff6d00')"></button>

<button
class="color"
style="background:#e91e63"
onclick="setTextColor('#e91e63')"></button>

<button
class="color"
style="background:#9c27b0"
onclick="setTextColor('#9c27b0')"></button>

<button
class="color"
style="background:#00bcd4"
onclick="setTextColor('#00bcd4')"></button>

<button
class="color"
style="background:#795548"
onclick="setTextColor('#795548')"></button>

<button
class="color"
style="background:#c0c0c0"
onclick="setTextColor('#c0c0c0')"></button>

</div>

</div>


<!-- STAR COLOR -->

<div class="section">

<label>
7۔ Star Color
</label>

<div class="color-grid">

<button
class="color"
style="background:#ffd700"
onclick="setStarColor('#ffd700')"></button>

<button
class="color"
style="background:#ffffff"
onclick="setStarColor('#ffffff')"></button>

<button
class="color"
style="background:#000000"
onclick="setStarColor('#000000')"></button>

<button
class="color"
style="background:#ff0000"
onclick="setStarColor('#ff0000')"></button>

<button
class="color"
style="background:#00aaff"
onclick="setStarColor('#00aaff')"></button>

<button
class="color"
style="background:#00c853"
onclick="setStarColor('#00c853')"></button>

<button
class="color"
style="background:#ff6d00"
onclick="setStarColor('#ff6d00')"></button>

<button
class="color"
style="background:#e91e63"
onclick="setStarColor('#e91e63')"></button>

<button
class="color"
style="background:#9c27b0"
onclick="setStarColor('#9c27b0')"></button>

</div>

</div>


<!-- FONT SIZE -->

<div class="section">

<label>
8۔ Font Size:
<span id="sizeValue">26</span> px
</label>

<input
type="range"
id="fontSize"
min="14"
max="42"
value="26"
oninput="changeSize()">

</div>


<!-- FORMAT -->

<div class="section">

<label>
9۔ Text Style
</label>

<button onclick="toggleBold()">
<b>B</b>
</button>

<button onclick="toggleItalic()">
<i>I</i>
</button>

<button onclick="toggleUnderline()">
<u>U</u>
</button>

</div>


<!-- REMOVE -->

<div class="section">

<button
onclick="removeSelected()"
class="red">

Selected Feature ختم کریں

</button>

<button
onclick="clearAll()"
class="red">

تمام Features ختم کریں

</button>

</div>


<!-- DOWNLOAD -->

<div class="section actions">

<button
onclick="downloadJPG()"
class="green">

JPG Download

</button>

<button
onclick="downloadPNG()"
class="blue">

PNG Download

</button>

</div>

</div>


<!-- PREVIEW -->

<div class="preview">

<canvas id="canvas"></canvas>

</div>

</div>


<script>

/* =====================================================
   SETTINGS
===================================================== */

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

let productImage = null;

let logoImage = null;

let panelSide = "right";

let textColor = "#ffffff";

let starColor = "#ffd700";

let fontSize = 26;

let bold = false;

let italic = false;

let underline = false;

let selectedFeature = null;


/* =====================================================
   FIXED FEATURES
===================================================== */

const featureNames = {

1:"خوبصورت",

2:"پائیدار",

3:"مضبوط",

4:"بہترین کوالٹی",

5:"کم قیمت",

6:"پاکستانی پروڈکٹ",

7:"بہترین انتخاب",

8:"قابل اعتماد"

};


/* =====================================================
   FEATURES DATA
===================================================== */

let features = {};


/* =====================================================
   IMAGE
===================================================== */

document
.getElementById("imageInput")
.addEventListener(
"change",
function(e){

    const file =
    e.target.files[0];

    if(!file) return;

    const reader =
    new FileReader();

    reader.onload =
    function(event){

        const img =
        new Image();

        img.onload =
        function(){

            productImage =
            img;

            draw();

        };

        img.src =
        event.target.result;

    };

    reader.readAsDataURL(file);

});


/* =====================================================
   LOGO
===================================================== */

document
.getElementById("logoInput")
.addEventListener(
"change",
function(e){

    const file =
    e.target.files[0];

    if(!file) return;

    const reader =
    new FileReader();

    reader.onload =
    function(event){

        const img =
        new Image();

        img.onload =
        function(){

            logoImage =
            img;

            document
            .getElementById(
                "logoPreview"
            )
            .src =
            event.target.result;

            document
            .getElementById(
                "logoPreview"
            )
            .style.display =
            "block";

            draw();

        };

        img.src =
        event.target.result;

    };

    reader.readAsDataURL(file);

});


/* =====================================================
   PANEL SIDE
===================================================== */

function setSide(side){

    panelSide =
    side;

    draw();

}


/* =====================================================
   SELECT FEATURE
===================================================== */

function selectFeature(number){

    selectedFeature =
    number;


    /*
     * اگر پہلی دفعہ دبایا گیا ہے
     * تو وہ feature خود add ہوگا۔
     */

    if(!features[number]){

        features[number] = {

            text:
            featureNames[number],

            textColor:
            textColor,

            starColor:
            starColor,

            size:
            fontSize,

            bold:
            bold,

            italic:
            italic,

            underline:
            underline

        };

    }

    else{

        /*
         * دوبارہ button دبانے پر
         * اس feature کی موجودہ style
         * برقرار رہے گی۔
         */

    }


    draw();

}


/* =====================================================
   CUSTOM FEATURE
===================================================== */

function addCustomFeature(){

    const text =
    document
    .getElementById(
        "customText"
    )
    .value
    .trim();

    if(!text){

        alert(
            "پہلے اپنی عبارت لکھیں۔"
        );

        return;

    }


    /*
     * اگلی available جگہ
     */

    let number = 1;

    while(features[number]){
        number++;
    }

    if(number > 8){

        alert(
            "تمام 8 جگہیں استعمال ہو چکی ہیں۔"
        );

        return;

    }


    features[number] = {

        text:text,

        textColor:
        textColor,

        starColor:
        starColor,

        size:
        fontSize,

        bold:
        bold,

        italic:
        italic,

        underline:
        underline

    };


    selectedFeature =
    number;


    document
    .getElementById(
        "customText"
    )
    .value = "";


    draw();

}


/* =====================================================
   TEXT COLOR
===================================================== */

function setTextColor(color){

    textColor =
    color;


    if(selectedFeature &&
       features[selectedFeature]){

        features[selectedFeature]
        .textColor =
        color;

    }


    draw();

}


/* =====================================================
   STAR COLOR
===================================================== */

function setStarColor(color){

    starColor =
    color;


    if(selectedFeature &&
       features[selectedFeature]){

        features[selectedFeature]
        .starColor =
        color;

    }


    draw();

}


/* =====================================================
   FONT SIZE
===================================================== */

function changeSize(){

    fontSize =
    parseInt(
        document
        .getElementById(
            "fontSize"
        )
        .value
    );


    document
    .getElementById(
        "sizeValue"
    )
    .textContent =
    fontSize;


    if(selectedFeature &&
       features[selectedFeature]){

        features[selectedFeature]
        .size =
        fontSize;

    }


    draw();

}


/* =====================================================
   FORMAT
===================================================== */

function toggleBold(){

    bold =
    !bold;


    if(selectedFeature &&
       features[selectedFeature]){

        features[selectedFeature]
        .bold =
        bold;

    }


    draw();

}


function toggleItalic(){

    italic =
    !italic;


    if(selectedFeature &&
       features[selectedFeature]){

        features[selectedFeature]
        .italic =
        italic;

    }


    draw();

}


function toggleUnderline(){

    underline =
    !underline;


    if(selectedFeature &&
       features[selectedFeature]){

        features[selectedFeature]
        .underline =
        underline;

    }


    draw();

}


/* =====================================================
   REMOVE
===================================================== */

function removeSelected(){

    if(!selectedFeature){

        alert(
            "پہلے Feature button منتخب کریں۔"
        );

        return;

    }


    delete features[
        selectedFeature
    ];


    selectedFeature =
    null;

    draw();

}


/* =====================================================
   CLEAR
===================================================== */

function clearAll(){

    features = {};

    selectedFeature =
    null;

    draw();

}


/* =====================================================
   PANEL COLOR
===================================================== */

function getPanelGradient(
    x,
    width
){

    const gradient =
    ctx.createLinearGradient(
        x,
        0,
        x + width,
        0
    );


    gradient.addColorStop(
        0,
        "#111111"
    );

    gradient.addColorStop(
        .5,
        "#292929"
    );

    gradient.addColorStop(
        1,
        "#0b0b0b"
    );


    return gradient;

}


/* =====================================================
   STAR
===================================================== */

function drawStar(
    x,
    y,
    color
){

    const outer =
    20;

    const inner =
    9;

    const spikes =
    5;

    let rotation =
    -Math.PI / 2;

    const step =
    Math.PI / spikes;


    ctx.save();

    ctx.beginPath();


    for(
        let i=0;
        i<spikes;
        i++
    ){

        ctx.lineTo(
            x +
            Math.cos(rotation) *
            outer,

            y +
            Math.sin(rotation) *
            outer
        );

        rotation +=
        step;

        ctx.lineTo(
            x +
            Math.cos(rotation) *
            inner,

            y +
            Math.sin(rotation) *
            inner
        );

        rotation +=
        step;

    }


    ctx.closePath();

    ctx.fillStyle =
    color;

    ctx.fill();

    ctx.restore();

}


/* =====================================================
   TEXT WRAP
===================================================== */

function wrapText(
    text,
    maxWidth,
    font
){

    ctx.font =
    font;

    const words =
    text.split(" ");

    const lines = [];

    let line = "";


    for(
        let i=0;
        i<words.length;
        i++
    ){

        const test =
        line +
        (line ? " " : "") +
        words[i];


        if(
            ctx.measureText(
                test
            ).width >
            maxWidth &&
            line
        ){

            lines.push(
                line
            );

            line =
            words[i];

        }
        else{

            line =
            test;

        }

    }


    if(line){

        lines.push(
            line
        );

    }


    return lines;

}


/* =====================================================
   DRAW
===================================================== */

function draw(){

    if(!productImage){

        canvas.width =
        900;

        canvas.height =
        600;


        ctx.fillStyle =
        "#ddd";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        ctx.fillStyle =
        "#555";

        ctx.font =
        "25px Arial";

        ctx.textAlign =
        "center";

        ctx.fillText(
            "Product Image منتخب کریں",
            450,
            300
        );

        return;

    }


    const iw =
    productImage.naturalWidth;

    const ih =
    productImage.naturalHeight;


    /*
     * PANEL تقریباً تصویر کے برابر
     * یعنی مکمل فریم کا تقریباً آدھا۔
     */

    const panelWidth =
    Math.round(
        iw
    );


    canvas.width =
    iw +
    panelWidth;

    canvas.height =
    ih;


    /* BACKGROUND */

    ctx.fillStyle =
    "#111";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    let imageX;


    if(panelSide === "right"){

        imageX = 0;

    }
    else{

        imageX =
        panelWidth;

    }


    /*
     * ORIGINAL IMAGE
     */

    ctx.drawImage(
        productImage,
        imageX,
        0,
        iw,
        ih
    );


    /*
     * PANEL
     */

    let panelX;


    if(panelSide === "right"){

        panelX =
        iw;

    }
    else{

        panelX = 0;

    }


    ctx.fillStyle =
    getPanelGradient(
        panelX,
        panelWidth
    );

    ctx.fillRect(
        panelX,
        0,
        panelWidth,
        ih
    );


    /*
     * GOLD BORDER
     */

    ctx.strokeStyle =
    "#d4af37";

    ctx.lineWidth =
    7;

    ctx.strokeRect(
        panelX + 5,
        5,
        panelWidth - 10,
        ih - 10
    );


    /*
     * LOGO
     */

    if(logoImage){

        const maxWidth =
        panelWidth * .28;

        const maxHeight =
        80;

        let lw =
        logoImage.naturalWidth;

        let lh =
        logoImage.naturalHeight;


        const scale =
        Math.min(
            maxWidth / lw,
            maxHeight / lh,
            1
        );


        lw *=
        scale;

        lh *=
        scale;


        ctx.drawImage(
            logoImage,

            panelX +
            (panelWidth-lw)/2,

            25,

            lw,
            lh
        );

    }


    /*
     * TITLE
     */

    ctx.fillStyle =
    "#d4af37";

    ctx.font =
    "bold 25px Arial";

    ctx.textAlign =
    "center";

    ctx.fillText(
        "JANJUA TRADERS",

        panelX +
        panelWidth/2,

        135
    );


    ctx.fillStyle =
    "#ffffff";

    ctx.font =
    "15px Arial";

    ctx.fillText(
        "DIGITAL MARKETING",

        panelX +
        panelWidth/2,

        160
    );


    /*
     * FEATURES
     */

    let y =
    220;


    for(
        let number=1;
        number<=8;
        number++
    ){

        const item =
        features[number];


        if(!item)
            continue;


        const starX =
        panelX +
        48;


        /*
         * STAR
         */

        drawStar(
            starX,
            y - 8,
            item.starColor
        );


        /*
         * FONT
         */

        let fontStyle =
        "";

        if(item.bold)
            fontStyle +=
            "bold ";

        if(item.italic)
            fontStyle +=
            "italic ";


        const font =
        fontStyle +
        item.size +
        "px Arial";


        /*
         * TEXT
         */

        ctx.font =
        font;

        ctx.fillStyle =
        item.textColor;

        ctx.textAlign =
        "left";


        const maxWidth =
        panelWidth -
        90;


        const lines =
        wrapText(
            item.text,
            maxWidth,
            font
        );


        lines.forEach(
            function(line){

                ctx.fillText(
                    line,
                    panelX + 82,
                    y
                );


                if(item.underline){

                    const width =
                    ctx.measureText(
                        line
                    ).width;


                    ctx.strokeStyle =
                    item.textColor;

                    ctx.lineWidth =
                    2;

                    ctx.beginPath();

                    ctx.moveTo(
                        panelX + 82,
                        y + 5
                    );

                    ctx.lineTo(
                        panelX + 82 + width,
                        y + 5
                    );

                    ctx.stroke();

                }


                y +=
                item.size + 10;

            }
        );


        y +=
        25;


        /*
         * اگر نیچے جگہ ختم ہو جائے
         */

        if(
            y >
            ih - 55
        ){

            break;

        }

    }


    /*
     * FOOTER
     */

    ctx.fillStyle =
    "#d4af37";

    ctx.font =
    "bold 15px Arial";

    ctx.textAlign =
    "center";

    ctx.fillText(
        "QUALITY • VALUE • TRUST",

        panelX +
        panelWidth/2,

        ih - 25
    );

}


/* =====================================================
   JPG
===================================================== */

function downloadJPG(){

    if(!productImage){

        alert(
            "پہلے تصویر منتخب کریں۔"
        );

        return;

    }


    const link =
    document.createElement(
        "a"
    );


    link.download =
    "janjua-traders.jpg";


    link.href =
    canvas.toDataURL(
        "image/jpeg",
        .95
    );


    link.click();

}


/* =====================================================
   PNG
===================================================== */

function downloadPNG(){

    if(!productImage){

        alert(
            "پہلے تصویر منتخب کریں۔"
        );

        return;

    }


    const link =
    document.createElement(
        "a"
    );


    link.download =
    "janjua-traders.png";


    link.href =
    canvas.toDataURL(
        "image/png"
    );


    link.click();

}


/* =====================================================
   START
===================================================== */

draw();

</script>

</body>
</html>
