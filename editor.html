<script>

document.addEventListener("DOMContentLoaded", function(){

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const W = 1080;
const H = 1350;

let productImage = null;
let logoImage = null;

let features = [];

let textColor = "#ffffff";
let starColor = "#D4AF37";
let panelColor = "#111111";

let fontSize = 34;

let isBold = true;
let isItalic = false;
let isUnderline = false;


/* ==========================================
   IMAGE LOAD
========================================== */

function loadImage(file, callback){

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(e){

        const img = new Image();

        img.onload = function(){

            callback(img);

            draw();

        };

        img.src = e.target.result;

    };

    reader.readAsDataURL(file);

}


/* ==========================================
   FIT IMAGE
========================================== */

function drawImageCover(img, x, y, w, h){

    const scale =
        Math.max(
            w / img.width,
            h / img.height
        );

    const newW =
        img.width * scale;

    const newH =
        img.height * scale;

    const dx =
        x + (w - newW) / 2;

    const dy =
        y + (h - newH) / 2;

    ctx.save();

    ctx.beginPath();

    ctx.rect(x,y,w,h);

    ctx.clip();

    ctx.drawImage(
        img,
        dx,
        dy,
        newW,
        newH
    );

    ctx.restore();

}


/* ==========================================
   STAR
========================================== */

function drawStar(cx,cy,r,color){

    ctx.save();

    ctx.fillStyle = color;

    ctx.beginPath();

    for(let i=0;i<10;i++){

        const angle =
            -Math.PI / 2 +
            i * Math.PI / 5;

        const radius =
            i % 2 === 0
                ? r
                : r * 0.45;

        const x =
            cx +
            Math.cos(angle) * radius;

        const y =
            cy +
            Math.sin(angle) * radius;

        if(i===0)
            ctx.moveTo(x,y);
        else
            ctx.lineTo(x,y);

    }

    ctx.closePath();

    ctx.fill();

    ctx.restore();

}


/* ==========================================
   TEXT
========================================== */

function drawText(text,x,y){

    let style = "";

    if(isItalic)
        style += "italic ";

    if(isBold)
        style += "bold ";

    ctx.font =
        style +
        fontSize +
        "px Arial";

    ctx.fillStyle =
        textColor;

    ctx.textAlign =
        "right";

    ctx.textBaseline =
        "middle";

    ctx.fillText(
        text,
        x,
        y
    );

}


/* ==========================================
   DRAW
========================================== */

function draw(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    /* background */

    ctx.fillStyle =
        "#ffffff";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* IMAGE AREA */

    const imageX = 30;
    const imageY = 30;
    const imageW = 1020;
    const imageH = 820;


    /* frame */

    ctx.fillStyle =
        "#eeeeee";

    ctx.fillRect(
        imageX,
        imageY,
        imageW,
        imageH
    );


    if(productImage){

        drawImageCover(
            productImage,
            imageX,
            imageY,
            imageW,
            imageH
        );

    }


    /* PRICE BADGE */

    const price =
        document.getElementById(
            "priceInput"
        ).value || "0";

    const delivery =
        document.getElementById(
            "deliveryInput"
        ).value || "0";


    ctx.fillStyle =
        "#C62828";

    ctx.beginPath();

    ctx.roundRect(
        60,
        70,
        300,
        90,
        18
    );

    ctx.fill();


    ctx.fillStyle =
        "#ffffff";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.font =
        "bold 38px Arial";

    ctx.fillText(
        "Rs. " +
        Number(price).toLocaleString(),
        210,
        115
    );


    /* LOGO */

    if(logoImage){

        const maxLogo =
            130;

        const scale =
            Math.min(
                maxLogo / logoImage.width,
                maxLogo / logoImage.height
            );

        const lw =
            logoImage.width * scale;

        const lh =
            logoImage.height * scale;

        ctx.drawImage(
            logoImage,
            W - lw - 55,
            55,
            lw,
            lh
        );

    }


    /* ==========================
       INFORMATION PANEL
    ========================== */

    const panelY = 880;
    const panelH = 440;

    ctx.fillStyle =
        panelColor;

    ctx.fillRect(
        30,
        panelY,
        1020,
        panelH
    );


    /* PRODUCT NAME */

    const productName =
        document.getElementById(
            "productName"
        ).value.trim();


    if(productName){

        ctx.fillStyle =
            textColor;

        ctx.textAlign =
            "right";

        ctx.font =
            "bold 42px Arial";

        ctx.fillText(
            productName,
            1000,
            panelY + 55
        );

    }


    /* FEATURES */

    let startY =
        panelY + 115;

    const maxFeatures = 5;

    features
        .slice(0,maxFeatures)
        .forEach(function(item,index){

            const y =
                startY +
                index * 58;

            drawStar(
                990,
                y,
                21,
                item.starColor ||
                starColor
            );

            ctx.fillStyle =
                item.color ||
                textColor;

            ctx.textAlign =
                "right";

            let style = "";

            if(item.italic)
                style += "italic ";

            if(item.bold)
                style += "bold ";

            ctx.font =
                style +
                (item.size || fontSize) +
                "px Arial";

            ctx.fillText(
                item.text,
                950,
                y
            );

        });


    /* DELIVERY */

    const deliveryCaption =
        document.getElementById(
            "deliveryCaption"
        ).value.trim();


    ctx.fillStyle =
        "#ffffff";

    ctx.font =
        "bold 27px Arial";

    ctx.textAlign =
        "right";

    ctx.fillText(
        deliveryCaption ||
        "پورے پاکستان میں فری ڈلیوری",
        1000,
        panelY + panelH - 70
    );


    /* TOTAL */

    const total =
        Number(price || 0) *
        1 +
        Number(delivery || 0);


    ctx.fillStyle =
        "#D4AF37";

    ctx.font =
        "bold 32px Arial";

    ctx.fillText(
        "Total: Rs. " +
        total.toLocaleString(),
        1000,
        panelY + panelH - 25
    );

}


/* ==========================================
   ADD FEATURE
========================================== */

function addFeature(text){

    if(!text)
        return;

    features.push({

        id:Date.now() +
            Math.random(),

        text:text,

        color:textColor,

        starColor:starColor,

        size:fontSize,

        bold:isBold,

        italic:isItalic

    });

    updateFeatureList();

    draw();

}


/* ==========================================
   FEATURE LIST
========================================== */

function updateFeatureList(){

    const list =
        document.getElementById(
            "featureList"
        );

    list.innerHTML = "";

    features.forEach(function(item){

        const div =
            document.createElement(
                "div"
            );

        div.className =
            "feature-item";


        const star =
            document.createElement(
                "span"
            );

        star.textContent =
            "★";

        star.style.color =
            item.starColor;


        const text =
            document.createElement(
                "span"
            );

        text.textContent =
            item.text;


        const remove =
            document.createElement(
                "button"
            );

        remove.className =
            "remove-feature";

        remove.textContent =
            "×";


        remove.onclick =
            function(){

                features =
                    features.filter(
                        function(f){
                            return f.id !== item.id;
                        }
                    );

                updateFeatureList();

                draw();

            };


        div.appendChild(star);

        div.appendChild(text);

        div.appendChild(remove);

        list.appendChild(div);

    });

}


/* ==========================================
   COUNTRY
========================================== */

document.getElementById(
    "addCountry"
).onclick = function(){

    const value =
        document.getElementById(
            "countrySelect"
        ).value;

    if(value){

        addFeature(

========================================== */

).onclick = function(){

).oninput =
function(){

    textColor =

};

    "starColor"
).oninput =

    draw();

};


document.getElementById(
    "panelColor"
).oninput =
function(){

    draw();

};

   FONT SIZE
========================================== */

document.getElementById(
    "fontSize"
).oninput =
function(){

    fontSize =
        Number(this.value);

    draw();

};


/* ==========================================
   BOLD
========================================== */

document.getElementById(
    "boldBtn"
).onclick =
function(){

    isBold =
        !isBold;

    this.style.opacity =
        isBold ? "1" : ".5";

    draw();

};


/* ==========================================
   ITALIC
========================================== */

document.getElementById(
    "italicBtn"
).onclick =
function(){

    isItalic =
        !isItalic;

    this.style.opacity =
        isItalic ? "1" : ".5";

    draw();

};


/* ==========================================
   UNDERLINE
========================================== */

document.getElementById(
    "underlineBtn"
).onclick =
function(){

    isUnderline =
        !isUnderline;

    this.style.opacity =
        isUnderline ? "1" : ".5";

/* ==========================================
   IMAGE
========================================== */

document.getElementById(
    "imageInput"
).onchange =

    loadImage(

/* ==========================================
   LOGO
========================================== */

document.getElementById(
    "logoInput"
).onchange =
function(){

    loadImage(
        this.files[0],
        function(img){

            logoImage =
                img;

        }
    );

};


/* ==========================================
   LIVE PRICE
========================================== */

[
    "priceInput",
    "deliveryInput",
    "deliveryCaption",
    "productName",
    "productDescription"
].forEach(function(id){

    document.getElementById(id)
        .addEventListener(
            "input",
            draw
        );

});


/* ==========================================
   CLEAR
========================================== */

document.getElementById(
    "clearAll"
).onclick =
function(){

    features = [];

    productImage = null;

    logoImage = null;

    document.getElementById(
        "imageInput"
    ).value = "";

    document.getElementById(
        "logoInput"
    ).value = "";

    document.getElementById(
        "productName"
    ).value = "";

    document.getElementById(
        "productDescription"
    ).value = "";

    document.getElementById(
        "customText"
    ).value = "";

    updateFeatureList();

    draw();

};


/* ==========================================
   DOWNLOAD
========================================== */

function download(type){

    const link =
        document.createElement(
            "a"
        );

    if(type === "jpg"){

        link.download =
            "Janjua-Traders-Product.jpg";

        link.href =
            canvas.toDataURL(
                "image/jpeg",
                .95
            );

    }else{

        link.download =
            "Janjua-Traders-Product.png";

        link.href =
            canvas.toDataURL(
                "image/png"
            );

    }

    link.click();

}


document.getElementById(
    "downloadJPG"
).onclick =
function(){

    download("jpg");

};


document.getElementById(
    "downloadPNG"
).onclick =
function(){

    download("png");

};
