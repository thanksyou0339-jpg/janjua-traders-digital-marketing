<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Janjua Traders - Designer Editor</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:12px;
    background:#eef1f5;
    font-family:Arial,"Noto Nastaliq Urdu",sans-serif;
    color:#222;
}

.editor{
    max-width:1200px;
    margin:auto;
}

h1{
    text-align:center;
    font-size:22px;
    margin:8px 0 16px;
}

.controls{
    background:#fff;
    padding:15px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.10);
    margin-bottom:18px;
}

.group{
    margin-bottom:15px;
}

.group label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

input[type="file"],
input[type="text"],
textarea,
select{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:9px;
    font-size:15px;
}

textarea{
    min-height:60px;
    resize:vertical;
}

button{
    border:0;
    border-radius:8px;
    padding:10px 13px;
    margin:3px;
    cursor:pointer;
    background:#222;
    color:white;
}

button:hover{
    opacity:.86;
}

.color-grid{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
}

.color-btn{
    width:36px;
    height:36px;
    padding:0;
    border:2px solid #bbb;
}

.star-btn{
    width:36px;
    height:36px;
    padding:0;
    border-radius:50%;
    border:2px solid #bbb;
}

.format button{
    min-width:48px;
}

.primary{
    background:#198754;
}

.blue{
    background:#1769aa;
}

.red{
    background:#c62828;
}

.gold{
    background:#b8860b;
}

.preview{
    background:#d9dde3;
    padding:15px;
    border-radius:15px;
    overflow:auto;
}

#canvas{
    display:block;
    max-width:100%;
    height:auto;
    margin:auto;
    box-shadow:0 7px 25px rgba(0,0,0,.25);
}

.feature-list{
    margin-top:10px;
}

.feature-item{
    background:#f5f5f5;
    border:1px solid #ddd;
    padding:10px;
    border-radius:9px;
    margin-top:7px;
    font-size:14px;
}

.logo-preview{
    display:none;
    max-width:100px;
    max-height:70px;
    margin-top:8px;
}

.note{
    color:#666;
    font-size:12px;
}
</style>
</head>

<body>

<div class="editor">

<h1>Janjua Traders — Designer Image Editor</h1>

<div class="controls">

<!-- IMAGE -->
<div class="group">
<label>پروڈکٹ تصویر</label>
<input type="file" id="imageInput" accept="image/*">
</div>


<!-- LOGO -->
<div class="group">
<label>اپنا Logo / Monogram</label>
<input type="file" id="logoInput" accept="image/*">
<img id="logoPreview" class="logo-preview">
</div>


<!-- PANEL SIDE -->
<div class="group">
<label>Information Panel کی جگہ</label>

<button onclick="setPanelSide('right')" class="blue">
دائیں طرف
</button>

<button onclick="setPanelSide('left')" class="blue">
بائیں طرف
</button>
</div>


<!-- PANEL DESIGN -->
<div class="group">
<label>Designer Panel Style</label>

<select id="panelStyle" onchange="draw()">

<option value="premium">
Premium Gold
</option>

<option value="black">
Black Luxury
</option>

<option value="navy">
Navy Premium
</option>

<option value="wine">
Wine Designer
</option>

<option value="green">
Emerald
</option>

<option value="purple">
Royal Purple
</option>

</select>
</div>


<!-- TEXT -->
<div class="group">

<label>نئی عبارت</label>

<textarea
id="featureText"
placeholder="مثلاً: مضبوط اور پائیدار کوالٹی"
></textarea>

</div>


<!-- TEXT SIZE -->
<div class="group">

<label>
عبارت کا سائز:
<span id="fontSizeValue">28</span> px
</label>

<input
type="range"
id="fontSize"
min="16"
max="55"
value="28"
oninput="changeFontSize()"
>

</div>


<!-- TEXT COLOR -->
<div class="group">

<label>عبارت کا رنگ</label>

<div class="color-grid">

<button class="color-btn"
style="background:#ffffff"
onclick="setTextColor('#ffffff')"></button>

<button class="color-btn"
style="background:#000000"
onclick="setTextColor('#000000')"></button>

<button class="color-btn"
style="background:#ff0000"
onclick="setTextColor('#ff0000')"></button>

<button class="color-btn"
style="background:#ffd700"
onclick="setTextColor('#ffd700')"></button>

<button class="color-btn"
style="background:#00aaff"
onclick="setTextColor('#00aaff')"></button>

<button class="color-btn"
style="background:#00c853"
onclick="setTextColor('#00c853')"></button>

<button class="color-btn"
style="background:#ff6d00"
onclick="setTextColor('#ff6d00')"></button>

<button class="color-btn"
style="background:#e91e63"
onclick="setTextColor('#e91e63')"></button>

<button class="color-btn"
style="background:#9c27b0"
onclick="setTextColor('#9c27b0')"></button>

<button class="color-btn"
style="background:#00bcd4"
onclick="setTextColor('#00bcd4')"></button>

<button class="color-btn"
style="background:#795548"
onclick="setTextColor('#795548')"></button>

<button class="color-btn"
style="background:#c0c0c0"
onclick="setTextColor('#c0c0c0')"></button>

</div>
</div>


<!-- STAR COLOR -->
<div class="group">

<label>⭐ Star کا رنگ</label>

<div class="color-grid">

<button class="star-btn"
style="background:#ffd700"
onclick="setStarColor('#ffd700')"></button>

<button class="star-btn"
style="background:#ffffff"
onclick="setStarColor('#ffffff')"></button>

<button class="star-btn"
style="background:#000000"
onclick="setStarColor('#000000')"></button>

<button class="star-btn"
style="background:#ff0000"
onclick="setStarColor('#ff0000')"></button>

<button class="star-btn"
style="background:#00aaff"
onclick="setStarColor('#00aaff')"></button>

<button class="star-btn"
style="background:#00c853"
onclick="setStarColor('#00c853')"></button>

<button class="star-btn"
style="background:#ff6d00"
onclick="setStarColor('#ff6d00')"></button>

<button class="star-btn"
style="background:#e91e63"
onclick="setStarColor('#e91e63')"></button>

<button class="star-btn"
style="background:#9c27b0"
onclick="setStarColor('#9c27b0')"></button>

</div>
</div>


<!-- FORMAT -->
<div class="group">

<label>Text Style</label>

<div class="format">

<button onclick="toggleBold()">
<b>B</b>
</button>

<button onclick="toggleItalic()">
<i>I</i>
</button>

<button onclick="toggleUnderline()">
<u>U</u>
</button>

</div>

</div>


<!-- PRESET -->
<div class="group">

<label>تیار عبارتیں</label>

<button onclick="preset('پاکستانی پروڈکٹ')">
پاکستان
</button>

<button onclick="preset('مضبوط اور پائیدار چیز')">
پائیداری
</button>

<button onclick="preset('بہترین کوالٹی')">
کوالٹی
</button>

<button onclick="preset('کم قیمت')">
کم قیمت
</button>

<button onclick="preset('خوبصورت ڈیزائن')">
ڈیزائن
</button>

<button onclick="preset('بہترین انتخاب')">
بہترین انتخاب
</button>

</div>


<!-- ADD -->
<div class="group">

<button
onclick="addFeature()"
class="primary">

⭐ عبارت کو Panel میں شامل کریں

</button>

<button
onclick="removeLast()"
class="red">

آخری عبارت ختم کریں

</button>

<button
onclick="clearFeatures()"
class="red">

تمام عبارتیں ختم کریں

</button>

</div>


<!-- DOWNLOAD -->
<div class="group">

<button
onclick="downloadImage('jpg')"
class="primary">

JPG Download

</button>

<button
onclick="downloadImage('png')"
class="blue">

PNG Download

</button>

</div>

</div>


<!-- FEATURE LIST -->
<div id="featureList"
class="feature-list">
</div>


<!-- CANVAS -->
<div class="preview">
<canvas id="canvas"></canvas>
</div>

</div>


<script>

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

let productImage = null;
let logoImage = null;

let panelSide = "right";

let textColor = "#ffffff";
let starColor = "#ffd700";

let fontSize = 28;

let bold = false;
let italic = false;
let underline = false;

let features = [];


/* =========================================
IMAGE
========================================= */

document
.getElementById("imageInput")
.addEventListener("change", function(e){

    const file = e.target.files[0];

    if(!file) return;

    const reader =
    new FileReader();

    reader.onload =
    function(event){

        const img =
        new Image();

        img.onload =
        function(){

            productImage = img;

            draw();

        };

        img.src =
        event.target.result;

    };

    reader.readAsDataURL(file);

});


/* =========================================
LOGO
========================================= */

document
.getElementById("logoInput")
.addEventListener("change", function(e){

    const file = e.target.files[0];

    if(!file) return;

    const reader =
    new FileReader();

    reader.onload =
    function(event){

        const img =
        new Image();

        img.onload =
        function(){

            logoImage = img;

            document
            .getElementById("logoPreview")
            .src =
            event.target.result;

            document
            .getElementById("logoPreview")
            .style.display =
            "block";

            draw();

        };

        img.src =
        event.target.result;

    };

    reader.readAsDataURL(file);

});


/* =========================================
SIDE
========================================= */

function setPanelSide(side){

    panelSide = side;

    draw();
}


/* =========================================
TEXT COLOR
========================================= */

function setTextColor(color){

    textColor = color;

}


/* =========================================
STAR COLOR
========================================= */

function setStarColor(color){

    starColor = color;

}


/* =========================================
FONT SIZE
========================================= */

function changeFontSize(){

    fontSize =
    parseInt(
        document.getElementById(
            "fontSize"
        ).value
    );

    document.getElementById(
        "fontSizeValue"
    ).textContent =
    fontSize;

}


/* =========================================
FORMAT
========================================= */

function toggleBold(){

    bold = !bold;

}

function toggleItalic(){

    italic = !italic;

}

function toggleUnderline(){

    underline = !underline;

}


/* =========================================
PRESET
========================================= */

function preset(text){

    document.getElementById(
        "featureText"
    ).value = text;

}


/* =========================================
ADD FEATURE
========================================= */

function addFeature(){

    const text =
    document.getElementById(
        "featureText"
    ).value.trim();

    if(!text){

        alert(
            "پہلے عبارت لکھیں یا کوئی preset منتخب کریں۔"
        );

        return;
    }


    features.push({

        text:text,

        color:textColor,

        starColor:starColor,

        size:fontSize,

        bold:bold,

        italic:italic,

        underline:underline

    });


    document.getElementById(
        "featureText"
    ).value = "";


    updateFeatureList();

    draw();

}


/* =========================================
REMOVE
========================================= */

function removeLast(){

    if(features.length){

        features.pop();

        updateFeatureList();

        draw();

    }

}


function clearFeatures(){

    features = [];

    updateFeatureList();

    draw();

}


/* =========================================
FEATURE LIST
========================================= */

function updateFeatureList(){

    const box =
    document.getElementById(
        "featureList"
    );

    box.innerHTML = "";

    features.forEach(
        function(item,index){

            const div =
            document.createElement(
                "div"
            );

            div.className =
            "feature-item";

            div.innerHTML =
            "⭐ " +
            item.text +
            " — Text: " +
            item.color +
            " — Star: " +
            item.starColor;

            box.appendChild(div);

        }
    );

}


/* =========================================
PANEL DESIGN
========================================= */

function panelGradient(x,width,height){

    const style =
    document.getElementById(
        "panelStyle"
    ).value;

    let gradient =
    ctx.createLinearGradient(
        x,
        0,
        x + width,
        height
    );


    if(style === "premium"){

        gradient.addColorStop(
            0,
            "#171717"
        );

        gradient.addColorStop(
            .45,
            "#2b2415"
        );

        gradient.addColorStop(
            1,
            "#8c6b1f"
        );

    }


    else if(style === "black"){

        gradient.addColorStop(
            0,
            "#050505"
        );

        gradient.addColorStop(
            .5,
            "#202020"
        );

        gradient.addColorStop(
            1,
            "#080808"
        );

    }


    else if(style === "navy"){

        gradient.addColorStop(
            0,
            "#071526"
        );

        gradient.addColorStop(
            .5,
            "#12365a"
        );

        gradient.addColorStop(
            1,
            "#071526"
        );

    }


    else if(style === "wine"){

        gradient.addColorStop(
            0,
            "#26080f"
        );

        gradient.addColorStop(
            .5,
            "#65152a"
        );

        gradient.addColorStop(
            1,
            "#21070c"
        );

    }


    else if(style === "green"){

        gradient.addColorStop(
            0,
            "#06251c"
        );

        gradient.addColorStop(
            .5,
            "#096b50"
        );

        gradient.addColorStop(
            1,
            "#042218"
        );

    }


    else {

        gradient.addColorStop(
            0,
            "#160d28"
        );

        gradient.addColorStop(
            .5,
            "#51227d"
        );

        gradient.addColorStop(
            1,
            "#160d28"
        );

    }

    return gradient;

}


/* =========================================
STAR
========================================= */

function drawStar(
    x,
    y,
    outer,
    inner,
    color
){

    ctx.save();

    ctx.fillStyle =
    color;

    ctx.beginPath();

    let rotation =
    Math.PI / 2 * 3;

    const spikes = 5;

    const step =
    Math.PI / spikes;

    ctx.moveTo(
        x,
        y - outer
    );


    for(
        let i=0;
        i<spikes;
        i++
    ){

        ctx.lineTo(
            x +
            Math.cos(rotation) *
            outer,

            y +
            Math.sin(rotation) *
            outer
        );

        rotation += step;

        ctx.lineTo(
            x +
            Math.cos(rotation) *
            inner,

            y +
            Math.sin(rotation) *
            inner
        );

        rotation += step;

    }


    ctx.closePath();

    ctx.fill();

    ctx.restore();

}


/* =========================================
WRAP
========================================= */

function wrapText(
    text,
    maxWidth,
    font
){

    ctx.font =
    font;

    const words =
    text.split(" ");

    const lines = [];

    let line = "";


    words.forEach(
        function(word){

            const test =
            line +
            (line ? " " : "") +
            word;

            if(
                ctx.measureText(
                    test
                ).width >
                maxWidth &&
                line
            ){

                lines.push(line);

                line =
                word;

            }
            else{

                line =
                test;

            }

        }
    );


    if(line){

        lines.push(line);

    }

    return lines;

}


/* =========================================
DRAW
========================================= */

function draw(){

    if(!productImage){

        canvas.width = 900;
        canvas.height = 600;

        ctx.fillStyle =
        "#e5e5e5";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        ctx.fillStyle =
        "#555";

        ctx.font =
        "28px Arial";

        ctx.textAlign =
        "center";

        ctx.fillText(
            "پہلے Product Image منتخب کریں",
            450,
            300
        );

        return;

    }


    const iw =
    productImage.naturalWidth;

    const ih =
    productImage.naturalHeight;


    /* WIDER DESIGN PANEL */

    const panelWidth =
    Math.max(
        420,
        Math.min(
            520,
            iw * .42
        )
    );


    canvas.width =
    iw + panelWidth;

    canvas.height =
    ih;


    ctx.fillStyle =
    "#fff";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    let imageX =
    panelSide === "right"
    ? 0
    : panelWidth;


    ctx.drawImage(
        productImage,
        imageX,
        0,
        iw,
        ih
    );


    let panelX =
    panelSide === "right"
    ? iw
    : 0;


    /* DESIGNER SHEET */

    ctx.fillStyle =
    panelGradient(
        panelX,
        panelWidth,
        ih
    );

    ctx.fillRect(
        panelX,
        0,
        panelWidth,
        ih
    );


    /* DECORATIVE BORDER */

    ctx.strokeStyle =
    "#d4af37";

    ctx.lineWidth =
    8;

    ctx.strokeRect(
        panelX + 6,
        6,
        panelWidth - 12,
        ih - 12
    );


    /* INNER BORDER */

    ctx.strokeStyle =
    "rgba(255,255,255,.25)";

    ctx.lineWidth =
    2;

    ctx.strokeRect(
        panelX + 20,
        20,
        panelWidth - 40,
        ih - 40
    );


    /* LOGO */

    if(logoImage){

        const maxW =
        panelWidth * .42;

        const maxH =
        100;

        let lw =
        logoImage.naturalWidth;

        let lh =
        logoImage.naturalHeight;


        const scale =
        Math.min(
            maxW / lw,
            maxH / lh,
            1
        );

        lw *= scale;
        lh *= scale;


        ctx.drawImage(
            logoImage,
            panelX +
            (panelWidth-lw)/2,
            35,
            lw,
            lh
        );

    }


    /* TITLE */

    ctx.fillStyle =
    "#d4af37";

    ctx.font =
    "bold 27px Arial";

    ctx.textAlign =
    "center";

    ctx.fillText(
        "JANJUA TRADERS",
        panelX +
        panelWidth/2,
        160
    );


    ctx.fillStyle =
    "rgba(255,255,255,.55)";

    ctx.font =
    "16px Arial";

    ctx.fillText(
        "DIGITAL MARKETING",
        panelX +
        panelWidth/2,
        188
    );


    /* FEATURES */

    let y = 250;

    features.forEach(
        function(item){

            let style = "";

            if(item.bold)
                style += "bold ";

            if(item.italic)
                style += "italic ";


            const font =
            style +
            item.size +
            "px Arial";


            const maxText =
            panelWidth - 105;


            const lines =
            wrapText(
                item.text,
                maxText,
                font
            );


            /* STAR */

            let starX;

            if(panelSide === "right"){

                starX =
                panelX + 42;

            }else{

                starX =
                panelX +
                panelWidth -
                42;

            }


            drawStar(
                starX,
                y - 9,
                22,
                10,
                item.starColor
            );


            /* TEXT */

            ctx.fillStyle =
            item.color;

            ctx.font =
            font;

            ctx.textAlign =
            panelSide === "right"
            ? "left"
            : "right";


            let tx;

            if(panelSide === "right"){

                tx =
                panelX + 80;

            }else{

                tx =
                panelX +
                panelWidth -
                80;

            }


            lines.forEach(
                function(line){

                    ctx.fillText(
                        line,
                        tx,
                        y
                    );


                    if(
                        item.underline
                    ){

                        const w =
                        ctx.measureText(
                            line
                        ).width;

                        let ux;

                        if(
                            panelSide === "right"
                        ){

                            ux = tx;

                        }else{

                            ux =
                            tx - w;

                        }


                        ctx.strokeStyle =
                        item.color;

                        ctx.lineWidth =
                        2;

                        ctx.beginPath();

                        ctx.moveTo(
                            ux,
                            y + 5
                        );

                        ctx.lineTo(
                            ux+w,
                            y+5
                        );

                        ctx.stroke();

                    }


                    y +=
                    item.size + 12;

                }
            );


            y += 30;

        }
    );


    /* FOOTER */

    ctx.fillStyle =
    "#d4af37";

    ctx.font =
    "bold 17px Arial";

    ctx.textAlign =
    "center";

    ctx.fillText(
        "QUALITY • VALUE • TRUST",
        panelX +
        panelWidth/2,
        ih - 35
    );

}


/* =========================================
DOWNLOAD
========================================= */

function downloadImage(type){

    if(!productImage){

        alert(
            "پہلے تصویر منتخب کریں۔"
        );

        return;

    }


    const link =
    document.createElement("a");


    if(type === "jpg"){

        link.download =
        "janjua-traders.jpg";

        link.href =
        canvas.toDataURL(
            "image/jpeg",
            .95
        );

    }
    else{

        link.download =
        "janjua-traders.png";

        link.href =
        canvas.toDataURL(
            "image/png"
        );

    }


    link.click();

}


/* =========================================
START
========================================= */

draw();

</script>

</body>
</html>
