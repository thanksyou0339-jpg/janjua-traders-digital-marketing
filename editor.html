<script>

document.addEventListener(
"DOMContentLoaded",
function(){


const canvas =
document.getElementById(
"canvas"
);

const ctx =
canvas.getContext(
"2d"
);


const W = 1080;
const H = 1350;


let productImage = null;
let logoImage = null;

let features = [];


let textColor =
"#FFFFFF";

let starColor =
"#D4AF37";

let panelColor =
"#111111";


let priceCardColor =
"#111111";

let priceColor =
"#FFD700";

let deliveryColor =
"#FFFFFF";


let fontSize = 34;

let priceSize = 68;

let deliverySize = 28;


let isBold = true;

let isItalic = false;

let isUnderline = false;


/* =====================================================
   LOAD IMAGE
===================================================== */

function loadImage(
file,
callback
){

    if(!file)
        return;


    const reader =
        new FileReader();


    reader.onload =
    function(e){


        const img =
            new Image();


        img.onload =
        function(){

            callback(img);

            draw();

        };


        img.src =
            e.target.result;

    };


    reader.readAsDataURL(
        file
    );

}


/* =====================================================
   COVER IMAGE
===================================================== */

function drawImageCover(
img,
x,
y,
w,
h
){

    const scale =
        Math.max(
            w / img.width,
            h / img.height
        );


    const newW =
        img.width *
        scale;


    const newH =
        img.height *
        scale;


    const dx =
        x +
        (w - newW) / 2;


    const dy =
        y +
        (h - newH) / 2;


    ctx.save();


    ctx.beginPath();

    ctx.rect(
        x,
        y,
        w,
        h
    );

    ctx.clip();


    ctx.drawImage(
        img,
        dx,
        dy,
        newW,
        newH
    );


    ctx.restore();

}


/* =====================================================
   STAR
===================================================== */

function drawStar(
cx,
cy,
r,
color
){

    ctx.save();

    ctx.fillStyle =
        color;

    ctx.beginPath();

    for(
        let i=0;
        i<10;
        i++
    ){

        const angle =
            -Math.PI/2 +
            i*Math.PI/5;


        const radius =
            i%2===0
            ? r
            : r*.45;


        const x =
            cx +
            Math.cos(angle) *
            radius;


        const y =
            cy +
            Math.sin(angle) *
            radius;


        if(i===0)
            ctx.moveTo(
                x,
                y
            );
        else
            ctx.lineTo(
                x,
                y
            );

    }

    ctx.closePath();

    ctx.fill();

    ctx.restore();

}


/* =====================================================
   PRICE CARD
===================================================== */

function drawPriceCard(
imageX,
imageY,
imageW,
imageH
){

    const price =
        Number(
            document.getElementById(
                "priceInput"
            ).value || 0
        );


    const deliveryType =
        document.getElementById(
            "deliveryType"
        ).value;


    const delivery =
        Number(
            document.getElementById(
                "deliveryInput"
            ).value || 0
        );


    const position =
        document.getElementById(
            "pricePosition"
        ).value;


    const cardW = 460;

    const cardH = 205;


    let cardX;


    if(position==="left"){

        cardX =
            imageX + 30;

    }
    else if(position==="right"){

        cardX =
            imageX +
            imageW -
            cardW -
            30;

    }
    else{

        cardX =
            imageX +
            (imageW-cardW)/2;

    }


    /*
       PRICE CARD:
       تصویر کے اوپر
       نیچے نہیں
    */

    const cardY =
        imageY + 35;


    /* SHADOW */

    ctx.save();

    ctx.shadowColor =
        "rgba(0,0,0,.48)";

    ctx.shadowBlur =
        18;

    ctx.shadowOffsetY =
        5;


    ctx.fillStyle =
        priceCardColor;


    ctx.beginPath();

    ctx.roundRect(
        cardX,
        cardY,
        cardW,
        cardH,
        24
    );

    ctx.fill();


    ctx.restore();


    /* GOLD BORDER */

    ctx.save();

    ctx.strokeStyle =
        priceColor;

    ctx.lineWidth =
        3;

    ctx.beginPath();

    ctx.roundRect(
        cardX,
        cardY,
        cardW,
        cardH,
        24
    );

    ctx.stroke();

    ctx.restore();


    /* PRICE */

    ctx.fillStyle =
        priceColor;

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.font =
        "900 " +
        priceSize +
        "px Arial";


    ctx.fillText(
        "Rs. " +
        price.toLocaleString(
            "en-PK"
        ),
        cardX +
        cardW/2,
        cardY + 72
    );


    /* DELIVERY */

    ctx.fillStyle =
        deliveryColor;


    ctx.font =
        "bold " +
        deliverySize +
        "px Arial";


    let deliveryText;


    if(
        deliveryType ===
        "free"
    ){

        deliveryText =
            "FREE DELIVERY";

    }
    else{

        deliveryText =
            "DELIVERY: Rs. " +
            delivery.toLocaleString(
                "en-PK"
            );

    }


    ctx.fillText(
        deliveryText,
        cardX +
        cardW/2,
        cardY + 132
    );


    /* TOTAL */

    const total =
        price +
        (
            deliveryType ===
            "free"
            ? 0
            : delivery
        );


    ctx.font =
        "bold 21px Arial";


    ctx.fillStyle =
        "#FFFFFF";


    ctx.fillText(
        "TOTAL: Rs. " +
        total.toLocaleString(
            "en-PK"
        ),
        cardX +
        cardW/2,
        cardY + 175
    );

}


/* =====================================================
   DRAW
===================================================== */

function draw(){


    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    /* BACKGROUND */

    ctx.fillStyle =
        "#FFFFFF";


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* IMAGE */

    const imageX = 30;

    const imageY = 30;

    const imageW = 1020;

    const imageH = 850;


    ctx.fillStyle =
        "#EEEEEE";


    ctx.fillRect(
        imageX,
        imageY,
        imageW,
        imageH
    );


    if(productImage){

        drawImageCover(
            productImage,
            imageX,
            imageY,
            imageW,
            imageH
        );

    }


    /* LOGO */

    if(logoImage){

        const maxLogo =
            115;


        const scale =
            Math.min(
                maxLogo /
                logoImage.width,

                maxLogo /
                logoImage.height
            );


        const lw =
            logoImage.width *
            scale;


        const lh =
            logoImage.height *
            scale;


        ctx.drawImage(
            logoImage,
            W-lw-55,
            imageY+35,
            lw,
            lh
        );

    }


    /* PRICE CARD */

    drawPriceCard(
        imageX,
        imageY,
        imageW,
        imageH
    );


    /* =================================================
       FEATURE PANEL
    ================================================= */

    const panelY = 905;

    const panelH = 415;


    ctx.fillStyle =
        panelColor;


    ctx.fillRect(
        30,
        panelY,
        1020,
        panelH
    );


    /* PRODUCT NAME */

    const productName =
        document.getElementById(
            "productName"
        ).value.trim();


    if(productName){

        ctx.fillStyle =
            textColor;


        ctx.textAlign =
            "right";


        ctx.font =
            "bold 42px Arial";


        ctx.fillText(
            productName,
            1000,
            panelY+55
        );

    }


    /* FEATURES */

    let startY =
        panelY+115;


    features
    .slice(0,5)
    .forEach(
    function(item,index){


        const y =
            startY +
            index*58;


        drawStar(
            990,
            y,
            20,
            item.starColor ||
            starColor
        );


        ctx.fillStyle =
            item.color ||
            textColor;


        ctx.textAlign =
            "right";


        let style = "";


        if(item.italic)
            style +=
                "italic ";


        if(item.bold)
            style +=
                "bold ";


        ctx.font =
            style +
            (item.size ||
             fontSize) +
            "px Arial";


        ctx.fillText(
            item.text,
            950,
            y
        );


        if(
            item.underline
        ){

            const width =
                ctx.measureText(
                    item.text
                ).width;


            ctx.fillRect(
                950-width,
                y+5,
                width,
                2
            );

        }

    });


}


/* =====================================================
   ADD FEATURE
===================================================== */

function addFeature(
text
){

    if(!text)
        return;


    features.push({

        id:
            Date.now() +
            Math.random(),

        text:text,

        color:
            textColor,

        starColor:
            starColor,

        size:
            fontSize,

        bold:
            isBold,

        italic:
            isItalic,

        underline:
            isUnderline

    });


    updateFeatureList();

    draw();

}


/* =====================================================
   FEATURE LIST
===================================================== */

function updateFeatureList(){

    const list =
        document.getElementById(
            "featureList"
        );


    list.innerHTML = "";


    features.forEach(
    function(item){


        const div =
            document.createElement(
                "div"
            );


        div.className =
            "feature-item";


        const star =
            document.createElement(
                "span"
            );


        star.textContent =
            "★";


        star.style.color =
            item.starColor;


        const text =
            document.createElement(
                "span"
            );


        text.textContent =
            item.text;


        const remove =
            document.createElement(
                "button"
            );


        remove.className =
            "remove-feature";


        remove.textContent =
            "×";


        remove.onclick =
        function(){


            features =
                features.filter(
                function(f){

                    return f.id !==
                        item.id;

                });


            updateFeatureList();

            draw();

        };


        div.appendChild(
            star
        );


        div.appendChild(
            text
        );


        div.appendChild(
            remove
        );


        list.appendChild(
            div
        );

    });

}

===================================================== */

function download(
type
){

    const link =
        document.createElement(
            "a"
        );


    if(type==="jpg"){

        link.download =
            "Janjua-Traders-Product.jpg";


        link.href =
            canvas.toDataURL(
                "image/jpeg",
                .95
            );

    }
    else{

        link.download =
            "Janjua-Traders-Product.png";


        link.href =
            canvas.toDataURL(
                "image/png"
            );

    }


    link.click();

}


document.getElementById(
"downloadJPG"
).onclick =
function(){

    download("jpg");

};


document.getElementById(
"downloadPNG"
).onclick =
function(){

};
