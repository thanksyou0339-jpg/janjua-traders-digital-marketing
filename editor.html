<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Janjua Traders - Product Editor</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    font-family: Arial, "Noto Nastaliq Urdu", sans-serif;
    background: #eeeeee;
    color: #222;
}

h1 {
    text-align: center;
    margin: 5px 0 18px;
    font-size: 22px;
}

.editor {
    max-width: 1050px;
    margin: auto;
}

/* =========================
   CONTROL PANEL
========================= */

.controls {
    background: white;
    border-radius: 15px;
    padding: 15px;
    margin-bottom: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,.12);
}

.row {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.control {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

label {
    font-weight: bold;
    font-size: 14px;
}

input,
select,
button {
    font-family: inherit;
}

input[type="text"],
input[type="number"],
select {
    width: 100%;
    min-height: 42px;
    border: 1px solid #bbb;
    border-radius: 9px;
    padding: 8px 10px;
    font-size: 15px;
    background: #fff;
}

input[type="file"] {
    width: 100%;
    padding: 8px 0;
}

.section-title {
    margin: 18px 0 10px;
    font-size: 17px;
    border-bottom: 2px solid #ddd;
    padding-bottom: 5px;
}

/* =========================
   IMAGE FRAME
========================= */

.canvas-wrapper {
    width: 100%;
    overflow: auto;
    padding: 10px;
}

#designCanvas {
    position: relative;
    width: min(100%, 900px);
    margin: auto;
    background: white;
    overflow: hidden;
    border-radius: 10px;
    box-shadow: 0 8px 30px rgba(0,0,0,.18);
}

/*
    Main image
*/

#productImage {
    position: absolute;
    object-fit: contain;
    background: #f7f7f7;
    z-index: 2;
}

/*
    Bottom information panel
*/

#infoPanel {
    position: absolute;
    z-index: 4;
    overflow: hidden;
    padding: 16px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 8px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.96),
            rgba(235,235,235,.96)
        );
}

/* Decorative animated background */

#infoPanel::before {
    content: "";
    position: absolute;
    width: 180%;
    height: 180%;
    top: -40%;
    left: -40%;

    background:
        radial-gradient(
            circle,
            rgba(212,175,55,.18) 0%,
            transparent 45%
        );

    animation: moveBackground 8s linear infinite;
}

#infoPanel::after {
    content: "";
    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            120deg,
            transparent 0%,
            rgba(255,255,255,.35) 45%,
            transparent 55%
        );

    animation: shine 5s linear infinite;
}

@keyframes moveBackground {
    0% {
        transform: rotate(0deg) scale(1);
    }

    50% {
        transform: rotate(180deg) scale(1.1);
    }

    100% {
        transform: rotate(360deg) scale(1);
    }
}

@keyframes shine {
    0% {
        transform: translateX(-100%);
    }

    100% {
        transform: translateX(100%);
    }
}

.info-content {
    position: relative;
    z-index: 5;
}

/* =========================
   FEATURES
========================= */

.feature {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 17px;
    font-weight: bold;
    margin: 4px 0;
}

.star {
    width: 27px;
    height: 27px;
    min-width: 27px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 18px;
    clip-path: polygon(
        50% 0%,
        61% 35%,
        98% 35%,
        68% 57%,
        79% 94%,
        50% 72%,
        21% 94%,
        32% 57%,
        2% 35%,
        39% 35%
    );

    background: #d4af37;
    color: white;
}

/* =========================
   PRICE BADGE
========================= */

#priceBadge {
    position: absolute;
    z-index: 10;

    background: #111;
    color: white;

    border-radius: 12px;

    padding: 9px 14px;

    min-width: 120px;

    text-align: center;

    font-size: 21px;
    font-weight: 900;

    box-shadow:
        0 5px 18px rgba(0,0,0,.35);

    cursor: move;

    user-select: none;
}

#priceBadge.dragging {
    opacity: .75;
    transform: scale(1.04);
}

/* =========================
   LOGO
========================= */

#logoPreview {
    position: absolute;
    z-index: 20;

    width: 55px;
    height: 55px;

    object-fit: contain;

    top: 10px;
    right: 10px;

    display: none;

    pointer-events: none;
}

/* =========================
   BUTTONS
========================= */

.buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
    margin-top: 15px;
}

button {
    border: none;
    border-radius: 9px;
    padding: 11px 15px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    background: #222;
    color: white;
}

button:hover {
    opacity: .85;
}

.btn-download {
    background: #198754;
}

.btn-reset {
    background: #dc3545;
}

/* =========================
   HIDDEN
========================= */

.hidden {
    display: none !important;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    body {
        padding: 8px;
    }

    .row {
        grid-template-columns: 1fr;
    }

    #priceBadge {
        font-size: 16px;
        min-width: 90px;
        padding: 7px 10px;
    }

    .feature {
        font-size: 12px;
    }

    .star {
        width: 21px;
        height: 21px;
        min-width: 21px;
        font-size: 13px;
    }

    #logoPreview {
        width: 40px;
        height: 40px;
    }
}
</style>
</head>

<body>

<div class="editor">

<h1>Janjua Traders — Product Image Editor</h1>

<div class="controls">

    <!-- IMAGE -->

    <div class="section-title">
        1۔ Product Image
    </div>

    <div class="control">
        <label>تصویر منتخب کریں</label>
        <input type="file" id="imageInput" accept="image/*">
    </div>


    <!-- LOGO -->

    <div class="control" style="margin-top:10px;">
        <label>اپنا Logo / Monogram</label>
        <input type="file" id="logoInput" accept="image/*">
    </div>


    <!-- PRICE -->

    <div class="section-title">
        2۔ Price
    </div>

    <div class="row">

        <div class="control">
            <label>Price</label>

            <input
                type="text"
                id="priceInput"
                placeholder="مثلاً Rs. 2,999"
                value="Rs. 2,999"
            >
        </div>

        <div class="control">

            <label>Price Style</label>

            <select id="priceStyle">

                <option value="black">
                    Black
                </option>

                <option value="gold">
                    Golden
                </option>

                <option value="red">
                    Red
                </option>

                <option value="green">
                    Green
                </option>

                <option value="blue">
                    Blue
                </option>

                <option value="white">
                    White
                </option>

            </select>

        </div>

    </div>


    <!-- DELIVERY -->

    <div class="section-title">
        3۔ Delivery
    </div>

    <div class="row">

        <div class="control">

            <label>Delivery Type</label>

            <select id="deliveryType">

                <option value="free">
                    Free Delivery
                </option>

                <option value="charges">
                    Delivery Charges
                </option>

                <option value="custom">
                    Custom
                </option>

            </select>

        </div>


        <div
            class="control hidden"
            id="deliveryChargesBox"
        >

            <label>Delivery Charges</label>

            <input
                type="text"
                id="deliveryCharges"
                placeholder="مثلاً Rs. 250"
            >

        </div>

    </div>


    <!-- COUNTRY -->

    <div class="section-title">
        4۔ Product Information
    </div>

    <div class="row">

        <div class="control">

            <label>ملک</label>

            <select id="countrySelect">

                <option value="">
                    ملک منتخب کریں
                </option>

                <option>پاکستان</option>
                <option>چین</option>
                <option>ترکی</option>
                <option>ایران</option>
                <option>سعودی عرب</option>
                <option>متحدہ عرب امارات</option>
                <option>قطر</option>
                <option>کینیڈا</option>
                <option>آسٹریلیا</option>
                <option>فرانس</option>
                <option>جرمنی</option>
                <option>اٹلی</option>
                <option>برطانیہ</option>
                <option>امریکہ</option>

            </select>

        </div>


        <div class="control">

            <label>مضبوطی</label>

            <select id="strengthSelect">

                <option value="">منتخب کریں</option>

                <option>مضبوط چیز</option>
                <option>انتہائی مضبوط</option>
                <option>مضبوط اور قابل اعتماد</option>
                <option>بہترین مضبوطی</option>

            </select>

        </div>


        <div class="control">

            <label>پائیداری</label>

            <select id="durabilitySelect">

                <option value="">منتخب کریں</option>

                <option>پائیدار چیز</option>
                <option>لمبی مدت تک استعمال</option>
                <option>اعلیٰ پائیداری</option>
                <option>روزمرہ استعمال کے لیے بہترین</option>

            </select>

        </div>


        <div class="control">

            <label>Quality</label>

            <select id="qualitySelect">

                <option value="">منتخب کریں</option>

                <option>بہترین کوالٹی</option>
                <option>اعلیٰ معیار</option>
                <option>پریمیم کوالٹی</option>
                <option>بہترین معیار</option>

            </select>

        </div>


        <div class="control">

            <label>خوبصورتی</label>

            <select id="beautySelect">

                <option value="">منتخب کریں</option>

                <option>خوبصورت ڈیزائن</option>
                <option>جدید ڈیزائن</option>
                <option>شاندار انداز</option>
                <option>پریمیم لک</option>

            </select>

        </div>

    </div>


    <!-- CUSTOM TEXT -->

    <div class="section-title">
        5۔ اضافی عبارت
    </div>

    <div class="row">

        <div class="control">

            <label>اضافی عبارت</label>

            <input
                type="text"
                id="customText"
                placeholder="مثلاً خاص پیشکش"
            >

        </div>

        <div class="control">

            <label>Text Color</label>

            <select id="textColor">

                <option value="#111111">Black</option>
                <option value="#ffffff">White</option>
                <option value="#d4af37">Golden</option>
                <option value="#ff0000">Red</option>
                <option value="#008000">Green</option>
                <option value="#0000ff">Blue</option>
                <option value="#800080">Purple</option>
                <option value="#ff6600">Orange</option>
                <option value="#00a6a6">Teal</option>

            </select>

        </div>

    </div>


    <!-- DOWNLOAD -->

    <div class="buttons">

        <button
            class="btn-download"
            id="downloadPNG"
        >
            PNG Download
        </button>

        <button
            class="btn-download"
            id="downloadJPG"
        >
            JPG Download
        </button>

        <button
            class="btn-reset"
            id="resetButton"
        >
            Reset
        </button>

    </div>

</div>


<!-- =========================
     DESIGN CANVAS
========================= -->

<div class="canvas-wrapper">

    <div id="designCanvas">

        <img
            id="productImage"
            alt=""
        >

        <img
            id="logoPreview"
            alt=""
        >

        <div id="priceBadge">
            Rs. 2,999
        </div>

        <div id="infoPanel">

            <div class="info-content">

                <div
                    class="feature"
                    id="countryFeature"
                >
                    <span class="star">★</span>
                    <span id="countryText"></span>
                </div>


                <div
                    class="feature"
                    id="strengthFeature"
                >
                    <span class="star">★</span>
                    <span id="strengthText"></span>
                </div>


                <div
                    class="feature"
                    id="durabilityFeature"
                >
                    <span class="star">★</span>
                    <span id="durabilityText"></span>
                </div>


                <div
                    class="feature"
                    id="qualityFeature"
                >
                    <span class="star">★</span>
                    <span id="qualityText"></span>
                </div>


                <div
                    class="feature"
                    id="beautyFeature"
                >
                    <span class="star">★</span>
                    <span id="beautyText"></span>
                </div>


                <div
                    class="feature"
                    id="customFeature"
                >
                    <span class="star">★</span>
                    <span id="customTextDisplay"></span>
                </div>


                <div
                    class="feature"
                    id="deliveryFeature"
                >
                    <span class="star">★</span>
                    <span id="deliveryText"></span>
                </div>

            </div>

        </div>

    </div>

</div>

</div>


<!-- =========================
     html2canvas
========================= -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const imageInput =
            document.getElementById("imageInput");

        const logoInput =
            document.getElementById("logoInput");

        const productImage =
            document.getElementById("productImage");

        const logoPreview =
            document.getElementById("logoPreview");

        const canvas =
            document.getElementById("designCanvas");

        const infoPanel =
            document.getElementById("infoPanel");

        const priceBadge =
            document.getElementById("priceBadge");


        /* =========================
           INPUTS
        ========================= */

        const priceInput =
            document.getElementById("priceInput");

        const priceStyle =
            document.getElementById("priceStyle");

        const deliveryType =
            document.getElementById("deliveryType");

        const deliveryCharges =
            document.getElementById("deliveryCharges");

        const deliveryChargesBox =
            document.getElementById(
                "deliveryChargesBox"
            );


        const countrySelect =
            document.getElementById(
                "countrySelect"
            );

        const strengthSelect =
            document.getElementById(
                "strengthSelect"
            );

        const durabilitySelect =
            document.getElementById(
                "durabilitySelect"
            );

        const qualitySelect =
            document.getElementById(
                "qualitySelect"
            );

        const beautySelect =
            document.getElementById(
                "beautySelect"
            );

        const customText =
            document.getElementById(
                "customText"
            );

        const textColor =
            document.getElementById(
                "textColor"
            );


        /* =========================
           IMAGE
        ========================= */

        imageInput.addEventListener(
            "change",
            function () {

                const file =
                    imageInput.files[0];

                if (!file) return;

                const reader =
                    new FileReader();

                reader.onload =
                    function (event) {

                        productImage.src =
                            event.target.result;

                        productImage.onload =
                            function () {

                                buildCanvas();
                            };

                    };

                reader.readAsDataURL(file);
            }
        );


        /* =========================
           LOGO
        ========================= */

        logoInput.addEventListener(
            "change",
            function () {

                const file =
                    logoInput.files[0];

                if (!file) return;

                const reader =
                    new FileReader();

                reader.onload =
                    function (event) {

                        logoPreview.src =
                            event.target.result;

                        logoPreview.style.display =
                            "block";
                    };

                reader.readAsDataURL(file);
            }
        );


        /* =========================
           BUILD CANVAS
        ========================= */

        function buildCanvas() {

            if (!productImage.naturalWidth) {
                return;
            }

            const imageWidth =
                productImage.naturalWidth;

            const imageHeight =
                productImage.naturalHeight;


            /*
             * Maximum display width
             */

            const maxWidth = 900;

            const scale =
                Math.min(
                    1,
                    maxWidth / imageWidth
                );


            const displayWidth =
                imageWidth * scale;

            const displayHeight =
                imageHeight * scale;


            /*
             * Canvas = image + small information area
             */

            const panelWidth =
                Math.max(
                    280,
                    displayWidth * 0.36
                );


            const finalWidth =
                displayWidth + panelWidth;


            const finalHeight =
                displayHeight;


            canvas.style.width =
                finalWidth + "px";

            canvas.style.height =
                finalHeight + "px";


            /*
             * Image takes left side
             */

            productImage.style.left =
                "0px";

            productImage.style.top =
                "0px";

            productImage.style.width =
                displayWidth + "px";

            productImage.style.height =
                displayHeight + "px";


            /*
             * Information panel on right
             */

            infoPanel.style.left =
                displayWidth + "px";

            infoPanel.style.top =
                "0px";

            infoPanel.style.width =
                panelWidth + "px";

            infoPanel.style.height =
                displayHeight + "px";


            /*
             * Price starts near top of image
             */

            priceBadge.style.left =
                Math.max(
                    10,
                    displayWidth - 150
                ) + "px";

            priceBadge.style.top =
                "15px";


            /*
             * Logo
             */

            logoPreview.style.right =
                (
                    panelWidth + 10
                ) + "px";

            logoPreview.style.top =
                "10px";
        }


        /* =========================
           PRICE
        ========================= */

        function updatePrice() {

            const value =
                priceInput.value.trim();

            priceBadge.textContent =
                value || "Price";


            const style =
                priceStyle.value;


            const styles = {

                black: {
                    background: "#111",
                    color: "#fff"
                },

                gold: {
                    background: "#d4af37",
                    color: "#111"
                },

                red: {
                    background: "#d62828",
                    color: "#fff"
                },

                green: {
                    background: "#198754",
                    color: "#fff"
                },

                blue: {
                    background: "#1769aa",
                    color: "#fff"
                },

                white: {
                    background: "#fff",
                    color: "#111"
                }

            };


            priceBadge.style.background =
                styles[style].background;

            priceBadge.style.color =
                styles[style].color;
        }


        priceInput.addEventListener(
            "input",
            updatePrice
        );

        priceStyle.addEventListener(
            "change",
            updatePrice
        );


        /* =========================
           DELIVERY
        ========================= */

        function updateDelivery() {

            const type =
                deliveryType.value;


            if (type === "charges") {

                deliveryChargesBox
                    .classList
                    .remove("hidden");

            } else {

                deliveryChargesBox
                    .classList
                    .add("hidden");
            }


            const deliveryFeature =
                document.getElementById(
                    "deliveryFeature"
                );

            const deliveryText =
                document.getElementById(
                    "deliveryText"
                );


            if (type === "free") {

                deliveryFeature.style.display =
                    "flex";

                deliveryText.textContent =
                    "پورے پاکستان کے لیے فری ڈیلیوری";

            }

            else if (type === "charges") {

                deliveryFeature.style.display =
                    "flex";

                const charge =
                    deliveryCharges.value.trim();

                deliveryText.textContent =
                    charge
                    ? "ڈیلیوری چارجز: " + charge
                    : "ڈیلیوری چارجز";

            }

            else {

                deliveryFeature.style.display =
                    "flex";

                deliveryText.textContent =
                    "ڈیلیوری دستیاب ہے";
            }
        }


        deliveryType.addEventListener(
            "change",
            updateDelivery
        );

        deliveryCharges.addEventListener(
            "input",
            updateDelivery
        );


        /* =========================
           FEATURES
        ========================= */

        function updateFeature(
            select,
            featureId,
            textId
        ) {

            const value =
                select.value;

            const feature =
                document.getElementById(
                    featureId
                );

            const text =
                document.getElementById(
                    textId
                );


            if (!value) {

                feature.style.display =
                    "none";

            } else {

                feature.style.display =
                    "flex";

                text.textContent =
                    value;
            }
        }


        countrySelect.addEventListener(
            "change",
            function () {

                updateFeature(
                    countrySelect,
                    "countryFeature",
                    "countryText"
                );
            }
        );


        strengthSelect.addEventListener(
            "change",
            function () {

                updateFeature(
                    strengthSelect,
                    "strengthFeature",
                    "strengthText"
                );
            }
        );


        durabilitySelect.addEventListener(
            "change",
            function () {

                updateFeature(
                    durabilitySelect,
                    "durabilityFeature",
                    "durabilityText"
                );
            }
        );


        qualitySelect.addEventListener(
            "change",
            function () {

                updateFeature(
                    qualitySelect,
                    "qualityFeature",
                    "qualityText"
                );
            }
        );


        beautySelect.addEventListener(
            "change",
            function () {

                updateFeature(
                    beautySelect,
                    "beautyFeature",
                    "beautyText"
                );
            }
        );


        /* =========================
           CUSTOM TEXT
        ========================= */

        function updateCustom() {

            const value =
                customText.value.trim();

            const feature =
                document.getElementById(
                    "customFeature"
                );

            const display =
                document.getElementById(
                    "customTextDisplay"
                );


            if (!value) {

                feature.style.display =
                    "none";

            } else {

                feature.style.display =
                    "flex";

                display.textContent =
                    value;
            }
        }


        customText.addEventListener(
            "input",
            updateCustom
        );


        /* =========================
           TEXT COLOR
        ========================= */

        textColor.addEventListener(
            "change",
            function () {

                const features =
                    document.querySelectorAll(
                        ".feature"
                    );

                features.forEach(
                    function (feature) {

                        feature.style.color =
                            textColor.value;
                    }
                );
            }
        );


        /* =========================
           DRAG PRICE
        ========================= */

        let dragging = false;

        let offsetX = 0;

        let offsetY = 0;


        priceBadge.addEventListener(
            "pointerdown",
            function (event) {

                dragging = true;

                priceBadge.classList.add(
                    "dragging"
                );


                const rect =
                    priceBadge.getBoundingClientRect();

                offsetX =
                    event.clientX -
                    rect.left;

                offsetY =
                    event.clientY -
                    rect.top;


                priceBadge.setPointerCapture(
                    event.pointerId
                );
            }
        );


        priceBadge.addEventListener(
            "pointermove",
            function (event) {

                if (!dragging) return;


                const canvasRect =
                    canvas.getBoundingClientRect();


                let x =
                    event.clientX -
                    canvasRect.left -
                    offsetX;

                let y =
                    event.clientY -
                    canvasRect.top -
                    offsetY;


                const maxX =
                    canvas.clientWidth -
                    priceBadge.offsetWidth;

                const maxY =
                    canvas.clientHeight -
                    priceBadge.offsetHeight;


                x =
                    Math.max(
                        0,
                        Math.min(
                            x,
                            maxX
                        )
                    );


                y =
                    Math.max(
                        0,
                        Math.min(
                            y,
                            maxY
                        )
                    );


                priceBadge.style.left =
                    x + "px";

                priceBadge.style.top =
                    y + "px";
            }
        );


        priceBadge.addEventListener(
            "pointerup",
            function () {

                dragging = false;

                priceBadge.classList.remove(
                    "dragging"
                );
            }
        );


        /* =========================
           DOWNLOAD
        ========================= */

        async function downloadImage(
            type
        ) {

            if (
                !productImage.src
            ) {

                alert(
                    "پہلے Product Image منتخب کریں۔"
                );

                return;
            }


            /*
             * Temporarily hide shadow
             */

            const oldShadow =
                canvas.style.boxShadow;

            canvas.style.boxShadow =
                "none";


            try {

                const captured =
                    await html2canvas(
                        canvas,
                        {
                            backgroundColor:
                                "#ffffff",

                            scale:
                                2,

                            useCORS:
                                true,

                            allowTaint:
                                true
                        }
                    );


                let dataURL;


                if (
                    type === "jpg"
                ) {

                    dataURL =
                        captured.toDataURL(
                            "image/jpeg",
                            0.95
                        );

                } else {

                    dataURL =
                        captured.toDataURL(
                            "image/png"
                        );
                }


                const link =
                    document.createElement(
                        "a"
                    );


                link.download =
                    "Janjua-Traders-Product." +
                    type;


                link.href =
                    dataURL;


                document.body.appendChild(
                    link
                );

                link.click();

                link.remove();

            }

            catch (error) {

                console.error(
                    error
                );

                alert(
                    "Image download نہیں ہو سکی۔"
                );

            }

            finally {

                canvas.style.boxShadow =
                    oldShadow;
            }
        }


        document.getElementById(
            "downloadPNG"
        ).addEventListener(
            "click",
            function () {

                downloadImage(
                    "png"
                );
            }
        );


        document.getElementById(
            "downloadJPG"
        ).addEventListener(
            "click",
            function () {

                downloadImage(
                    "jpg"
                );
            }
        );


        /* =========================
           RESET
        ========================= */

        document.getElementById(
            "resetButton"
        ).addEventListener(
            "click",
            function () {

                location.reload();

            }
        );


        /* =========================
           INITIAL
        ========================= */

        updatePrice();

        updateDelivery();

    }
);

</script>

</body>
</html>
