<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Janjua Traders - Image Editor</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#e9e9e9;
    font-family:Arial, "Noto Nastaliq Urdu", sans-serif;
    color:#222;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:15px;
}

h2{
    text-align:center;
    margin:5px 0 15px;
}

.controls{
    background:#fff;
    padding:14px;
    border-radius:12px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
}

.row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
    margin-bottom:10px;
}

label{
    font-weight:bold;
    font-size:14px;
}

button,
select,
input{
    min-height:38px;
    border:1px solid #bbb;
    border-radius:7px;
    padding:6px 10px;
    background:white;
}

button{
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#f1f1f1;
}

.preset{
    background:#f7f7f7;
}

.starButton{
    background:#fff8d8;
}

.download{
    background:#111;
    color:#fff;
}

.clear{
    background:#ffe1e1;
}

/* =========================
   DESIGN FRAME
========================= */

#designArea{
    width:1080px;
    height:1350px;
    max-width:100%;
    aspect-ratio:1080 / 1350;

    margin:auto;

    display:flex;
    direction:ltr;

    background:#f8f4ea;

    overflow:hidden;

    position:relative;

    box-shadow:
        0 5px 25px rgba(0,0,0,.25);
}

/* =========================
   IMAGE FRAME
========================= */

#imageSection{
    width:62%;
    height:100%;

    position:relative;

    overflow:hidden;

    background:#ddd;

    display:flex;
    justify-content:center;
    align-items:center;
}

#mainImage{
    width:100%;
    height:100%;

    object-fit:contain;

    display:none;
}

/* =========================
   RIGHT INFORMATION PANEL
========================= */

#infoPanel{
    width:38%;
    height:100%;

    position:relative;

    padding:55px 28px;

    direction:rtl;

    background:
        linear-gradient(
            135deg,
            #f6f0df,
            #fff,
            #e8dcc2
        );

    border-left:2px solid #d0bd8c;

    display:flex;
    flex-direction:column;
    justify-content:center;

    overflow:hidden;
}

/* Decorative sheet */

#infoPanel:before{
    content:"";
    position:absolute;
    inset:15px;

    border:1px solid rgba(150,120,50,.35);

    border-radius:20px;

    pointer-events:none;
}

/* =========================
   TEXT ITEMS
========================= */

.infoItem{
    display:flex;

    align-items:center;

    gap:10px;

    margin:9px 0;

    position:relative;

    z-index:2;
}

.star{
    width:45px;
    min-width:45px;

    height:45px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:25px;

    color:#d4a72c;

    text-shadow:
        0 1px 2px rgba(0,0,0,.25);
}

.infoText{
    flex:1;

    font-size:22px;

    font-weight:bold;

    line-height:1.35;

    word-break:break-word;
}

/* =========================
   LOGO
========================= */

#logo{
    position:absolute;

    top:18px;
    right:18px;

    width:70px;
    height:70px;

    object-fit:contain;

    display:none;

    z-index:20;

    filter:drop-shadow(0 1px 2px rgba(0,0,0,.25));
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .container{
        padding:8px;
    }

    #designArea{
        width:100%;
        height:auto;
        aspect-ratio:1080 / 1350;
    }

    #infoPanel{
        padding:25px 12px;
    }

    .infoText{
        font-size:12px;
    }

    .star{
        width:28px;
        min-width:28px;
        height:28px;
        font-size:17px;
    }

    .infoItem{
        margin:5px 0;
        gap:4px;
    }

    #logo{
        width:42px;
        height:42px;
    }
}

</style>
</head>

<body>

<div class="container">

<h2>Janjua Traders Digital Marketing Editor</h2>

<div class="controls">

<!-- IMAGE -->

<div class="row">

<label>تصویر:</label>

<input
    type="file"
    id="imageUpload"
    accept="image/*"
>

<label>Logo:</label>

<input
    type="file"
    id="logoUpload"
    accept="image/*"
>

</div>


<!-- QUICK WORDS -->

<div class="row">

<label>خصوصیات شامل کریں:</label>

<button class="starButton" onclick="addPreset('پاکستان میں تیار کردہ')">
⭐ پاکستان
</button>

<button class="starButton" onclick="addPreset('مضبوط چیز')">
⭐ مضبوط
</button>

<button class="starButton" onclick="addPreset('پائیدار چیز')">
⭐ پائیدار
</button>

<button class="starButton" onclick="addPreset('بہترین کوالٹی')">
⭐ بہترین کوالٹی
</button>

<button class="starButton" onclick="addPreset('خوبصورت ڈیزائن')">
⭐ خوبصورت
</button>

<button class="starButton" onclick="addPreset('کم قیمت')">
⭐ کم قیمت
</button>

</div>


<!-- CUSTOM TEXT -->

<div class="row">

<input
    type="text"
    id="customText"
    placeholder="اپنی عبارت لکھیں"
>

<button onclick="addCustomText()">
⭐ عبارت شامل کریں
</button>

<button class="clear" onclick="clearItems()">
تمام الفاظ صاف کریں
</button>

</div>


<!-- TEXT FORMAT -->

<div class="row">

<label>Text Color:</label>

<input
    type="color"
    id="textColor"
    value="#111111"
    onchange="updateSelected()"
>

<label>Star Color:</label>

<input
    type="color"
    id="starColor"
    value="#d4a72c"
    onchange="updateSelected()"
>

<label>Font Size:</label>

<input
    type="range"
    id="fontSize"
    min="10"
    max="40"
    value="22"
    oninput="updateSelected()"
>

</div>


<!-- STYLE -->

<div class="row">

<button onclick="toggleBold()">
<strong>B</strong> Bold
</button>

<button onclick="toggleItalic()">
<em>I</em> Italic
</button>

<button onclick="toggleUnderline()">
<u>U</u> Underline
</button>

</div>


<!-- DOWNLOAD -->

<div class="row">

<button class="download" onclick="downloadPNG()">
PNG Download
</button>

<button class="download" onclick="downloadJPG()">
JPG Download
</button>

</div>

</div>


<!-- =========================
     DESIGN
========================= -->

<div id="designArea">

    <!-- IMAGE -->

    <div id="imageSection">

        <img id="mainImage">

    </div>


    <!-- INFORMATION PANEL -->

    <div id="infoPanel">

        <img id="logo">

        <div id="itemsContainer"></div>

    </div>

</div>

</div>


<script>

/* =====================================================
   GLOBAL
===================================================== */

const MAX_ITEMS = 6;

let selectedItem = null;


/* =====================================================
   IMAGE UPLOAD
===================================================== */

document
.getElementById("imageUpload")
.addEventListener("change", function(){

    const file = this.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(e){

        const img =
            document.getElementById("mainImage");

        img.src = e.target.result;

        img.style.display = "block";

    };

    reader.readAsDataURL(file);

});


/* =====================================================
   LOGO UPLOAD
===================================================== */

document
.getElementById("logoUpload")
.addEventListener("change", function(){

    const file = this.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(e){

        const logo =
            document.getElementById("logo");

        logo.src = e.target.result;

        logo.style.display = "block";

    };

    reader.readAsDataURL(file);

});


/* =====================================================
   ADD PRESET
===================================================== */

function addPreset(text){

    addItem(text);

}


/* =====================================================
   ADD CUSTOM
===================================================== */

function addCustomText(){

    const input =
        document.getElementById("customText");

    const text =
        input.value.trim();

    if(!text) return;

    addItem(text);

    input.value = "";

}


/* =====================================================
   ADD ITEM
===================================================== */

function addItem(text){

    const container =
        document.getElementById("itemsContainer");

    if(
        container.children.length >= MAX_ITEMS
    ){

        alert("زیادہ سے زیادہ 6 خصوصیات شامل کی جا سکتی ہیں۔");

        return;
    }


    const item =
        document.createElement("div");

    item.className = "infoItem";


    const star =
        document.createElement("div");

    star.className = "star";

    star.textContent = "★";


    const textElement =
        document.createElement("div");

    textElement.className = "infoText";

    textElement.textContent = text;


    item.appendChild(star);

    item.appendChild(textElement);


    /* Click item for editing */

    item.onclick = function(){

        selectedItem = item;

        loadSelectedValues();

    };


    container.appendChild(item);


    selectedItem = item;

    loadSelectedValues();

}


/* =====================================================
   LOAD SELECTED
===================================================== */

function loadSelectedValues(){

    if(!selectedItem) return;


    const text =
        selectedItem.querySelector(".infoText");

    const star =
        selectedItem.querySelector(".star");


    document
        .getElementById("textColor")
        .value =
        rgbToHex(
            getComputedStyle(text).color
        );


    document
        .getElementById("starColor")
        .value =
        rgbToHex(
            getComputedStyle(star).color
        );


    document
        .getElementById("fontSize")
        .value =
        parseInt(
            getComputedStyle(text).fontSize
        );

}


/* =====================================================
   UPDATE SELECTED
===================================================== */

function updateSelected(){

    if(!selectedItem) return;


    const text =
        selectedItem.querySelector(".infoText");

    const star =
        selectedItem.querySelector(".star");


    text.style.color =
        document.getElementById("textColor").value;


    star.style.color =
        document.getElementById("starColor").value;


    text.style.fontSize =
        document.getElementById("fontSize").value + "px";

}


/* =====================================================
   BOLD
===================================================== */

function toggleBold(){

    if(!selectedItem) return;

    const text =
        selectedItem.querySelector(".infoText");

    text.style.fontWeight =
        text.style.fontWeight === "bold"
        ? "normal"
        : "bold";

}


/* =====================================================
   ITALIC
===================================================== */

function toggleItalic(){

    if(!selectedItem) return;

    const text =
        selectedItem.querySelector(".infoText");

    text.style.fontStyle =
        text.style.fontStyle === "italic"
        ? "normal"
        : "italic";

}


/* =====================================================
   UNDERLINE
===================================================== */

function toggleUnderline(){

    if(!selectedItem) return;

    const text =
        selectedItem.querySelector(".infoText");

    text.style.textDecoration =
        text.style.textDecoration === "underline"
        ? "none"
        : "underline";

}


/* =====================================================
   CLEAR ITEMS
===================================================== */

function clearItems(){

    document
        .getElementById("itemsContainer")
        .innerHTML = "";

    selectedItem = null;

}


/* =====================================================
   RGB TO HEX
===================================================== */

function rgbToHex(rgb){

    if(!rgb) return "#000000";

    const result =
        rgb.match(/\d+/g);

    if(!result) return "#000000";

    return "#" +
        result
        .slice(0,3)
        .map(x =>
            Number(x)
            .toString(16)
            .padStart(2,"0")
        )
        .join("");

}


/* =====================================================
   DOWNLOAD CANVAS
===================================================== */

async function createCanvas(){

    const area =
        document.getElementById("designArea");


    /*
     * html2canvas browser library
     */

    if(typeof html2canvas === "undefined"){

        await loadHtml2Canvas();

    }


    return await html2canvas(
        area,
        {
            scale:2,
            useCORS:true,
            backgroundColor:null
        }
    );

}


/* =====================================================
   LOAD HTML2CANVAS
===================================================== */

function loadHtml2Canvas(){

    return new Promise(
        function(resolve,reject){

            const script =
                document.createElement("script");

            script.src =
                "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";

            script.onload =
                resolve;

            script.onerror =
                reject;

            document.head.appendChild(script);

        }
    );

}


/* =====================================================
   PNG
===================================================== */

async function downloadPNG(){

    try{

        const canvas =
            await createCanvas();

        const link =
            document.createElement("a");

        link.download =
            "Janjua-Traders-Product.png";

        link.href =
            canvas.toDataURL("image/png");

        link.click();

    }
    catch(error){

        console.error(error);

        alert(
            "PNG Download میں مسئلہ آیا ہے۔"
        );

    }

}


/* =====================================================
   JPG
===================================================== */

async function downloadJPG(){

    try{

        const canvas =
            await createCanvas();


        /*
         * JPG کے لیے سفید background
         */

        const finalCanvas =
            document.createElement("canvas");

        finalCanvas.width =
            canvas.width;

        finalCanvas.height =
            canvas.height;


        const ctx =
            finalCanvas.getContext("2d");


        ctx.fillStyle =
            "#ffffff";

        ctx.fillRect(
            0,
            0,
            finalCanvas.width,
            finalCanvas.height
        );


        ctx.drawImage(
            canvas,
            0,
            0
        );


        const link =
            document.createElement("a");

        link.download =
            "Janjua-Traders-Product.jpg";

        link.href =
            finalCanvas.toDataURL(
                "image/jpeg",
                0.95
            );

        link.click();

    }
    catch(error){

        console.error(error);

        alert(
            "JPG Download میں مسئلہ آیا ہے۔"
        );

    }

}

</script>

</body>
</html>
