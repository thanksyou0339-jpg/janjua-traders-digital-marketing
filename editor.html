<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Janjua Traders - Product Editor</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#eef0f3;
    color:#111827;
    font-family:Arial,"Noto Sans",sans-serif;
}

.header{
    background:#111827;
    color:white;
    padding:14px;
    text-align:center;
}

.header h1{
    margin:0;
    font-size:21px;
}

.header p{
    margin:5px 0 0;
    font-size:12px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:12px;
}

.panel{
    background:white;
    border-radius:14px;
    padding:14px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.section{
    border:1px solid #ddd;
    border-radius:11px;
    padding:12px;
    margin-bottom:12px;
}

.section-title{
    font-size:16px;
    font-weight:bold;
    margin-bottom:10px;
}

.field{
    margin-bottom:11px;
}

label{
    display:block;
    font-weight:bold;
    font-size:14px;
    margin-bottom:5px;
}

input,
select{
    width:100%;
    padding:10px;
    border:1px solid #cfd3d8;
    border-radius:8px;
    font-size:14px;
}

button{
    width:100%;
    border:0;
    border-radius:8px;
    padding:10px;
    margin-top:6px;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
}

.blue{
    background:#2563eb;
    color:white;
}

.green{
    background:#16a34a;
    color:white;
}

.dark{
    background:#374151;
    color:white;
}

.gold{
    background:#d4a017;
    color:white;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.star-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
}

.star-buttons button{
    margin:0;
    background:white;
    color:#111;
    border:1px solid #d4a017;
}

.side-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.side-buttons button{
    margin:0;
}

.slider-row{
    display:grid;
    grid-template-columns:1fr 60px;
    gap:10px;
    align-items:center;
    margin-bottom:10px;
}

.slider-row input[type="range"]{
    width:100%;
    padding:0;
}

.size-value{
    background:#f3f4f6;
    border-radius:7px;
    padding:8px;
    text-align:center;
    font-weight:bold;
}

.custom-row{
    display:grid;
    grid-template-columns:1fr 110px;
    gap:7px;
}

.canvas-box{
    background:#dfe3e8;
    border-radius:11px;
    padding:8px;
    overflow:auto;
}

canvas{
    display:block;
    margin:auto;
    max-width:100%;
    height:auto;
    touch-action:none;
}

.status{
    margin-top:8px;
    background:#f3f4f6;
    padding:9px;
    border-radius:7px;
    font-size:12px;
    text-align:center;
}

.link-box{
    margin-top:6px;
    background:#f3f4f6;
    padding:8px;
    border-radius:7px;
    direction:ltr;
    text-align:left;
    word-break:break-all;
    font-size:11px;
}

@media(max-width:700px){

    .grid{
        grid-template-columns:1fr;
    }

    .star-buttons{
        grid-template-columns:1fr 1fr;
    }

    .custom-row{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<script>


/* =====================================================
BASIC
===================================================== */

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");


let mainImage = null;

let logoImage = null;

let logoScale = 1;

let starColor = "#D4A017";

let starSide = "right";

let elements = [];

let draggingElement = null;

let dragOffsetX = 0;

let dragOffsetY = 0;


/* =====================================================
SIZE SETTINGS
===================================================== */

let textSize =
14;

let starSize =
18;


/* =====================================================
IMAGE
===================================================== */

document
.getElementById("imageInput")
.addEventListener(
"change",
function(){

    const file =
    this.files[0];

    if(!file){
        return;
    }


    const reader =
    new FileReader();


    reader.onload =
    function(e){

        const img =
        new Image();


        img.onload =
        function(){

            mainImage =
            img;


            /*
             * اصل تصویر کا اصل سائز
             */

            canvas.width =
            img.naturalWidth;

            canvas.height =
            img.naturalHeight;


            elements = [];


            document
            .getElementById("status")
            .textContent =
            "تصویر تیار ہے۔";


            draw();

        };


        img.src =
        e.target.result;

    };


    reader.readAsDataURL(file);

});


/* =====================================================
LOGO
===================================================== */

document
.getElementById("logoInput")
.addEventListener(
"change",
function(){

    const file =
    this.files[0];

    if(!file){
        return;
    }


    const reader =
    new FileReader();


    reader.onload =
    function(e){

        const img =
        new Image();


        img.onload =
        function(){

            logoImage =
            img;

            draw();

        };


        img.src =
        e.target.result;

    };


    reader.readAsDataURL(file);

});


/* =====================================================
LOGO SIZE
===================================================== */

document
.getElementById("logoBigger")
.addEventListener(
"click",
function(){

    logoScale *= 1.12;

    draw();

});


document
.getElementById("logoSmaller")
.addEventListener(
"click",
function(){

    logoScale *= .89;

    draw();

});


/* =====================================================
TEXT SIZE
===================================================== */

const textSlider =
document.getElementById(
    "textSize"
);

const textValue =
document.getElementById(
    "textSizeValue"
);


textSlider.addEventListener(
"input",
function(){

    textSize =
    Number(this.value);


    textValue.textContent =
    textSize;


    draw();

});


/* =====================================================
STAR SIZE
===================================================== */

const starSlider =
document.getElementById(
    "starSize"
);

const starValue =
document.getElementById(
    "starSizeValue"
);


starSlider.addEventListener(
"input",
function(){

    starSize =
    Number(this.value);


    starValue.textContent =
    starSize;


    draw();

});


/* =====================================================
RTL
===================================================== */

function isRTL(text){

    return /[\u0590-\u08FF]/.test(text);

}


/* =====================================================
ADD ELEMENT
===================================================== */

function addElement(
type,
text
){

    if(
        !mainImage ||
        !text
    ){

        return;

    }


    const margin =
    canvas.width * .06;


    let x;


    if(
        starSide ===
        "right"
    ){

        x =
        canvas.width -
        margin;

    }else{

        x =
        margin;

    }


    /*
     * ہر نئی چیز نیچے سے
     * اگلی مناسب لائن پر
     */

    const y =
    canvas.height *
    .16
    +
    elements.length *
    canvas.height *
    .085;


    elements.push({

        type:type,

        text:text,

        x:x,

        y:y,

        side:starSide

    });


    draw();

}


/* =====================================================
PRODUCT
===================================================== */

document
.getElementById("addProduct")
.addEventListener(
"click",
function(){

    const value =
    document
    .getElementById(
        "productName"
    )
    .value
    .trim();


    if(!value){

        alert(
            "Product Name لکھیں۔"
        );

        return;

    }


    addElement(
        "product",
        value
    );

});


/* =====================================================
COUNTRY
===================================================== */

document
.getElementById("addCountry")
.addEventListener(
"click",
function(){

    const value =
    document
    .getElementById(
        "country"
    )
    .value
    .trim();


    if(!value){

        alert(
            "Country منتخب کریں۔"
        );

        return;

    }


    addElement(
        "country",
        "ملکِ تیاری: " +
        value
    );

});


/* =====================================================
PRICE
===================================================== */

document
.getElementById("addPrice")
.addEventListener(
"click",
function(){

    const value =
    document
    .getElementById(
        "price"
    )
    .value
    .trim();


    if(!value){

        alert(
            "Price لکھیں۔"
        );

        return;

    }


    addElement(
        "price",
        "قیمت: " +
        value
    );

});


/* =====================================================
READY STARS
===================================================== */

document
.querySelectorAll(
"[data-star]"
)
.forEach(
function(button){

    button.addEventListener(
    "click",
    function(){

        addElement(
            "star",
            this.dataset.star
        );

    });

});


/* =====================================================
CUSTOM STAR
===================================================== */

document
.getElementById("addCustomStar")
.addEventListener(
"click",
function(){

    const input =
    document
    .getElementById(
        "customStar"
    );


    const value =
    input.value.trim();


    if(!value){

        alert(
            "عبارت لکھیں۔"
        );

        return;

    }


    addElement(
        "star",
        value
    );


    input.value = "";

});


/* =====================================================
ENTER = ADD
===================================================== */

document
.getElementById("customStar")
.addEventListener(
"keydown",
function(event){

    if(
        event.key ===
        "Enter"
    ){

        event.preventDefault();


        document
        .getElementById(
            "addCustomStar"
        )
        .click();

    }

});


/* =====================================================
RIGHT
===================================================== */

document
.getElementById("starsRight")
.addEventListener(
"click",
function(){

    starSide =
    "right";


    elements.forEach(
    function(element){

        if(
            element.type ===
            "star"
        ){

            element.side =
            "right";


            element.x =
            canvas.width -
            canvas.width *
            .06;

        }

    });


    draw();

});


/* =====================================================
LEFT
===================================================== */

document
.getElementById("starsLeft")
.addEventListener(
"click",
function(){

    starSide =
    "left";


    elements.forEach(
    function(element){

        if(
            element.type ===
            "star"
        ){

            element.side =
            "left";


            element.x =
            canvas.width *
            .06;

        }

    });


    draw();

});


/* =====================================================
STAR COLOR
===================================================== */

document
.getElementById("goldStars")
.addEventListener(
"click",
function(){

    starColor =
    "#D4A017";


    draw();

});


document
.getElementById("blackStars")
.addEventListener(
"click",
function(){

    starColor =
    "#111111";


    draw();

});


/* =====================================================
DRAW STAR
===================================================== */

function drawStar(
cx,
cy,
outer,
inner
){

    let rotation =
    -Math.PI / 2;


    const step =
    Math.PI / 5;


    ctx.beginPath();


    for(
        let i=0;
        i<10;
        i++
    ){

        const radius =
        i % 2 === 0
        ? outer
        : inner;


        const x =
        cx +
        Math.cos(rotation)
        * radius;


        const y =
        cy +
        Math.sin(rotation)
        * radius;


        if(i === 0){

            ctx.moveTo(
                x,
                y
            );

        }else{

            ctx.lineTo(
                x,
                y
            );

        }


        rotation +=
        step;

    }


    ctx.closePath();

    ctx.fill();

}


/* =====================================================
LOGO
===================================================== */

function drawLogo(){

    if(!logoImage){
        return;
    }


    /*
     * Logo پہلے سے بہتر بڑا
     */

    const width =
    canvas.width *
    .18 *
    logoScale;


    const ratio =
    logoImage.height /
    logoImage.width;


    const height =
    width *
    ratio;


    const x =
    canvas.width -
    width -
    canvas.width *
    .025;


    const y =
    canvas.height *
    .025;


    ctx.drawImage(

        logoImage,

        x,
        y,

        width,
        height

    );

}


/* =====================================================
DRAW ELEMENTS
===================================================== */

function drawElements(){

    elements.forEach(
    function(element){

        const rtl =
        isRTL(
            element.text
        );


        let fontSize;


        if(
            element.type ===
            "product"
        ){

            fontSize =
            textSize * 1.25;

        }
        else if(
            element.type ===
            "country"
        ){

            fontSize =
            textSize;

        }
        else if(
            element.type ===
            "price"
        ){

            fontSize =
            textSize * 1.15;

        }
        else{

            fontSize =
            textSize;

        }


        /*
         * موبائل کے لیے واضح
         * مگر بہت بڑا نہیں
         */

        ctx.font =
        "bold " +
        fontSize +
        "px Arial";


        ctx.textBaseline =
        "middle";


        /* ================================================
           STAR
        ================================================= */

        if(
            element.type ===
            "star"
        ){

            const radius =
            starSize;


            ctx.save();


            ctx.fillStyle =
            starColor;


            ctx.shadowColor =
            "rgba(0,0,0,.30)";

            ctx.shadowBlur =
            Math.max(
                2,
                starSize * .20
            );


            drawStar(

                element.x,

                element.y,

                radius,

                radius * .45

            );


            ctx.fill();


            ctx.restore();


            ctx.fillStyle =
            "#111";


            ctx.font =
            "bold " +
            textSize +
            "px Arial";


            if(
                element.side ===
                "right"
            ){

                ctx.textAlign =
                "right";


                ctx.direction =
                rtl
                ? "rtl"
                : "ltr";


                ctx.fillText(

                    element.text,

                    element.x -
                    radius -
                    10,

                    element.y

                );

            }else{

                ctx.textAlign =
                "left";


                ctx.direction =
                rtl
                ? "rtl"
                : "ltr";


                ctx.fillText(

                    element.text,

                    element.x +
                    radius +
                    10,

                    element.y

                );

            }

        }


        /* ================================================
           NORMAL TEXT
        ================================================= */

        else{

            ctx.fillStyle =
            "#111";


            ctx.font =
            "bold " +
            fontSize +
            "px Arial";


            const x =
            element.side ===
            "right"

            ? canvas.width -
              canvas.width *
              .06

            : canvas.width *
              .06;


            ctx.textAlign =
            element.side ===
            "right"
            ? "right"
            : "left";


            ctx.direction =
            rtl
            ? "rtl"
            : "ltr";


            ctx.fillText(

                element.text,

                x,

                element.y

            );

        }

    });

}


/* =====================================================
DRAW
===================================================== */

function draw(){

    if(!mainImage){

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        return;

    }


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
     * Original Image
     */

    ctx.drawImage(

        mainImage,

        0,
        0,

        canvas.width,
        canvas.height

    );


    drawLogo();

    drawElements();

}


/* =====================================================
LINK
===================================================== */

document
.getElementById("productLink")
.addEventListener(
"input",
function(){

    document
    .getElementById(
        "linkStatus"
    )
    .textContent =
    this.value.trim()
    ||
    "Product Link یہاں دکھائی دے گا۔";

});


/* =====================================================
COPY LINK
===================================================== */

document
.getElementById("copyLink")
.addEventListener(
"click",
async function(){

    const link =
    document
    .getElementById(
        "productLink"
    )
    .value
    .trim();


    if(!link){

        alert(
            "پہلے Product Link ڈالیں۔"
        );

        return;

    }


    try{

        await navigator
        .clipboard
        .writeText(link);


        alert(
            "Product Link Copy ہو گیا۔"
        );

    }catch(error){

        alert(link);

    }

});


/* =====================================================
FIND ELEMENT
===================================================== */

function findElement(
x,
y
){

    for(
        let i =
        elements.length - 1;

        i >= 0;

        i--
    ){

        const element =
        elements[i];


        const hitWidth =
        canvas.width *
        .40;


        if(

            Math.abs(
                x -
                element.x
            ) < hitWidth

            &&

            Math.abs(
                y -
                element.y
            ) < 60

        ){

            return element;

        }

    }


    return null;

}


/* =====================================================
POINTER
===================================================== */

function pointerPosition(
event
){

    const rect =
    canvas.getBoundingClientRect();


    const point =
    event.touches
    ? event.touches[0]
    : event;


    return {

        x:
        (point.clientX -
        rect.left)
        *
        canvas.width /
        rect.width,


        y:
        (point.clientY -
        rect.top)
        *
        canvas.height /
        rect.height

    };

}


/* =====================================================
MOUSE DOWN
===================================================== */

canvas.addEventListener(
"mousedown",
function(event){

    const point =
    pointerPosition(
        event
    );


    draggingElement =
    findElement(
        point.x,
        point.y
    );


    if(
        draggingElement
    ){

        dragOffsetX =
        point.x -
        draggingElement.x;


        dragOffsetY =
        point.y -
        draggingElement.y;

    }

});


/* =====================================================
MOUSE MOVE
===================================================== */

canvas.addEventListener(
"mousemove",
function(event){

    if(
        !draggingElement
    ){

        return;

    }


    const point =
    pointerPosition(
        event
    );


    draggingElement.x =
    point.x -
    dragOffsetX;


    draggingElement.y =
    point.y -
    dragOffsetY;


    draw();

});


/* =====================================================
MOUSE UP
===================================================== */

canvas.addEventListener(
"mouseup",
function(){

    draggingElement =
    null;

});


canvas.addEventListener(
"mouseleave",
function(){

    draggingElement =
    null;

});


/* =====================================================
TOUCH START
===================================================== */

canvas.addEventListener(
"touchstart",
function(event){

    const point =
    pointerPosition(
        event
    );


    draggingElement =
    findElement(
        point.x,
        point.y
    );


    if(
        draggingElement
    ){

        dragOffsetX =
        point.x -
        draggingElement.x;


        dragOffsetY =
        point.y -
        draggingElement.y;

    }

},
{
    passive:true
});


/* =====================================================
TOUCH MOVE
===================================================== */

canvas.addEventListener(
"touchmove",
function(event){

    if(
        !draggingElement
    ){

        return;

    }


    const point =
    pointerPosition(
        event
    );


    draggingElement.x =
    point.x -
    dragOffsetX;


    draggingElement.y =
    point.y -
    dragOffsetY;


    draw();

},
{
    passive:true
});


/* =====================================================
TOUCH END
===================================================== */

canvas.addEventListener(
"touchend",
function(){

    draggingElement =
    null;

});

/* =====================================================
JPG
===================================================== */

document
.getElementById("downloadJPG")
.addEventListener(
"click",
function(){

    if(!mainImage){

        alert(
            "پہلے Product Image منتخب کریں۔"
        );

        return;

    }


    const temp =
    document.createElement(
        "canvas"
    );


    temp.width =
    canvas.width;


    temp.height =
    canvas.height;


    const tempCtx =
    temp.getContext(
        "2d"
    );


    tempCtx.fillStyle =
    "#ffffff";


    tempCtx.fillRect(

        0,
        0,

        temp.width,
        temp.height

    );


    tempCtx.drawImage(
        canvas,
        0,
        0
    );


    const link =
    document.createElement(
        "a"
    );


    link.download =
    "janjua-traders-product.jpg";


    link.href =
    temp.toDataURL(
        "image/jpeg",
        .95
    );


    link.click();

});
