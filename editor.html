<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Janjua Traders - Product Editor</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#eef0f3;
    color:#111;
    font-family:Arial, "Noto Sans", sans-serif;
}

.header{
    background:#111827;
    color:#fff;
    padding:15px;
    text-align:center;
}

.header h1{
    margin:0;
    font-size:22px;
}

.header p{
    margin:5px 0 0;
    font-size:13px;
}

.container{
    max-width:1150px;
    margin:auto;
    padding:14px;
}

.panel{
    background:#fff;
    border-radius:14px;
    padding:16px;
    box-shadow:0 3px 14px rgba(0,0,0,.08);
}

.section{
    border:1px solid #ddd;
    border-radius:12px;
    padding:13px;
    margin-bottom:14px;
}

.section-title{
    font-size:17px;
    font-weight:bold;
    margin-bottom:12px;
}

.field{
    margin-bottom:12px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:6px;
}

input,
select{
    width:100%;
    padding:11px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

button{
    width:100%;
    border:0;
    border-radius:9px;
    padding:11px 10px;
    margin-top:7px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

.blue{
    background:#2563eb;
    color:#fff;
}

.green{
    background:#16a34a;
    color:#fff;
}

.dark{
    background:#374151;
    color:#fff;
}

.gold{
    background:#d4a017;
    color:#fff;
}

.red{
    background:#dc2626;
    color:#fff;
}

.star-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.star-buttons button{
    margin:0;
    background:#fff;
    color:#111;
    border:1px solid #d4a017;
}

.star-buttons button:hover{
    background:#fff7d6;
}

.side-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.side-buttons button{
    margin:0;
}

.custom-row{
    display:grid;
    grid-template-columns:1fr 120px;
    gap:8px;
}

.canvas-box{
    background:#dfe3e8;
    border-radius:12px;
    padding:10px;
    overflow:auto;
}

canvas{
    display:block;
    margin:auto;
    max-width:100%;
    height:auto;
    touch-action:none;
}

.status{
    margin-top:10px;
    padding:10px;
    background:#f3f4f6;
    border-radius:8px;
    font-size:13px;
    text-align:center;
}

.link-box{
    margin-top:7px;
    padding:9px;
    background:#f3f4f6;
    border-radius:7px;
    direction:ltr;
    text-align:left;
    word-break:break-all;
    font-size:12px;
}

@media(max-width:700px){

    .grid{
        grid-template-columns:1fr;
    }

    .star-buttons{
        grid-template-columns:1fr 1fr;
    }

    .custom-row{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<script>


/* =====================================================
   BASIC VARIABLES
===================================================== */

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const statusBox =
document.getElementById("status");

let mainImage = null;

let logoImage = null;

let logoScale = 1;

let starColor = "#D4A017";

let starSide = "right";

let elements = [];

let draggingElement = null;

let dragOffsetX = 0;

let dragOffsetY = 0;


/* =====================================================
   FONT SIZES
===================================================== */

const FONT_PRODUCT = 58;

const FONT_COUNTRY = 44;

const FONT_PRICE = 52;

const FONT_STAR = 42;


/* =====================================================
   IMAGE LOAD
===================================================== */

document
.getElementById("imageInput")
.addEventListener(
"change",
function(){

    const file =
    this.files[0];

    if(!file){
        return;
    }

    const reader =
    new FileReader();

    reader.onload =
    function(e){

        const img =
        new Image();

        img.onload =
        function(){

            mainImage =
            img;

            canvas.width =
            img.naturalWidth;

            canvas.height =
            img.naturalHeight;

            elements = [];

            statusBox.textContent =
            "تصویر تیار ہے۔ اب Product / Country / Price یا Stars شامل کریں۔";

            draw();

        };

        img.src =
        e.target.result;

    };

    reader.readAsDataURL(file);

});


/* =====================================================
   LOGO LOAD
===================================================== */

document
.getElementById("logoInput")
.addEventListener(
"change",
function(){

    const file =
    this.files[0];

    if(!file){
        return;
    }

    const reader =
    new FileReader();

    reader.onload =
    function(e){

        const img =
        new Image();

        img.onload =
        function(){

            logoImage =
            img;

            draw();

        };

        img.src =
        e.target.result;

    };

    reader.readAsDataURL(file);

});


/* =====================================================
   TEXT DIRECTION
===================================================== */

function isRTL(text){

    return /[\u0590-\u08FF]/.test(text);

}


/* =====================================================
   CREATE ELEMENT
===================================================== */

function addElement(
type,
text
){

    if(!mainImage || !text){
        return;
    }


    const margin =
    canvas.width * 0.07;


    let x;

    if(starSide === "right"){

        x =
        canvas.width -
        margin;

    }else{

        x =
        margin;

    }


    /*
     * ہر نئی چیز اگلی لائن پر
     */

    const sameType =
    elements.filter(
        e => e.type === type
    );


    const y =
    canvas.height *
    0.18
    +
    elements.length *
    canvas.height *
    0.10;


    elements.push({

        type:type,

        text:text,

        x:x,

        y:y,

        side:starSide

    });


    draw();

}


/* =====================================================
   PRODUCT BUTTON
===================================================== */

document
.getElementById("addProduct")
.addEventListener(
"click",
function(){

    const value =
    document
    .getElementById("productName")
    .value
    .trim();


    if(!value){

        alert(
            "پہلے Product Name لکھیں۔"
        );

        return;

    }


    addElement(
        "product",
        value
    );

});


/* =====================================================
   COUNTRY BUTTON
===================================================== */

document
.getElementById("addCountry")
.addEventListener(
"click",
function(){

    const value =
    document
    .getElementById("country")
    .value
    .trim();


    if(!value){

        alert(
            "پہلے Country منتخب کریں۔"
        );

        return;

    }


    addElement(
        "country",
        "ملکِ تیاری: " + value
    );

});


/* =====================================================
   PRICE BUTTON
===================================================== */

document
.getElementById("addPrice")
.addEventListener(
"click",
function(){

    const value =
    document
    .getElementById("price")
    .value
    .trim();


    if(!value){

        alert(
            "پہلے Price لکھیں۔"
        );

        return;

    }


    addElement(
        "price",
        "قیمت: " + value
    );

});


/* =====================================================
   READY STAR BUTTONS
===================================================== */

document
.querySelectorAll(
"[data-star]"
)
.forEach(
function(button){

    button.addEventListener(
    "click",
    function(){

        addElement(
            "star",
            this.dataset.star
        );

    });

});


/* =====================================================
   CUSTOM STAR
===================================================== */

document
.getElementById("addCustomStar")
.addEventListener(
"click",
function(){

    const input =
    document
    .getElementById("customStar");


    const value =
    input.value.trim();


    if(!value){

        alert(
            "اپنی عبارت پہلے لکھیں۔"
        );

        return;

    }


    addElement(
        "star",
        value
    );


    input.value = "";

});


/* =====================================================
   ENTER KEY CUSTOM STAR
===================================================== */

document
.getElementById("customStar")
.addEventListener(
"keydown",
function(event){

    if(
        event.key ===
        "Enter"
    ){

        event.preventDefault();

        document
        .getElementById(
            "addCustomStar"
        )
        .click();

    }

});


/* =====================================================
   RIGHT SIDE
===================================================== */

document
.getElementById("starsRight")
.addEventListener(
"click",
function(){

    starSide =
    "right";


    elements.forEach(
    function(element){

        if(
            element.type ===
            "star"
        ){

            element.side =
            "right";

            element.x =
            canvas.width -
            canvas.width *
            0.07;

        }

    });


    draw();

});


/* =====================================================
   LEFT SIDE
===================================================== */

document
.getElementById("starsLeft")
.addEventListener(
"click",
function(){

    starSide =
    "left";


    elements.forEach(
    function(element){

        if(
            element.type ===
            "star"
        ){

            element.side =
            "left";

            element.x =
            canvas.width *
            0.07;

        }

    });


    draw();

});


/* =====================================================
   GOLD STAR
===================================================== */

document
.getElementById("goldStars")
.addEventListener(
"click",
function(){

    starColor =
    "#D4A017";

    draw();

});


/* =====================================================
   BLACK STAR
===================================================== */

document
.getElementById("blackStars")
.addEventListener(
"click",
function(){

    starColor =
    "#111111";

    draw();

});


/* =====================================================
   LOGO SIZE
===================================================== */

document
.getElementById("logoBigger")
.addEventListener(
"click",
function(){

    logoScale *=
    1.15;

    draw();

});


document
.getElementById("logoSmaller")
.addEventListener(
"click",
function(){

    logoScale *=
    0.87;

    draw();

});


/* =====================================================
   DRAW STAR
===================================================== */

function drawStar(
cx,
cy,
outer,
inner
){

    let rotation =
    -Math.PI / 2;

    const step =
    Math.PI / 5;


    ctx.beginPath();

    for(
        let i=0;
        i<10;
        i++
    ){

        const radius =
        i % 2 === 0
        ? outer
        : inner;


        const x =
        cx +
        Math.cos(rotation)
        * radius;


        const y =
        cy +
        Math.sin(rotation)
        * radius;


        if(i === 0){

            ctx.moveTo(
                x,
                y
            );

        }else{

            ctx.lineTo(
                x,
                y
            );

        }


        rotation +=
        step;

    }


    ctx.closePath();

    ctx.fill();

}


/* =====================================================
   DRAW LOGO
===================================================== */

function drawLogo(){

    if(!logoImage){
        return;
    }


    const baseWidth =
    canvas.width *
    0.18;


    const width =
    baseWidth *
    logoScale;


    const ratio =
    logoImage.height /
    logoImage.width;


    const height =
    width * ratio;


    const x =
    canvas.width -
    width -
    canvas.width *
    0.025;


    const y =
    canvas.height *
    0.025;


    ctx.drawImage(

        logoImage,

        x,
        y,

        width,
        height

    );

}


/* =====================================================
   DRAW ELEMENTS
===================================================== */

function drawElements(){

    elements.forEach(
    function(element){

        const rtl =
        isRTL(element.text);


        let fontSize;


        if(
            element.type ===
            "product"
        ){

            fontSize =
            FONT_PRODUCT;

        }
        else if(
            element.type ===
            "country"
        ){

            fontSize =
            FONT_COUNTRY;

        }
        else if(
            element.type ===
            "price"
        ){

            fontSize =
            FONT_PRICE;

        }
        else{

            fontSize =
            FONT_STAR;

        }


        ctx.font =
        "bold " +
        fontSize +
        "px Arial";


        ctx.textBaseline =
        "middle";


        /*
         * STAR
         */

        if(
            element.type ===
            "star"
        ){

            const starRadius =
            Math.max(
                27,
                canvas.width *
                0.025
            );


            let starX;


            if(
                element.side ===
                "right"
            ){

                starX =
                element.x;

            }else{

                starX =
                element.x;

            }


            ctx.save();


            ctx.fillStyle =
            starColor;


            ctx.shadowColor =
            "rgba(0,0,0,.35)";

            ctx.shadowBlur =
            8;


            drawStar(

                starX,

                element.y,

                starRadius,

                starRadius * .45

            );


            ctx.fill();

            ctx.restore();


            /*
             * Star Text
             */

            ctx.fillStyle =
            "#111";


            ctx.font =
            "bold " +
            fontSize +
            "px Arial";


            if(
                element.side ===
                "right"
            ){

                ctx.textAlign =
                "right";

                ctx.direction =
                rtl
                ? "rtl"
                : "ltr";


                ctx.fillText(

                    element.text,

                    starX -
                    starRadius -
                    22,

                    element.y

                );

            }else{

                ctx.textAlign =
                "left";

                ctx.direction =
                rtl
                ? "rtl"
                : "ltr";


                ctx.fillText(

                    element.text,

                    starX +
                    starRadius +
                    22,

                    element.y

                );

            }

        }


        /*
         * NORMAL TEXT
         */

        else{

            ctx.fillStyle =
            "#111";


            ctx.font =
            "bold " +
            fontSize +
            "px Arial";


            const x =
            element.side ===
            "right"

            ? canvas.width -
              canvas.width *
              0.06

            : canvas.width *
              0.06;


            ctx.textAlign =
            element.side ===
            "right"
            ? "right"
            : "left";


            ctx.direction =
            rtl
            ? "rtl"
            : "ltr";


            ctx.fillText(

                element.text,

                x,

                element.y

            );

        }

    });

}


/* =====================================================
   MAIN DRAW
===================================================== */

function draw(){

    if(!mainImage){

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        return;

    }


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
     * اصل تصویر
     */

    ctx.drawImage(

        mainImage,

        0,
        0,

        canvas.width,
        canvas.height

    );


    /*
     * Logo
     */

    drawLogo();


    /*
     * Text + Stars
     */

    drawElements();

}


/* =====================================================
   LINK
===================================================== */

document
.getElementById("productLink")
.addEventListener(
"input",
function(){

    document
    .getElementById(
        "linkStatus"
    )
    .textContent =
    this.value.trim()
    ||
    "Product Link یہاں دکھائی دے گا۔";

});


/* =====================================================
   COPY LINK
===================================================== */

document
.getElementById("copyLink")
.addEventListener(
"click",
async function(){

    const link =
    document
    .getElementById(
        "productLink"
    )
    .value.trim();


    if(!link){

        alert(
            "پہلے Product Link ڈالیں۔"
        );

        return;

    }


    try{

        await navigator
        .clipboard
        .writeText(link);


        alert(
            "Product Link Copy ہو گیا۔"
        );

    }catch(error){

        alert(link);

    }

});


/* =====================================================
   FIND ELEMENT FOR DRAG
===================================================== */

function findElement(
x,
y
){

    for(
        let i =
        elements.length - 1;

        i >= 0;

        i--
    ){

        const element =
        elements[i];


        if(
            Math.abs(
                x -
                element.x
            ) < canvas.width * .35
            &&
            Math.abs(
                y -
                element.y
            ) < 70
        ){

            return element;

        }

    }


    return null;

}


/* =====================================================
   POINTER POSITION
===================================================== */

function pointerPosition(
event
){

    const rect =
    canvas.getBoundingClientRect();


    const point =
    event.touches
    ? event.touches[0]
    : event;


    return {

        x:
        (point.clientX -
        rect.left)
        *
        canvas.width /
        rect.width,

        y:
        (point.clientY -
        rect.top)
        *
        canvas.height /
        rect.height

    };

}


/* =====================================================
   MOUSE DOWN
===================================================== */

canvas.addEventListener(
"mousedown",
function(event){

    const point =
    pointerPosition(event);


    draggingElement =
    findElement(
        point.x,
        point.y
    );


    if(
        draggingElement
    ){

        dragOffsetX =
        point.x -
        draggingElement.x;

        dragOffsetY =
        point.y -
        draggingElement.y;

    }

});


/* =====================================================
   MOUSE MOVE
===================================================== */

canvas.addEventListener(
"mousemove",
function(event){

    if(
        !draggingElement
    ){

        return;

    }


    const point =
    pointerPosition(event);


    draggingElement.x =
    point.x -
    dragOffsetX;


    draggingElement.y =
    point.y -
    dragOffsetY;


    draw();

});


/* =====================================================
   MOUSE UP
===================================================== */

canvas.addEventListener(
"mouseup",
function(){

    draggingElement =
    null;

});


canvas.addEventListener(
"mouseleave",
function(){

    draggingElement =
    null;

});


/* =====================================================
   TOUCH START
===================================================== */

canvas.addEventListener(
"touchstart",
function(event){

    const point =
    pointerPosition(event);


    draggingElement =
    findElement(
        point.x,
        point.y
    );


    if(
        draggingElement
    ){

        dragOffsetX =
        point.x -
        draggingElement.x;

        dragOffsetY =
        point.y -
        draggingElement.y;

    }

},
{
    passive:true
});


/* =====================================================
   TOUCH MOVE
===================================================== */

canvas.addEventListener(
"touchmove",
function(event){

    if(
        !draggingElement
    ){

        return;

    }


    const point =
    pointerPosition(event);


    draggingElement.x =
    point.x -
    dragOffsetX;


    draggingElement.y =
    point.y -
    dragOffsetY;


    draw();

},
{
    passive:true
});


/* =====================================================
   TOUCH END
===================================================== */

canvas.addEventListener(
"touchend",
function(){

    draggingElement =
    null;

});

/* =====================================================
   DOWNLOAD JPG
===================================================== */

document
.getElementById("downloadJPG")
.addEventListener(
"click",
function(){

    if(!mainImage){

        alert(
            "پہلے Product Image منتخب کریں۔"
        );

        return;

    }


    const jpgCanvas =
    document.createElement(
        "canvas"
    );


    jpgCanvas.width =
    canvas.width;

    jpgCanvas.height =
    canvas.height;


    const jpgCtx =
    jpgCanvas.getContext(
        "2d"
    );


    /*
     * سفید صرف JPG میں
     */

    jpgCtx.fillStyle =
    "#ffffff";


    jpgCtx.fillRect(

        0,
        0,

        jpgCanvas.width,
        jpgCanvas.height

    );


    jpgCtx.drawImage(
        canvas,
        0,
        0
    );


    const link =
    document.createElement(
        "a"
    );


    link.download =
    "janjua-traders-product.jpg";


    link.href =
    jpgCanvas.toDataURL(
        "image/jpeg",
        0.95
    );


    link.click();

});
