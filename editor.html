<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Janjua Traders Image Editor</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:12px;
    background:#e7e9ed;
    font-family:Arial,"Noto Nastaliq Urdu",sans-serif;
}

.editor{
    width:100%;
    max-width:1100px;
    margin:auto;
}

h1{
    text-align:center;
    font-size:21px;
    margin:5px 0 15px;
}

.controls{
    background:#fff;
    padding:14px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.12);
    margin-bottom:15px;
}

.section{
    margin-bottom:15px;
}

.section label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

input[type="file"],
textarea,
select{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

textarea{
    min-height:55px;
}

button{
    border:0;
    border-radius:8px;
    padding:9px 12px;
    margin:3px;
    cursor:pointer;
    background:#222;
    color:#fff;
}

button:hover{
    opacity:.85;
}

.feature-buttons{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:6px;
}

.feature-buttons button{
    min-height:42px;
    background:#333;
}

.color-grid{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
}

.color{
    width:35px;
    height:35px;
    padding:0;
    border:2px solid #999;
}

.green{
    background:#198754;
}

.blue{
    background:#1769aa;
}

.red{
    background:#c62828;
}

.gold{
    background:#a87900;
}

.preview{
    background:#c9cdd3;
    padding:10px;
    border-radius:15px;
    overflow:auto;
}

canvas{
    display:block;
    margin:auto;
    max-width:100%;
    height:auto;
    box-shadow:0 8px 25px rgba(0,0,0,.3);
}

#logoPreview{
    display:none;
    max-width:90px;
    max-height:60px;
    margin-top:7px;
}

</style>

</head>


<body>

<div class="editor">

<h1>
Janjua Traders — Product Designer
</h1>


<div class="controls">


<!-- IMAGE -->

<div class="section">

<label>
1۔ Product Image
</label>

<input
type="file"
id="imageInput"
accept="image/*">

</div>


<!-- LOGO -->

<div class="section">

<label>
2۔ اپنا Logo / Monogram
</label>

<input
type="file"
id="logoInput"
accept="image/*">

<img
id="logoPreview">

</div>


<!-- PANEL POSITION -->

<div class="section">

<label>
3۔ تصویر اور Information Panel کی ترتیب
</label>

<button
onclick="setLayout('imageLeft')"
class="blue">

تصویر بائیں — معلومات دائیں

</button>

<button
onclick="setLayout('imageRight')"
class="blue">

تصویر دائیں — معلومات بائیں

</button>

</div>


<!-- FEATURES -->

<div class="section">

<label>
4۔ تیار Features — صرف Button دبائیں
</label>

<div class="feature-buttons">

<button onclick="selectFeature(1)">
⭐ 1 — خوبصورت
</button>

<button onclick="selectFeature(2)">
⭐ 2 — پائیدار
</button>

<button onclick="selectFeature(3)">
⭐ 3 — مضبوط
</button>

<button onclick="selectFeature(4)">
⭐ 4 — بہترین کوالٹی
</button>

<button onclick="selectFeature(5)">
⭐ 5 — کم قیمت
</button>

<button onclick="selectFeature(6)">
⭐ 6 — پاکستانی پروڈکٹ
</button>

<button onclick="selectFeature(7)">
⭐ 7 — بہترین انتخاب
</button>

<button onclick="selectFeature(8)">
⭐ 8 — قابل اعتماد
</button>

</div>

</div>


<!-- CUSTOM TEXT -->

<div class="section">

<label>
5۔ اپنی عبارت
</label>

<textarea
id="customText"
placeholder="مثلاً: اصل پاکستانی پروڈکٹ">
</textarea>

<button
onclick="addCustomFeature()"
class="gold">

⭐ عبارت شامل کریں

</button>

</div>


<!-- TEXT COLOR -->

<div class="section">

<label>
6۔ Text Color
</label>

<div class="color-grid">

<button
class="color"
style="background:#ffffff"
onclick="setTextColor('#ffffff')">
</button>

<button
class="color"
style="background:#000000"
onclick="setTextColor('#000000')">
</button>

<button
class="color"
style="background:#ff0000"
onclick="setTextColor('#ff0000')">
</button>

<button
class="color"
style="background:#ffd700"
onclick="setTextColor('#ffd700')">
</button>

<button
class="color"
style="background:#00aaff"
onclick="setTextColor('#00aaff')">
</button>

<button
class="color"
style="background:#00c853"
onclick="setTextColor('#00c853')">
</button>

<button
class="color"
style="background:#ff6d00"
onclick="setTextColor('#ff6d00')">
</button>

<button
class="color"
style="background:#e91e63"
onclick="setTextColor('#e91e63')">
</button>

<button
class="color"
style="background:#9c27b0"
onclick="setTextColor('#9c27b0')">
</button>

<button
class="color"
style="background:#00bcd4"
onclick="setTextColor('#00bcd4')">
</button>

<button
class="color"
style="background:#c0c0c0"
onclick="setTextColor('#c0c0c0')">
</button>

</div>

</div>


<!-- STAR COLOR -->

<div class="section">

<label>
7۔ Star Color
</label>

<div class="color-grid">

<button
class="color"
style="background:#ffd700"
onclick="setStarColor('#ffd700')">
</button>

<button
class="color"
style="background:#ffffff"
onclick="setStarColor('#ffffff')">
</button>

<button
class="color"
style="background:#000000"
onclick="setStarColor('#000000')">
</button>

<button
class="color"
style="background:#ff0000"
onclick="setStarColor('#ff0000')">
</button>

<button
class="color"
style="background:#00aaff"
onclick="setStarColor('#00aaff')">
</button>

<button
class="color"
style="background:#00c853"
onclick="setStarColor('#00c853')">
</button>

<button
class="color"
style="background:#ff6d00"
onclick="setStarColor('#ff6d00')">
</button>

<button
class="color"
style="background:#e91e63"
onclick="setStarColor('#e91e63')">
</button>

<button
class="color"
style="background:#9c27b0"
onclick="setStarColor('#9c27b0')">
</button>

</div>

</div>


<!-- FONT SIZE -->

<div class="section">

<label>
8۔ Font Size
<span id="sizeValue">24</span>
</label>

<input
type="range"
id="fontSize"
min="14"
max="40"
value="24"
oninput="changeSize()">

</div>


<!-- TEXT FORMAT -->

<div class="section">

<label>
9۔ Text Style
</label>

<button onclick="toggleBold()">
<b>B</b>
</button>

<button onclick="toggleItalic()">
<i>I</i>
</button>

<button onclick="toggleUnderline()">
<u>U</u>
</button>

</div>


<!-- REMOVE -->

<div class="section">

<button
onclick="removeSelected()"
class="red">

Selected Feature ختم کریں

</button>

<button
onclick="clearAll()"
class="red">

تمام Features ختم کریں

</button>

</div>


<!-- DOWNLOAD -->

<div class="section">

<button
onclick="downloadJPG()"
class="green">

JPG Download

</button>

<button
onclick="downloadPNG()"
class="blue">

PNG Download

</button>

</div>

</div>


<!-- CANVAS -->

<div class="preview">

<canvas id="canvas"></canvas>

</div>


</div>


<script>


/* =====================================================
   CANVAS
===================================================== */

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");


/* =====================================================
   VARIABLES
===================================================== */

let productImage = null;

let logoImage = null;


/*
   ایک ہی Page۔
   Page کے اندر دو برابر حصے:
   50% Image
   50% Information
*/

let layout =
"imageLeft";


let textColor =
"#ffffff";

let starColor =
"#ffd700";

let fontSize =
24;

let bold =
false;

let italic =
false;

let underline =
false;

let selectedFeature =
null;


/* =====================================================
   READY FEATURES
===================================================== */

const featureNames = {

1:"خوبصورت",

2:"پائیدار",

3:"مضبوط",

4:"بہترین کوالٹی",

5:"کم قیمت",

6:"پاکستانی پروڈکٹ",

7:"بہترین انتخاب",

8:"قابل اعتماد"

};


/*
   ہر نمبر اپنی جگہ محفوظ ہوگا۔
*/

let features = {};


/* =====================================================
   IMAGE UPLOAD
===================================================== */

document
.getElementById("imageInput")
.addEventListener(
"change",
function(e){

    const file =
    e.target.files[0];

    if(!file)
        return;


    const reader =
    new FileReader();


    reader.onload =
    function(event){

        const img =
        new Image();


        img.onload =
        function(){

            productImage =
            img;

            draw();

        };


        img.src =
        event.target.result;

    };


    reader.readAsDataURL(file);

});


/* =====================================================
   LOGO
===================================================== */

document
.getElementById("logoInput")
.addEventListener(
"change",
function(e){

    const file =
    e.target.files[0];

    if(!file)
        return;


    const reader =
    new FileReader();


    reader.onload =
    function(event){

        const img =
        new Image();


        img.onload =
        function(){

            logoImage =
            img;


            document
            .getElementById(
                "logoPreview"
            )
            .src =
            event.target.result;


            document
            .getElementById(
                "logoPreview"
            )
            .style.display =
            "block";


            draw();

        };


        img.src =
        event.target.result;

    };


    reader.readAsDataURL(file);

});


/* =====================================================
   LAYOUT
===================================================== */

function setLayout(value){

    layout =
    value;

    draw();

}


/* =====================================================
   FEATURE BUTTON
===================================================== */

function selectFeature(number){

    selectedFeature =
    number;


    /*
       اگر Feature پہلی مرتبہ لگ رہا ہے
       تو خود بخود اپنی جگہ بن جائے۔
    */

    if(!features[number]){

        features[number] = {

            text:
            featureNames[number],

            textColor:
            textColor,

            starColor:
            starColor,

            size:
            fontSize,

            bold:
            bold,

            italic:
            italic,

            underline:
            underline

        };

    }


    draw();

}


/* =====================================================
   CUSTOM FEATURE
===================================================== */

function addCustomFeature(){

    const text =
    document
    .getElementById(
        "customText"
    )
    .value
    .trim();


    if(!text){

        alert(
            "پہلے عبارت لکھیں۔"
        );

        return;

    }


    let number =
    1;


    while(
        features[number]
    ){

        number++;

    }


    if(number > 8){

        alert(
            "8 Feature جگہیں مکمل ہو چکی ہیں۔"
        );

        return;

    }


    features[number] = {

        text:
        text,

        textColor:
        textColor,

        starColor:
        starColor,

        size:
        fontSize,

        bold:
        bold,

        italic:
        italic,

        underline:
        underline

    };


    selectedFeature =
    number;


    document
    .getElementById(
        "customText"
    )
    .value =
    "";


    draw();

}


/* =====================================================
   TEXT COLOR
===================================================== */

function setTextColor(color){

    textColor =
    color;


    if(
        selectedFeature &&
        features[selectedFeature]
    ){

        features[
            selectedFeature
        ].textColor =
        color;

    }


    draw();

}


/* =====================================================
   STAR COLOR
===================================================== */

function setStarColor(color){

    starColor =
    color;


    if(
        selectedFeature &&
        features[selectedFeature]
    ){

        features[
            selectedFeature
        ].starColor =
        color;

    }


    draw();

}


/* =====================================================
   FONT SIZE
===================================================== */

function changeSize(){

    fontSize =
    parseInt(
        document
        .getElementById(
            "fontSize"
        )
        .value
    );


    document
    .getElementById(
        "sizeValue"
    )
    .textContent =
    fontSize;


    if(
        selectedFeature &&
        features[selectedFeature]
    ){

        features[
            selectedFeature
        ].size =
        fontSize;

    }


    draw();

}


/* =====================================================
   BOLD
===================================================== */

function toggleBold(){

    bold =
    !bold;


    if(
        selectedFeature &&
        features[selectedFeature]
    ){

        features[
            selectedFeature
        ].bold =
        bold;

    }


    draw();

}


/* =====================================================
   ITALIC
===================================================== */

function toggleItalic(){

    italic =
    !italic;


    if(
        selectedFeature &&
        features[selectedFeature]
    ){

        features[
            selectedFeature
        ].italic =
        italic;

    }


    draw();

}


/* =====================================================
   UNDERLINE
===================================================== */

function toggleUnderline(){

    underline =
    !underline;


    if(
        selectedFeature &&
        features[selectedFeature]
    ){

        features[
            selectedFeature
        ].underline =
        underline;

    }


    draw();

}


/* =====================================================
   REMOVE
===================================================== */

function removeSelected(){

    if(
        !selectedFeature
    ){

        alert(
            "پہلے کوئی Feature منتخب کریں۔"
        );

        return;

    }


    delete features[
        selectedFeature
    ];


    selectedFeature =
    null;


    draw();

}


/* =====================================================
   CLEAR
===================================================== */

function clearAll(){

    features = {};

    selectedFeature =
    null;

    draw();

}


/* =====================================================
   PANEL BACKGROUND
===================================================== */

function panelBackground(
    x,
    width
){

    const gradient =
    ctx.createLinearGradient(
        x,
        0,
        x + width,
        0
    );


    gradient.addColorStop(
        0,
        "#111111"
    );

    gradient.addColorStop(
        .5,
        "#292929"
    );

    gradient.addColorStop(
        1,
        "#0b0b0b"
    );


    return gradient;

}


/* =====================================================
   STAR
===================================================== */

function drawStar(
    x,
    y,
    color
){

    const outer =
    19;

    const inner =
    9;

    const spikes =
    5;

    let rotation =
    -Math.PI / 2;

    const step =
    Math.PI / spikes;


    ctx.save();

    ctx.beginPath();


    for(
        let i=0;
        i<spikes;
        i++
    ){

        ctx.lineTo(
            x +
            Math.cos(rotation) *
            outer,

            y +
            Math.sin(rotation) *
            outer
        );


        rotation +=
        step;


        ctx.lineTo(
            x +
            Math.cos(rotation) *
            inner,

            y +
            Math.sin(rotation) *
            inner
        );


        rotation +=
        step;

    }


    ctx.closePath();

    ctx.fillStyle =
    color;

    ctx.fill();

    ctx.restore();

}


/* =====================================================
   DRAW
===================================================== */

function draw(){

    /*
       تصویر نہ ہو تو editor message
    */

    if(!productImage){

        canvas.width =
        1000;

        canvas.height =
        560;


        ctx.fillStyle =
        "#dddddd";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        ctx.fillStyle =
        "#555";

        ctx.font =
        "25px Arial";

        ctx.textAlign =
        "center";

        ctx.fillText(
            "Product Image منتخب کریں",
            500,
            280
        );


        return;

    }


    /*
       ONE SINGLE PAGE

       دونوں حصے برابر۔
    */

    const pageWidth =
    1200;

    const pageHeight =
    675;


    canvas.width =
    pageWidth;

    canvas.height =
    pageHeight;


    const half =
    pageWidth / 2;


    /*
       سفید Page
    */

    ctx.fillStyle =
    "#ffffff";

    ctx.fillRect(
        0,
        0,
        pageWidth,
        pageHeight
    );


    /*
       IMAGE HALF
    */

    let imageX;


    if(
        layout ===
        "imageLeft"
    ){

        imageX =
        0;

    }
    else{

        imageX =
        half;

    }


    /*
       Image کو صرف اپنے
       آدھے حصے میں fit کریں۔
    */

    const scale =
    Math.min(
        half /
        productImage.naturalWidth,

        pageHeight /
        productImage.naturalHeight
    );


    const drawWidth =
    productImage.naturalWidth *
    scale;


    const drawHeight =
    productImage.naturalHeight *
    scale;


    const centeredX =
    imageX +
    (half - drawWidth)/2;


    const centeredY =
    (pageHeight -
    drawHeight)/2;


    /*
       Image Area
    */

    ctx.save();

    ctx.beginPath();

    ctx.rect(
        imageX,
        0,
        half,
        pageHeight
    );

    ctx.clip();


    ctx.drawImage(
        productImage,
        centeredX,
        centeredY,
        drawWidth,
        drawHeight
    );


    ctx.restore();


    /*
       INFORMATION HALF
    */

    let panelX;


    if(
        layout ===
        "imageLeft"
    ){

        panelX =
        half;

    }
    else{

        panelX =
        0;

    }


    ctx.fillStyle =
    panelBackground(
        panelX,
        half
    );


    ctx.fillRect(
        panelX,
        0,
        half,
        pageHeight
    );


    /*
       PANEL BORDER
    */

    ctx.strokeStyle =
    "#d4af37";

    ctx.lineWidth =
    6;


    ctx.strokeRect(
        panelX + 5,
        5,
        half - 10,
        pageHeight - 10
    );


    /*
       LOGO
    */

    if(logoImage){

        const maxWidth =
        125;

        const maxHeight =
        75;


        let lw =
        logoImage.naturalWidth;

        let lh =
        logoImage.naturalHeight;


        const logoScale =
        Math.min(
            maxWidth/lw,
            maxHeight/lh,
            1
        );


        lw *=
        logoScale;

        lh *=
        logoScale;


        ctx.drawImage(
            logoImage,

            panelX +
            (half-lw)/2,

            25,

            lw,
            lh
        );

    }


    /*
       TITLE
    */

    ctx.fillStyle =
    "#d4af37";

    ctx.font =
    "bold 25px Arial";

    ctx.textAlign =
    "center";


    ctx.fillText(
        "JANJUA TRADERS",

        panelX +
        half/2,

        135
    );


    ctx.fillStyle =
    "#ffffff";

    ctx.font =
    "15px Arial";


    ctx.fillText(
        "DIGITAL MARKETING",

        panelX +
        half/2,

        160
    );


    /*
       FEATURES
    */

    let y =
    220;


    for(
        let number=1;
        number<=8;
        number++
    ){

        const item =
        features[number];


        if(!item)
            continue;


        /*
           Star ہمیشہ Feature کے
           ساتھ خود آئے گا۔
        */

        const starX =
        panelX + 55;


        drawStar(
            starX,
            y - 8,
            item.starColor
        );


        /*
           FONT STYLE
        */

        let style =
        "";


        if(item.bold)
            style +=
            "bold ";


        if(item.italic)
            style +=
            "italic ";


        const font =
        style +
        item.size +
        "px Arial";


        ctx.font =
        font;


        ctx.fillStyle =
        item.textColor;


        ctx.textAlign =
        "left";


        /*
           Text
        */

        ctx.fillText(
            item.text,

            panelX + 90,

            y
        );


        /*
           Underline
        */

        if(
            item.underline
        ){

            const width =
            ctx.measureText(
                item.text
            ).width;


            ctx.strokeStyle =
            item.textColor;

            ctx.lineWidth =
            2;


            ctx.beginPath();


            ctx.moveTo(
                panelX + 90,
                y + 5
            );


            ctx.lineTo(
                panelX + 90 + width,
                y + 5
            );


            ctx.stroke();

        }


        /*
           اگلی Feature کی جگہ
        */

        y +=
        Math.max(
            58,
            item.size + 32
        );


        /*
           Panel سے باہر نہ جائے
        */

        if(
            y >
            pageHeight - 55
        ){

            break;

        }

    }


    /*
       FOOTER
    */

    ctx.fillStyle =
    "#d4af37";

    ctx.font =
    "bold 15px Arial";

    ctx.textAlign =
    "center";


    ctx.fillText(
        "QUALITY • VALUE • TRUST",

        panelX +
        half/2,

        pageHeight - 25
    );

}


/* =====================================================
   DOWNLOAD JPG
===================================================== */

function downloadJPG(){

    if(!productImage){

        alert(
            "پہلے Product Image منتخب کریں۔"
        );

        return;

    }


    const link =
    document.createElement("a");


    link.download =
    "janjua-traders-product.jpg";


    link.href =
    canvas.toDataURL(
        "image/jpeg",
        .95
    );


    link.click();

}


/* =====================================================
   DOWNLOAD PNG
===================================================== */

function downloadPNG(){

    if(!productImage){

        alert(
            "پہلے Product Image منتخب کریں۔"
        );

        return;

    }


    const link =
    document.createElement("a");


    link.download =
    "janjua-traders-product.png";


    link.href =
    canvas.toDataURL(
        "image/png"
    );


    link.click();

}


/* =====================================================
   START
===================================================== */

draw();

</script>

</body>

</html>
