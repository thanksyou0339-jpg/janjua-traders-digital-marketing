<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAPE JANJUA Digital Marketing Platform</title>

<style>
:root{
 --bg1:#030817;
 --bg2:#12335c;
 --sat:#32d7ff;
 --sat2:#ffffff;
 --offer:#e63232;
 --discount:#ffd52f;
 --gold:#ffd52f;
 --glow:#21cfff;
}

*{box-sizing:border-box}

html,body{
 margin:0;
 padding:0;
 width:100%;
 min-height:100%;
 background:#02050c;
 color:#fff;
 font-family:Arial,"Noto Naskh Arabic",sans-serif;
}

body{
 overflow-x:hidden;
}

header{
 text-align:center;
 padding:15px;
 background:
 linear-gradient(135deg,var(--bg1),var(--bg2));
 border-bottom:1px solid #2780ad;
}

.logo{
 font-size:clamp(30px,6vw,55px);
 font-weight:900;
 color:var(--gold);
 text-shadow:0 0 15px #000;
}

.subtitle{
 font-size:clamp(13px,2.8vw,22px);
 color:#e2f6ff;
}

.english{
 color:#45d9ff;
 font-weight:bold;
}

.container{
 width:min(1250px,96%);
 margin:auto;
 padding:12px 0 30px;
}

.topbar{
 display:flex;
 flex-wrap:wrap;
 gap:7px;
 margin-bottom:10px;
}

button{
 border:0;
 border-radius:9px;
 padding:10px 14px;
 background:#12548b;
 color:#fff;
 font-weight:bold;
 cursor:pointer;
}

button:hover{
 filter:brightness(1.2);
}

.blue{background:#087fc8}
.green{background:#128c61}
.red{background:#b82e3d}
.yellow{
 background:#9c7607;
 color:#fff;
}

.topbar button{
 min-width:115px;
}

.stage{
 background:#07182f;
 border:1px solid #286c96;
 border-radius:16px;
 padding:10px;
 box-shadow:0 15px 45px #0009;
}

.viewer{
 position:relative;
 width:100%;
 aspect-ratio:16/9;
 overflow:hidden;
 border:3px solid var(--glow);
 border-radius:15px;
 background:
 linear-gradient(135deg,var(--bg1),var(--bg2));
}

#backgroundCanvas{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 z-index:0;
}

#mainVideo{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 object-fit:cover;
 display:none;
 z-index:1;
}

.scene{
 position:absolute;
 inset:0;
 z-index:5;
 pointer-events:none;
}

.brand{
 position:absolute;
 top:3%;
 left:3%;
 font-size:clamp(14px,2.2vw,28px);
 font-weight:900;
 text-shadow:0 2px 8px #000;
}

.badge{
 position:absolute;
 right:3%;
 top:3%;
 padding:7px 12px;
 border:2px solid var(--gold);
 border-radius:9px;
 color:var(--gold);
 background:#031b32dd;
 font-weight:900;
}

/* =========================
   SATELLITE SYSTEM
========================= */

.solarSystem{
 position:absolute;
 left:50%;
 top:50%;
 width:44%;
 max-width:460px;
 aspect-ratio:1;
 transform:translate(-50%,-50%);
}

.orbit{
 position:absolute;
 inset:7%;
 border:2px solid var(--sat);
 border-radius:50%;
 opacity:.55;
 box-shadow:
 0 0 10px var(--sat),
 inset 0 0 10px var(--sat);
}

.orbit2{
 position:absolute;
 inset:17%;
 border:1px dashed var(--sat);
 border-radius:50%;
 opacity:.3;
}

.planet{
 position:absolute;
 left:50%;
 top:50%;
 width:31%;
 aspect-ratio:1;
 transform:translate(-50%,-50%);
 border-radius:50%;

 background:
 radial-gradient(
  circle at 30% 25%,
  #fff 0%,
  var(--sat2) 7%,
  var(--sat) 30%,
  #14608c 60%,
  #021326 100%
 );

 box-shadow:
 0 0 25px var(--sat),
 0 0 60px var(--sat);

 animation:
 planetSpin 8s linear infinite;
}

.planetRing{
 position:absolute;
 left:-25%;
 top:38%;
 width:150%;
 height:25%;
 border:4px solid #bff8ff99;
 border-radius:50%;
 transform:rotate(-18deg);
}

.satelliteOrbit{
 position:absolute;
 inset:0;
 animation:
 satelliteRevolution 10s linear infinite;
}

.satellite{
 position:absolute;
 left:50%;
 top:1%;
 width:13%;
 min-width:38px;
 max-width:70px;
 aspect-ratio:1.8;
 transform:translateX(-50%);
}

.satelliteBody{
 position:absolute;
 left:27%;
 top:25%;
 width:46%;
 height:48%;
 border-radius:35%;
 background:
 linear-gradient(
 135deg,
 #fff,
 var(--sat),
 #17709b
 );
 border:2px solid #fff;
 box-shadow:0 0 15px var(--sat);
}

.solarPanelLeft,
.solarPanelRight{
 position:absolute;
 top:24%;
 width:30%;
 height:50%;
 background:
 repeating-linear-gradient(
 90deg,
 var(--sat),
 var(--sat) 5px,
 #063c62 6px,
 #063c62 9px
 );
 border:1px solid #b9f5ff;
}

.solarPanelLeft{
 left:0;
}

.solarPanelRight{
 right:0;
}

.antenna{
 position:absolute;
 width:4px;
 height:35%;
 background:#fff;
 left:48%;
 top:-20%;
}

.antenna:after{
 content:"";
 position:absolute;
 width:11px;
 height:11px;
 border-radius:50%;
 background:var(--gold);
 left:-3px;
 top:-7px;
 box-shadow:0 0 10px var(--gold);
}

@keyframes satelliteRevolution{
 from{
  transform:rotate(0deg);
 }
 to{
  transform:rotate(360deg);
 }
}

@keyframes planetSpin{
 from{
  filter:hue-rotate(0deg);
 }
 to{
  filter:hue-rotate(360deg);
 }
}

/* =========================
   DISCOUNT / OFFERS
========================= */

.discount{
 position:absolute;
 right:3%;
 bottom:14%;
 color:var(--discount);
 font-size:clamp(13px,2.4vw,28px);
 font-weight:900;
 text-shadow:0 2px 8px #000;
 animation:
 discountMove 1.4s ease-in-out infinite alternate;
}

@keyframes discountMove{
 from{
  transform:translateX(0) scale(1);
 }
 to{
  transform:translateX(-8px) scale(1.07);
 }
}

.offers{
 position:absolute;
 left:3%;
 right:3%;
 bottom:3%;
 display:flex;
 justify-content:center;
 gap:7px;
 flex-wrap:wrap;
}

.offer{
 padding:7px 11px;
 border-radius:10px;
 background:
 linear-gradient(
 90deg,
 #7f1010,
 var(--offer)
 );

 font-size:clamp(11px,1.7vw,18px);
 font-weight:900;
 box-shadow:0 3px 12px #0008;

 animation:
 offerFloat 2s ease-in-out infinite alternate;
}

.offer:nth-child(2){
 animation-delay:.25s;
}

.offer:nth-child(3){
 animation-delay:.5s;
}

.offer:nth-child(4){
 animation-delay:.75s;
}

@keyframes offerFloat{
 from{
  transform:translateY(0);
 }
 to{
  transform:translateY(-7px) scale(1.04);
 }
}

/* =========================
   ADMIN
========================= */

.admin{
 margin-top:10px;
 background:#091d37;
 border:1px solid #28678f;
 border-radius:14px;
 padding:12px;
}

.hidden{
 display:none!important;
}

.row{
 display:flex;
 gap:8px;
 margin-bottom:5px;
}

.row>*{
 flex:1;
}

label{
 display:block;
 margin-top:7px;
 color:#b7d8eb;
 font-size:12px;
}

input[type=text],
select{
 width:100%;
 padding:8px;
 background:#06162b;
 border:1px solid #3a7095;
 border-radius:7px;
 color:#fff;
}

input[type=color]{
 width:100%;
 height:38px;
 background:#06162b;
 border:1px solid #3a7095;
 border-radius:7px;
}

.note{
 color:#a9cce1;
 font-size:12px;
 margin-top:8px;
}

/* =========================
   FULLSCREEN
========================= */

.fullscreenMode .viewer{
 position:fixed;
 inset:0;
 width:100vw;
 height:100vh;
 aspect-ratio:auto;
 z-index:5000;
 border:0;
 border-radius:0;
}

.fullscreenMode .topbar{
 display:none;
}

.fullscreenMode .admin{
 display:none!important;
}

/* =========================
   CAPTURE
========================= */

.capture{
 position:fixed;
 inset:0;
 z-index:10000;
 display:none;
 background:#000;
}

.capture.show{
 display:block;
}

#captureVideo{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 object-fit:contain;
 background:#000;
}

.selectBox{
 position:absolute;
 display:none;
 border:3px dashed var(--gold);
 background:#ffd52f22;
 pointer-events:none;
}

.captureButtons{
 position:absolute;
 left:10px;
 right:10px;
 top:10px;
 z-index:4;
 display:flex;
 justify-content:center;
 flex-wrap:wrap;
 gap:7px;
}

.captureButtons button{
 width:auto;
 min-width:120px;
}

.recordingIndicator{
 position:absolute;
 left:12px;
 bottom:12px;
 display:none;
 z-index:5;
 padding:8px 12px;
 background:#b4142a;
 border-radius:8px;
 font-weight:bold;
}

.recordingIndicator.show{
 display:block;
 animation:recordBlink 1s infinite alternate;
}

@keyframes recordBlink{
 to{
  opacity:.45;
 }
}

@media(max-width:700px){

 .row{
  flex-direction:column;
 }

 .topbar button{
  flex:1;
 }

 .solarSystem{
  width:52%;
 }

}
</style>
</head>

<script>

/* ==========================================
   VARIABLES
========================================== */

const $ = id => document.getElementById(id);

let videoURL = null;

let imageURL = null;

let screenStream = null;

let recorder = null;

let chunks = [];

let crop = {
 x:0,
 y:0,
 w:1,
 h:1
};

let selecting = false;

let startX = 0;

let startY = 0;


/* ==========================================
   VIDEO
========================================== */

$("videoButton").onclick =
() => $("videoInput").click();


$("videoInput").onchange =
function(event){

 const file =
 event.target.files[0];

 if(!file) return;

 if(videoURL)
 URL.revokeObjectURL(videoURL);

 videoURL =
 URL.createObjectURL(file);

 $("mainVideo").src =
 videoURL;

 $("mainVideo").style.display =
 "block";

 $("mainVideo").play().catch(()=>{});

 $("status").textContent =
 "Video loaded.";

};


/* ==========================================
   IMAGE
========================================== */

$("imageButton").onclick =
() => $("imageInput").click();


$("imageInput").onchange =
function(event){

 const file =
 event.target.files[0];

 if(!file) return;

 if(imageURL)
 URL.revokeObjectURL(imageURL);

 imageURL =
 URL.createObjectURL(file);

 /*
   Uploaded picture becomes the
   center planet/product.
 */

 const planet =
 document.querySelector(".planet");

 planet.style.background =
 `url("${imageURL}") center/contain no-repeat`;

 planet.style.boxShadow =
 "none";

 planet.style.borderRadius =
 "0";

};


/* ==========================================
   PLAY / PAUSE
========================================== */

$("playButton").onclick =
() => $("mainVideo").play();


$("pauseButton").onclick =
() => $("mainVideo").pause();


/* ==========================================
   FULLSCREEN
========================================== */

$("fullscreenButton").onclick =
async function(){

 const app =
 $("app");

 if(!document.fullscreenElement){

  try{
   await document.documentElement.requestFullscreen();
  }catch(e){}

  app.classList.add(
   "fullscreenMode"
  );

 }else{

  try{
   await document.exitFullscreen();
  }catch(e){}

  app.classList.remove(
   "fullscreenMode"
  );

 }

};


document.addEventListener(
"fullscreenchange",
function(){

 $("app").classList.toggle(
  "fullscreenMode",
  !!document.fullscreenElement
 );

});


/* ==========================================
   ADMIN
========================================== */

$("adminButton").onclick =
function(){

 $("admin").classList.toggle(
  "hidden"
 );

};


function applyAdmin(){

 document.documentElement
 .style.setProperty(
  "--bg1",
  $("bg1").value
 );

 document.documentElement
 .style.setProperty(
  "--bg2",
  $("bg2").value
 );

 document.documentElement
 .style.setProperty(
  "--sat",
  $("satColor").value
 );

 document.documentElement
 .style.setProperty(
  "--sat2",
  $("satHighlight").value
 );

 document.documentElement
 .style.setProperty(
  "--offer",
  $("offerColor").value
 );

 document.documentElement
 .style.setProperty(
  "--discount",
  $("discountColor").value
 );


 $("title").textContent =
 $("adminTitle").value;


 $("subtitle").innerHTML =
 $("adminSubtitle").value +
 ' • <span class="english">DIGITAL MARKETING PLATFORM</span>';


 $("watermark").textContent =
 $("adminTitle").value;


 $("offer1").textContent =
 $("adminOffer1").value;


 $("offer2").textContent =
 $("adminOffer2").value;


 $("offer3").textContent =
 $("adminOffer3").value;


 $("offer4").textContent =
 $("adminOffer4").value;


 $("badge").textContent =
 $("adminBadge").value;


 $("discount").textContent =
 $("adminDiscount").value;


 document.querySelector(
 ".satelliteOrbit"
 ).style.animationDuration =
 $("satelliteSpeed").value +
 "s";

}


/* ==========================================
   SAVE ADMIN
========================================== */

$("saveAdmin").onclick =
function(){

 applyAdmin();

 const data = {

  title:$("adminTitle").value,

  subtitle:$("adminSubtitle").value,

  offer1:$("adminOffer1").value,

  offer2:$("adminOffer2").value,

  offer3:$("adminOffer3").value,

  offer4:$("adminOffer4").value,

  badge:$("adminBadge").value,

  discount:$("adminDiscount").value,

  bg1:$("bg1").value,

  bg2:$("bg2").value,

  sat:$("satColor").value,

  sat2:$("satHighlight").value,

  offerColor:$("offerColor").value,

  discountColor:$("discountColor").value,

  speed:$("satelliteSpeed").value,

  background:$("backgroundType").value

 };


 localStorage.setItem(
  "TAPE_JANJUA_SETTINGS",
  JSON.stringify(data)
 );


 $("status").textContent =
 "Admin Settings محفوظ ہوگئیں۔";

};


/* ==========================================
   LOAD SETTINGS
========================================== */

function loadSettings(){

 try{

  const data =
  JSON.parse(
   localStorage.getItem(
    "TAPE_JANJUA_SETTINGS"
   )
  );

  if(!data)
  return;


  $("adminTitle").value =
  data.title;

  $("adminSubtitle").value =
  data.subtitle;

  $("adminOffer1").value =
  data.offer1;

  $("adminOffer2").value =
  data.offer2;

  $("adminOffer3").value =
  data.offer3;

  $("adminOffer4").value =
  data.offer4;

  $("adminBadge").value =
  data.badge;

  $("adminDiscount").value =
  data.discount;

  $("bg1").value =
  data.bg1;

  $("bg2").value =
  data.bg2;

  $("satColor").value =
  data.sat;

  $("satHighlight").value =
  data.sat2;

  $("offerColor").value =
  data.offerColor;

  $("discountColor").value =
  data.discountColor;

  $("satelliteSpeed").value =
  data.speed;

  $("backgroundType").value =
  data.background;

  applyAdmin();

 }catch(e){}

}


$("resetAdmin").onclick =
function(){

 localStorage.removeItem(
  "TAPE_JANJUA_SETTINGS"
 );

 location.reload();

};


loadSettings();


/* ==========================================
   BACKGROUND TECHNOLOGY
========================================== */

const bgCanvas =
$("backgroundCanvas");

const bg =
bgCanvas.getContext("2d");

let time = 0;


function resizeCanvas(){

 const r =
 $("viewer").getBoundingClientRect();

 bgCanvas.width =
 r.width;

 bgCanvas.height =
 r.height;

}


window.addEventListener(
"resize",
resizeCanvas
);

resizeCanvas();


function drawBackground(){

 bg.clearRect(
  0,
  0,
  bgCanvas.width,
  bgCanvas.height
 );


 const type =
 $("backgroundType").value;


 const color =
 $("satColor").value;


 /* SPACE */

 if(type === "space"){

  for(
   let i=0;
   i<120;
   i++
  ){

   const x =
   (i*83 + time*.15)
   % bgCanvas.width;

   const y =
   (i*47)
   % bgCanvas.height;

   bg.fillStyle =
   "rgba(255,255,255,.7)";

   bg.fillRect(
    x,
    y,
    1.5,
    1.5
   );

  }

 }


 /* DIGITAL GRID */

 if(type === "grid"){

  bg.strokeStyle =
  color + "55";

  bg.lineWidth = 1;


  for(
   let x=0;
   x<bgCanvas.width;
   x+=35
  ){

   bg.beginPath();

   bg.moveTo(x,0);

   bg.lineTo(
    x,
    bgCanvas.height
   );

   bg.stroke();

  }


  for(
   let y=0;
   y<bgCanvas.height;
   y+=35
  ){

   bg.beginPath();

   bg.moveTo(0,y);

   bg.lineTo(
    bgCanvas.width,
    y
   );

   bg.stroke();

  }

 }


 /* CIRCUIT */

 if(type === "circuit"){

  bg.strokeStyle =
  color + "66";

  bg.lineWidth = 2;


  for(
   let i=0;
   i<18;
   i++
  ){

   const y =
   (i*53 + time*.3)
   % bgCanvas.height;


   bg.beginPath();

   bg.moveTo(
    0,
    y
   );

   bg.lineTo(
    bgCanvas.width*.22,
    y
   );

   bg.lineTo(
    bgCanvas.width*.35,
    y-30
   );

   bg.lineTo(
    bgCanvas.width,
    y-30
   );

   bg.stroke();

  }

 }


 /* MATRIX */

 if(type === "matrix"){

  bg.font =
  "13px monospace";

  bg.fillStyle =
  color + "88";


  for(
   let i=0;
   i<90;
   i++
  ){

   const x =
   (i*31)
   % bgCanvas.width;

   const y =
   (i*51 + time*2)
   % bgCanvas.height;

   bg.fillText(
    String(
     Math.floor(
      Math.random()*10
     )
    ),
    x,
    y
   );

  }

 }


 /* TECH WAVES */

 if(type === "waves"){

  bg.strokeStyle =
  color + "77";

  bg.lineWidth = 2;


  for(
   let n=0;
   n<8;
   n++
  ){

   bg.beginPath();


   for(
    let x=0;
    x<bgCanvas.width;
    x+=10
   ){

    const y =
    bgCanvas.height/2 +
    n*25 +
    Math.sin(
     x*.018 +
     time*.025 +
     n
    )*20;


    if(x===0)
    bg.moveTo(x,y);
    else
    bg.lineTo(x,y);

   }


   bg.stroke();

  }

 }


 time++;

 requestAnimationFrame(
  drawBackground
 );

}


drawBackground();


/* ==========================================
   DOWNLOAD PNG
========================================== */

$("downloadButton").onclick =
function(){

 const canvas =
 document.createElement(
  "canvas"
 );

 const W = 1280;
 const H = 720;

 canvas.width = W;
 canvas.height = H;

 const ctx =
 canvas.getContext("2d");


 const gradient =
 ctx.createLinearGradient(
  0,
  0,
  W,
  H
 );

 gradient.addColorStop(
  0,
  $("bg1").value
 );

 gradient.addColorStop(
  1,
  $("bg2").value
 );

 ctx.fillStyle =
 gradient;

 ctx.fillRect(
  0,
  0,
  W,
  H
 );


 if(
  $("mainVideo").readyState >= 2 &&
  $("mainVideo").style.display !== "none"
 ){

  try{

   ctx.drawImage(
    $("mainVideo"),
    0,
    0,
    W,
    H
   );

  }catch(e){}

 }


 ctx.fillStyle =
 $("satColor").value;

 ctx.globalAlpha =
 .25;


 for(
  let i=0;
  i<25;
  i++
 ){

  const y =
  i*30;

  ctx.fillRect(
   0,
   y,
   W,
   1
  );

 }


 ctx.globalAlpha =
 1;


 ctx.fillStyle =
 "#fff";

 ctx.font =
 "bold 35px Arial";

 ctx.fillText(
  $("watermark").textContent,
  40,
  55
 );


 ctx.fillStyle =
 $("discountColor").value;

 ctx.font =
 "bold 30px Arial";

 ctx.fillText(
  $("discount").textContent,
  W-500,
  55
 );


 ctx.fillStyle =
 "#fff";

 ctx.font =
 "bold 23px Arial";


 ctx.fillText(
  [
   $("offer1").textContent,
   $("offer2").textContent,
   $("offer3").textContent,
   $("offer4").textContent
  ].join(" | "),

 canvas.toBlob(

   document.createElement(
    "a"
   );

   a.href =
   url;

   a.download =

   setTimeout(
    () =>
    URL.revokeObjectURL(url),
    3000
   );

  },
  "image/png"
 );

};


/* ==========================================
   CAPTURE
========================================== */

$("captureButton").onclick =
async function(){

 try{

  screenStream =
  await navigator.mediaDevices
  .getDisplayMedia({
   video:true,
   audio:false
  });


  $("captureVideo").srcObject =
  screenStream;


  $("capture").classList.add(
   "show"
  );


  resetArea();


  screenStream
  .getVideoTracks()[0]
  .addEventListener(
   "ended",
   closeCapture
  );


 }catch(e){

  $("status").textContent =
  "Capture cancel ہوگیا۔";

 }

};


/* ==========================================
   AREA SELECTION
========================================== */

function getPointer(e){

 const rect =
 $("captureVideo")
 .getBoundingClientRect();


 const p =
 e.touches ?
 e.touches[0] :
 e;


 return {

  x:Math.max(
   0,
   Math.min(
    rect.width,
    p.clientX -
    rect.left
   )
  ),

  y:Math.max(
   0,
   Math.min(
    rect.height,
    p.clientY -
    rect.top
   )
  ),

  width:rect.width,

  height:rect.height

 };

}


function startArea(e){

 e.preventDefault();

 selecting = true;

 const p =
 getPointer(e);

 startX =
 p.x;

 startY =
 p.y;


 $("selectBox").style.display =
 "block";

 $("selectBox").style.left =
 startX + "px";

 $("selectBox").style.top =
 startY + "px";

 $("selectBox").style.width =
 "0px";

 $("selectBox").style.height =
 "0px";

}


function moveArea(e){

 if(!selecting)
 return;

 e.preventDefault();

 const p =
 getPointer(e);


 const x =
 Math.min(
  startX,
  p.x
 );

 const y =
 Math.min(
  startY,
  p.y
 );

 const w =
 Math.abs(
  p.x -
  startX
 );

 const h =
 Math.abs(
  p.y -
  startY
 );


 $("selectBox").style.left =
 x + "px";

 $("selectBox").style.top =
 y + "px";

 $("selectBox").style.width =
 w + "px";

 $("selectBox").style.height =
 h + "px";


 const rect =
 $("captureVideo")
 .getBoundingClientRect();


 crop = {

  x:x/rect.width,

  y:y/rect.height,

  w:w/rect.width,

  h:h/rect.height

 };

}


function endArea(){

 selecting = false;

}


$("captureVideo")
.addEventListener(
 "mousedown",
 startArea
);

$("captureVideo")
.addEventListener(
 "mousemove",
 moveArea
);

window.addEventListener(
 "mouseup",
 endArea
);


$("captureVideo")
.addEventListener(
 "touchstart",
 startArea,
 {passive:false}
);

$("captureVideo")
.addEventListener(
 "touchmove",
 moveArea,
 {passive:false}
);

$("captureVideo")
.addEventListener(
 "touchend",
 endArea
);


function resetArea(){

 crop = {
  x:0,
  y:0,
  w:1,
  h:1
 };

 $("selectBox").style.display =
 "none";

}


$("selectAgain").onclick =
resetArea;


/* ==========================================
   MIME
========================================== */

function bestMime(){

 const types = [

  "video/mp4;codecs=avc1.42E01E",

  "video/mp4",

  "video/webm;codecs=vp9",

  "video/webm"

 ];


 for(
  const type of types
 ){

  if(
   window.MediaRecorder &&
   MediaRecorder.isTypeSupported(
    type
   )
  ){

   return type;

  }

 }


 return "";

}


/* ==========================================
   START RECORDING
========================================== */

$("startRecording").onclick =
async function(){

 if(!screenStream){

  alert(
   "پہلے Capture Video کھولیں۔"
  );

  return;

 }


 if(
  crop.w < .02 ||
  crop.h < .02
 ){

  alert(
   "پہلے video کا مطلوبہ area select کریں۔"
  );

  return;

 }


 const video =
 $("captureVideo");


 await new Promise(
  resolve => {

   if(
    video.readyState >= 2
   ){

    resolve();

   }else{

    video.onloadeddata =
    resolve;

   }

  }
 );


 const track =
 screenStream
 .getVideoTracks()[0];


 const settings =
 track.getSettings();


 const sourceW =
 settings.width ||
 video.videoWidth ||
 1920;


 const sourceH =
 settings.height ||
 video.videoHeight ||
 1080;


 const canvas =
 document.createElement(
  "canvas"
 );


 const outputW =
 Math.max(
  2,
  Math.round(
   sourceW *
   crop.w
  )
 );


 const outputH =
 Math.max(
  2,
  Math.round(
   sourceH *
   crop.h
  )
 );


 canvas.width =
 outputW;

 canvas.height =
 outputH;


 const context =
 canvas.getContext(
  "2d"
 );


 const recordingStream =
 canvas.captureStream(
  30
 );


 const mime =
 bestMime();


 if(!mime){

  alert(
   "یہ browser recording support نہیں کرتا۔ Chrome یا Edge استعمال کریں۔"
  );

  return;

 }


 chunks = [];


 recorder =
 new MediaRecorder(
  recordingStream,
  {
   mimeType:mime
  }
 );


 recorder.ondataavailable =
 function(event){

  if(
   event.data.size
  ){

   chunks.push(
    event.data
   );

  }

 };


 recorder.onstop =
 function(){

  const extension =
  mime.startsWith(
   "video/mp4"
  )
  ?
  "mp4"
  :
  "webm";


  const blob =
  new Blob(
   chunks,
   {
    type:mime
   }
  );


  const url =
  URL.createObjectURL(
   blob
  );


  const a =
  document.createElement(
   "a"
  );


  a.href =
  url;

  a.download =
  "TAPE-JANJUA-VIDEO." +
  extension;

  a.click();


  setTimeout(
   () =>
   URL.revokeObjectURL(url),
   5000
  );


  $("recordingIndicator")
  .classList.remove(
   "show"
  );


  $("status").textContent =
  "Recording " +
  extension.toUpperCase() +
  " میں محفوظ ہوگئی۔";

 };


 recorder.start();


 $("recordingIndicator")
 .classList.add(
  "show"
 );


 $("status").textContent =
 "صرف منتخب شدہ area record ہو رہا ہے۔";


 function draw(){

  if(
   !recorder ||
   recorder.state !==
   "recording"
  ){

   return;

  }


  try{

   context.drawImage(

    video,

    sourceW *
    crop.x,

    sourceH *
    crop.y,

    sourceW *
    crop.w,

    sourceH *
    crop.h,

    0,
    0,
    outputW,
    outputH

   );

  }catch(e){}


  requestAnimationFrame(
   draw
  );

 }


 draw();

};


/* ==========================================
   STOP
========================================== */

function stopRecording(){

 if(
  recorder &&
  recorder.state ===
  "recording"
 ){

  recorder.stop();

 }

}


$("stopButton").onclick =
stopRecording;


$("stopCaptureRecording").onclick =
stopRecording;


/* ==========================================
   CLOSE CAPTURE
========================================== */

function closeCapture(){

 if(
  recorder &&
  recorder.state ===
  "recording"
 ){

  recorder.stop();

 }


 if(screenStream){

  screenStream
  .getTracks()
  .forEach(
   track =>
   track.stop()
  );

 }


 screenStream = null;


 $("capture")
 .classList.remove(
  "show"
 );


 $("captureVideo")
 .srcObject =
 null;


 $("recordingIndicator")
 .classList.remove(
  "show"
 );


}


$("closeCapture").onclick =
closeCapture;

</script>
