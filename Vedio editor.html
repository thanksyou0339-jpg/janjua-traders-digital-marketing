<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>JANJUA Digital Marketing Platform</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:
Arial,
"Noto Naskh Arabic",
"Noto Nastaliq Urdu",
sans-serif;
}

body{
display:flex;
align-items:center;
justify-content:center;
}

#app{
position:relative;
width:100vw;
height:100vh;
overflow:hidden;

background:
radial-gradient(
circle at 50% 45%,
#174d7d 0%,
#0b315b 32%,
#041b36 68%,
#010914 100%
);

color:white;
}

/* =====================================================
BACKGROUND CANVAS
===================================================== */

#canvas{
position:absolute;
inset:0;
width:100%;
height:100%;
z-index:1;
}

/* =====================================================
GLOW
===================================================== */

.glow{
position:absolute;
border-radius:50%;
filter:blur(55px);
opacity:.25;
pointer-events:none;
z-index:2;
}

.glow1{
width:45vw;
height:45vw;
left:-15vw;
top:-15vw;
background:#009dff;
animation:glowOne 9s ease-in-out infinite alternate;
}

.glow2{
width:40vw;
height:40vw;
right:-15vw;
bottom:-15vw;
background:#713cff;
animation:glowTwo 11s ease-in-out infinite alternate;
}

@keyframes glowOne{
to{
transform:translate(15vw,10vh);
}
}

@keyframes glowTwo{
to{
transform:translate(-12vw,-9vh);
}
}

/* =====================================================
TOP BRAND
===================================================== */

.top{
position:absolute;
top:3%;
left:4%;
right:4%;
z-index:30;

display:flex;
justify-content:space-between;
align-items:center;
}

.brand h1{
color:#ffd84a;

font-size:
clamp(30px,6vw,70px);

font-weight:1000;

letter-spacing:2px;

text-shadow:
0 3px 12px #000,
0 0 20px #ffd84a44;

animation:
brandBubble 2.8s ease-in-out infinite alternate;
}

.brand p{
color:#e3fbff;

font-size:
clamp(12px,2vw,22px);

font-weight:900;

animation:
brandRun 4s ease-in-out infinite;
}

@keyframes brandBubble{

0%{
transform:scale(.96);
}

100%{
transform:scale(1.06);
text-shadow:
0 0 25px #ffd84a99;
}

}

@keyframes brandRun{

0%,100%{
opacity:.7;
letter-spacing:0;
}

50%{
opacity:1;
letter-spacing:2px;
}

}

.topBadge{

padding:9px 14px;

border-radius:12px;

border:1px solid #ffd84a;

background:#03182ddd;

color:#ffd84a;

font-weight:900;

animation:
badgePulse 1.7s ease-in-out infinite alternate;
}

@keyframes badgePulse{

to{
transform:scale(1.07);

box-shadow:
0 0 25px #ffd84a66;
}

}

/* =====================================================
MAIN LOGO
===================================================== */

.logoArea{

position:absolute;

left:50%;
top:47%;

width:min(58vw,520px);
height:min(58vw,520px);

transform:translate(-50%,-50%);

z-index:12;

display:flex;

align-items:center;

justify-content:center;
}

/* Orbit */

.orbit{

position:absolute;

inset:1%;

border:
2px solid #43e6ff88;

border-radius:50%;

transform:
rotateX(66deg)
rotateZ(-15deg);

box-shadow:
0 0 22px #43e6ff55;
}

.orbit2{

position:absolute;

inset:9%;

border:
1px solid #ffd84a77;

border-radius:50%;

transform:
rotateX(66deg)
rotateZ(25deg);
}

/* Logo */

#logo{

width:74%;
height:74%;

object-fit:contain;

border-radius:50%;

filter:
drop-shadow(0 0 18px #000)
drop-shadow(0 0 20px #ffd84a55);

animation:
logoAnimation 5s ease-in-out infinite alternate;
}

@keyframes logoAnimation{

from{
transform:
scale(1)
rotate(-1deg);
}

to{
transform:
scale(1.07)
rotate(2deg);
}

}

/* =====================================================
SATELLITE
===================================================== */

.satelliteOrbit{

position:absolute;

inset:-3%;

animation:
satelliteRotation 9s linear infinite;
}

@keyframes satelliteRotation{

to{
transform:rotate(360deg);
}

}

.satellite{

position:absolute;

top:-5px;
left:50%;

transform:translateX(-50%);

width:72px;
height:45px;
}

.satelliteBody{

position:absolute;

left:22px;
top:10px;

width:29px;
height:21px;

border-radius:6px;

border:1px solid white;

background:
linear-gradient(
135deg,
white,
#44e6ff,
#145a81
);

box-shadow:
0 0 16px #44e6ff;
}

.satellitePanel{

position:absolute;

top:5px;

width:20px;
height:28px;

border:1px solid #baf7ff;

background:
repeating-linear-gradient(
90deg,
#44e6ff 0 4px,
#073e62 4px 7px
);
}

.panelLeft{
left:0;
}

.panelRight{
right:0;
}

.satelliteAntenna{

position:absolute;

left:34px;
top:-8px;

width:2px;
height:15px;

background:white;
}

.satelliteAntenna:after{

content:"";

position:absolute;

left:-3px;
top:-4px;

width:8px;
height:8px;

border-radius:50%;

background:#ffd84a;

box-shadow:
0 0 12px #ffd84a;
}

/* =====================================================
SALE
===================================================== */

.saleBox{

position:absolute;

right:3%;
top:16%;

z-index:35;

padding:
9px 14px;

border-radius:15px;

background:
linear-gradient(
135deg,
#ffe36b,
#ff9e00
);

color:#071421;

font-weight:1000;

box-shadow:
0 8px 25px #0008;

animation:
saleAnimation 1.7s ease-in-out infinite alternate;
}

.saleBox small{

display:block;

font-size:11px;
}

.saleBox strong{

font-size:
clamp(18px,3vw,34px);
}

@keyframes saleAnimation{

to{
transform:
translateY(-5px)
scale(1.05);
}

}

/* =====================================================
MOVING BACKGROUND OBJECTS
===================================================== */

.decor{

position:absolute;

inset:0;

z-index:6;

pointer-events:none;

overflow:hidden;
}

/* Birds */

.bird{

position:absolute;

left:-10%;

font-size:30px;

animation:
birdMove 9s linear infinite;
}

.bird1{
top:17%;
}

.bird2{
top:28%;
animation-delay:3s;
font-size:22px;
}

.bird3{
top:11%;
animation-delay:5s;
font-size:19px;
}

@keyframes birdMove{

0%{
transform:translateX(0);
}

50%{
transform:
translateX(55vw)
translateY(-5vh);
}

100%{
transform:
translateX(120vw)
translateY(2vh);
}

}

/* Cars */

.car{

position:absolute;

left:-12%;

bottom:19%;

font-size:42px;

animation:
carMove 8s linear infinite;
}

.car2{

bottom:14%;

font-size:30px;

animation-delay:4s;
}

@keyframes carMove{

to{
transform:
translateX(125vw);
}

}

/* Train */

.train{

position:absolute;

left:-30%;

bottom:7%;

font-size:55px;

animation:
trainMove 12s linear infinite;
}

@keyframes trainMove{

to{
transform:
translateX(150vw);
}

}

/* Animals */

.animal{

position:absolute;

left:-12%;

bottom:22%;

font-size:45px;

animation:
animalMove 10s linear infinite;
}

.animal2{

animation-delay:5s;

font-size:34px;
}

@keyframes animalMove{

0%{
transform:translateX(0);
}

45%{
transform:translateX(55vw);
}

50%{
transform:
translateX(60vw)
scaleX(-1);
}

100%{
transform:
translateX(120vw)
scaleX(-1);
}

}

/* =====================================================
RAIN
===================================================== */

.rain{

position:absolute;

inset:0;

opacity:.35;

overflow:hidden;
}

.raindrop{

position:absolute;

top:-10%;

width:2px;

height:28px;

background:
linear-gradient(
transparent,
#8eeeff
);

animation:
rainFall 1s linear infinite;
}

@keyframes rainFall{

to{

transform:
translateY(125vh)
translateX(-12vw);

}

}

/* =====================================================
BOTTOM CLICKABLE TEXT
===================================================== */

.bottomButtons{

position:absolute;

left:2%;
right:2%;

bottom:3%;

z-index:40;

display:flex;

justify-content:center;

gap:8px;

flex-wrap:wrap;
}

.textButton{

min-width:110px;

padding:
9px 11px;

border-radius:14px;

background:#04192eea;

border:
1px solid #43e6ff66;

box-shadow:
0 8px 20px #0008;

text-align:center;

cursor:pointer;

animation:
buttonFloat 2.3s ease-in-out infinite alternate;

transition:.2s;
}

.textButton:hover{

transform:
translateY(-8px)
scale(1.04);

border-color:#ffd84a;
}

.textButton b{

display:block;

font-size:
clamp(12px,1.8vw,19px);
}

.textButton span{

display:block;

font-size:9px;

color:#b8edff;

margin-top:2px;
}

@keyframes buttonFloat{

to{
transform:translateY(-6px);
}

}

/* =====================================================
POPUP
===================================================== */

#popup{

position:absolute;

left:50%;

bottom:16%;

transform:
translateX(-50%)
translateY(20px);

z-index:70;

width:
min(90vw,650px);

padding:
17px 20px;

border-radius:18px;

background:#031427f2;

border:
1px solid #ffd84a99;

box-shadow:
0 12px 45px #000a;

text-align:center;

opacity:0;

pointer-events:none;

transition:.3s;
}

#popup.active{

opacity:1;

transform:
translateX(-50%)
translateY(0);
}

#popup h2{

color:#ffd84a;

margin-bottom:7px;
}

#popup p{

font-size:16px;

line-height:1.8;
}

/* =====================================================
EDITOR
===================================================== */

#editorButton{

position:absolute;

left:12px;

top:12px;

z-index:100;

border:0;

border-radius:10px;

padding:9px 12px;

background:#06182be8;

color:white;

opacity:.35;

cursor:pointer;
}

#editorButton:hover{
opacity:1;
}

#editor{

position:absolute;

left:12px;

top:58px;

width:min(330px,90vw);

max-height:82vh;

overflow:auto;

z-index:110;

display:none;

background:#031427f7;

border:
1px solid #43e6ff66;

border-radius:15px;

padding:14px;

direction:rtl;
}

#editor.open{
display:block;
}

#editor h3{

color:#ffd84a;

margin-bottom:8px;
}

.field{

margin:
7px 0;
}

.field label{

display:block;

font-size:12px;

margin-bottom:4px;
}

.field input,
.field select{

width:100%;

padding:8px;

border-radius:7px;

border:1px solid #315777;

background:#071c33;

color:white;
}

.editorButton{

width:100%;

border:0;

border-radius:8px;

padding:9px;

margin-top:6px;

background:#08789e;

color:white;

font-weight:bold;
}

/* =====================================================
MUSIC
===================================================== */

.musicControls{

display:flex;

gap:5px;
}

.musicControls button{

flex:1;

border:0;

border-radius:7px;

padding:7px;

background:#0a3154;

color:white;
}

/* =====================================================
FULLSCREEN
===================================================== */

#fullscreen{

position:absolute;

right:12px;

top:12px;

z-index:100;

border:0;

border-radius:10px;

padding:9px 12px;

background:#06182be8;

color:white;

opacity:.35;

cursor:pointer;
}

#fullscreen:hover{
opacity:1;
}

/* =====================================================
MOBILE
===================================================== */

@media(max-width:700px){

.brand h1{
font-size:36px;
}

.brand p{
display:none;
}

.logoArea{

width:82vw;
height:82vw;

top:47%;
}

.saleBox{

top:17%;

right:2%;
}

.sideText{
display:none;
}

.textButton{

min-width:88px;

padding:7px;
}

.textButton b{
font-size:11px;
}

.textButton span{
font-size:8px;
}

}

</style>
</head>

<body>

POPUP TEXT

ADMIN EDITOR

<script>

/* =====================================================
FULL SCREEN
===================================================== */

const app =
document.getElementById("app");

document
.getElementById("fullscreen")
.onclick = async ()=>{

try{

if(!document.fullscreenElement){

await app.requestFullscreen();

}else{

await document.exitFullscreen();

}

}catch(e){

console.log(e);

}

};


/* =====================================================
CLICKABLE TEXT POPUPS
===================================================== */

const popup =
document.getElementById("popup");

document
.querySelectorAll(".textButton")
.forEach(button=>{

button.onclick=()=>{

popup
.querySelector("h2")
.textContent=
button.dataset.title;

popup
.querySelector("p")
.textContent=
button.dataset.text;

popup.classList.add("active");

clearTimeout(window.popupTimer);

window.popupTimer=setTimeout(()=>{

popup.classList.remove("active");

},4500);

};

});


/* =====================================================
ADMIN PANEL
===================================================== */

const editor =
document.getElementById("editor");

document
.getElementById("editorButton")
.onclick=()=>{

editor.classList.toggle("open");

};

document
.getElementById("closeEditor")
.onclick=()=>{

editor.classList.remove("open");

};


/* =====================================================
TEXT EDIT
===================================================== */

document
.getElementById("editName")
.oninput=e=>{

document
.getElementById("brandName")
.textContent=e.target.value;

};


document
.getElementById("editSubtitle")
.oninput=e=>{

document
.getElementById("brandSubtitle")
.textContent=e.target.value;

};


document
.getElementById("editBadge")
.oninput=e=>{

document
.getElementById("badge")
.textContent=e.target.value;

};


document
.getElementById("editSale")
.oninput=e=>{

document
.getElementById("saleText")
.textContent=e.target.value;

};


/* =====================================================
COLOR
===================================================== */

document
.getElementById("editColor")
.oninput=e=>{

document
.documentElement
.style
.setProperty(
"--accent",
e.target.value
);

};


/* =====================================================
BACKGROUND STYLES
===================================================== */

document
.getElementById("backgroundStyle")
.onchange=e=>{

const style=e.target.value;

const app=document.getElementById("app");

if(style==="blue"){

app.style.background=
"radial-gradient(circle at 50% 45%,#174d7d,#0b315b,#041b36,#010914)";

}

if(style==="dark"){

app.style.background=
"radial-gradient(circle at 50% 45%,#202b38,#101722,#030609,#000)";

}

if(style==="purple"){

app.style.background=
"radial-gradient(circle at 50% 45%,#533b91,#24164c,#0a061c,#000)";

}

if(style==="green"){

app.style.background=
"radial-gradient(circle at 50% 45%,#17634c,#08372b,#021811,#000)";

}

if(style==="gold"){

app.style.background=
"radial-gradient(circle at 50% 45%,#735a22,#392b0c,#100b02,#000)";

}

};


/* =====================================================
BACKGROUND ANIMATION
===================================================== */

const canvas=
document.getElementById("canvas");

const ctx=
canvas.getContext("2d");

let W;
let H;

let clock=0;

let animationMode="auto";


function resize(){

W=
canvas.width=
window.innerWidth;

H=
canvas.height=
window.innerHeight;

}

window.addEventListener(
"resize",
resize
);

resize();


/* particles */

const particles=[];

for(let i=0;i<120;i++){

particles.push({

x:Math.random(),

y:Math.random(),

size:
Math.random()*2+0.5,

speed:
Math.random()+.2

});

}


/* modes */

const modes=[

"stars",
"grid",
"rings",
"waves",
"rain",
"birds",
"cars",
"train",
"animals",
"aurora",
"constellation"

];


function getMode(){

if(animationMode==="auto"){

return modes[
Math.floor(
(clock/900)%modes.length
)
];

}

return animationMode;

}


function draw(){

clock++;

ctx.clearRect(
0,
0,
W,
H
);


const mode=
getMode();


/* STARS */

if(mode==="stars"){

for(let i=0;i<150;i++){

const x=
(i*97+clock*.3)%W;

const y=
(i*53)%H;

ctx.fillStyle=
"rgba(255,255,255,.55)";

ctx.fillRect(
x,
y,
1.5,
1.5
);

}

}


/* GRID */

if(mode==="grid"){

ctx.strokeStyle=
"rgba(70,225,255,.13)";

for(
let x=(clock*.4)%45;
x<W;
x+=45
){

ctx.beginPath();

ctx.moveTo(x,0);

ctx.lineTo(x,H);

ctx.stroke();

}

for(
let y=(clock*.25)%45;
y<H;
y+=45
){

ctx.beginPath();

ctx.moveTo(0,y);

ctx.lineTo(W,y);

ctx.stroke();

}

}


/* RINGS */

if(mode==="rings"){

ctx.strokeStyle=
"rgba(255,216,74,.17)";

for(
let r=40;
r<Math.max(W,H);
r+=75
){

ctx.beginPath();

ctx.arc(
W/2,
H/2,
r+(clock%75),
0,
Math.PI*2
);

ctx.stroke();

}

}


/* WAVES */

if(mode==="waves"){

ctx.strokeStyle=
"rgba(65,225,255,.18)";

for(let n=0;n<8;n++){

ctx.beginPath();

for(
let x=0;
x<W;
x+=8
){

const y=
H*.18+
n*35+
Math.sin(
x*.012+
clock*.025+
n
)*18;

if(x===0){

ctx.moveTo(x,y);

}else{

ctx.lineTo(x,y);

}

}

ctx.stroke();

}

}


/* CONSTELLATION */

if(mode==="constellation"){

let points=[];

for(let i=0;i<35;i++){

const x=
(i*173+
clock*.4)%W;

const y=
(i*91)%H;

points.push([x,y]);

ctx.beginPath();

ctx.arc(
x,
y,
2,
0,
Math.PI*2
);

ctx.fillStyle=
"rgba(255,255,255,.6)";

ctx.fill();

}

ctx.strokeStyle=
"rgba(65,225,255,.13)";

for(
let i=1;
i<points.length;
i++
){

ctx.beginPath();

ctx.moveTo(
points[i-1][0],
points[i-1][1]
);

ctx.lineTo(
points[i][0],
points[i][1]
);

ctx.stroke();

}

}


/* AURORA */

if(mode==="aurora"){

for(let n=0;n<8;n++){

ctx.beginPath();

for(
let x=0;
x<W;
x+=10
){

const y=
H*.25+
n*25+
Math.sin(
x*.006+
clock*.02+
n
)*35;

if(x===0){

ctx.moveTo(x,y);

}else{

ctx.lineTo(x,y);

}

}

ctx.strokeStyle=
"rgba(80,230,255,.10)";

ctx.stroke();

}

}


/* PARTICLES */

if(
mode==="stars" ||
mode==="rain"
){

particles.forEach(p=>{

p.y=
(p.y-.0005*p.speed+1)%1;

ctx.beginPath();

ctx.arc(
p.x*W,
p.y*H,
p.size,
0,
Math.PI*2
);

ctx.fillStyle=
"rgba(100,230,255,.45)";

ctx.fill();

});

}


requestAnimationFrame(draw);

}

draw();


/* =====================================================
DECOR MODE CONTROL
===================================================== */

const decor=
document.querySelector(".decor");

const birds=
document.querySelectorAll(".bird");

const cars=
document.querySelectorAll(".car");

const animals=
document.querySelectorAll(".animal");

const train=
document.querySelector(".train");

const rain=
document.getElementById("rain");


/* rain drops */

for(let i=0;i<100;i++){

const drop=
document.createElement("i");

drop.className=
"raindrop";

drop.style.left=
Math.random()*100+"%";

drop.style.animationDelay=
Math.random()*1.2+"s";

drop.style.animationDuration=
(.7+
Math.random()*.7)+"s";

rain.appendChild(drop);

}


function hideDecor(){

birds.forEach(x=>
x.style.display="none"
);

cars.forEach(x=>
x.style.display="none"
);

animals.forEach(x=>
x.style.display="none"
);

train.style.display="none";

rain.style.display="none";

}


function showDecor(mode){

hideDecor();

if(
mode==="auto" ||
mode==="birds"
){

birds.forEach(x=>
x.style.display="block"
);

}

if(
mode==="auto" ||
mode==="cars"
){

cars.forEach(x=>
x.style.display="block"
);

}

if(
mode==="auto" ||
mode==="animals"
){

animals.forEach(x=>
x.style.display="block"
);

}

if(
mode==="auto" ||
mode==="train"
){

train.style.display="block";

}

if(
mode==="auto" ||
mode==="rain"
){

rain.style.display="block";

}

}


showDecor("auto");


document
.getElementById("animationMode")
.onchange=e=>{

animationMode=
e.target.value;

showDecor(
e.target.value
);

};


/* =====================================================
OFFLINE MUSIC
===================================================== */

let audio=null;

let master=null;

let musicTimer=null;

let musicRunning=false;


function stopMusic(){

if(musicTimer){

clearTimeout(
musicTimer
);

}

musicTimer=null;

musicRunning=false;

if(audio){

audio.close();

audio=null;

}

}


function startMusic(type){

stopMusic();

if(type==="off")
return;


audio=
new(
window.AudioContext ||
window.webkitAudioContext
)();


master=
audio.createGain();

master.gain.value=.035;

master.connect(
audio.destination
);


let bpm=72;


if(type==="beat")
bpm=92;


if(type==="digital")
bpm=118;


const interval=
60000/bpm;


let count=0;


function beat(){

if(!audio)
return;


const now=
audio.currentTime;


const osc=
audio.createOscillator();

const gain=
audio.createGain();


osc.type=
type==="digital"
?"square"
:"sine";


let notes;


if(type==="beat"){

notes=[
110,
146,
165,
123
];

}else if(type==="digital"){

notes=[
220,
277,
330,
277
];

}else{

notes=[
196,
220,
247,
220
];

}


osc.frequency.value=
notes[
count%notes.length
];


gain.gain.setValueAtTime(
.0001,
now
);

gain.gain.exponentialRampToValueAtTime(
.18,
now+.02
);

gain.gain.exponentialRampToValueAtTime(
.0001,
now+.20
);


osc.connect(gain);

gain.connect(master);


osc.start(now);

osc.stop(
now+.22
);


count++;


musicTimer=
setTimeout(
beat,
interval
);

}


musicRunning=true;

beat();

}


document
.getElementById("musicStart")
.onclick=()=>{

const type=
document
.getElementById("musicType")
.value;

startMusic(type);

};


document
.getElementById("musicStop")
.onclick=()=>{

stopMusic();

};
