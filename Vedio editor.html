<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>JANJUA Digital Marketing Platform</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020914;
    font-family:Arial,"Noto Naskh Arabic",sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

#app{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    color:#fff;
    background:
      radial-gradient(circle at 50% 45%,
      #174d7d 0%,
      #0b315b 38%,
      #041b36 72%,
      #010914 100%);
}

/* Background */
#backgroundCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
    pointer-events:none;
}

/* Top */
.top{
    position:absolute;
    top:3%;
    left:3%;
    right:3%;
    z-index:30;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.brand h1{
    color:#ffd84a;
    font-size:clamp(30px,6vw,68px);
    font-weight:1000;
    text-shadow:
        0 3px 14px #000,
        0 0 25px #ffd84a55;
    animation:brandBubble 2.4s ease-in-out infinite alternate;
}

.brand p{
    color:#e9fbff;
    font-size:clamp(12px,2.2vw,22px);
    font-weight:bold;
    animation:brandRun 4s ease-in-out infinite;
}

@keyframes brandBubble{
    from{transform:scale(1)}
    to{
        transform:scale(1.06);
        text-shadow:0 0 25px #ffd84a99;
    }
}

@keyframes brandRun{
    0%,100%{opacity:.7}
    50%{opacity:1;letter-spacing:2px}
}

/* Special offer */
.badge{
    padding:9px 14px;
    border:1px solid #ffd84a;
    border-radius:13px;
    background:#03182ddd;
    color:#ffd84a;
    font-weight:bold;
    animation:badgePulse 1.7s infinite alternate;
}

@keyframes badgePulse{
    to{
        transform:scale(1.06);
        box-shadow:0 0 25px #ffd84a66;
    }
}

/* Sale */
.sale{
    position:absolute;
    right:3%;
    top:16%;
    z-index:31;
    padding:9px 15px;
    border-radius:15px;
    background:linear-gradient(135deg,#ffe36b,#ff9e00);
    color:#071421;
    font-weight:1000;
    box-shadow:0 8px 25px #0008;
    animation:saleFloat 1.7s infinite alternate;
}

.sale small{
    display:block;
    font-size:11px;
}

.sale strong{
    font-size:clamp(18px,3vw,34px);
}

@keyframes saleFloat{
    to{
        transform:translateY(-5px) scale(1.04);
    }
}

/* Main logo */
.logoArea{
    position:absolute;
    left:50%;
    top:48%;
    width:min(64vw,540px);
    height:min(64vw,540px);
    transform:translate(-50%,-50%);
    z-index:12;

    display:flex;
    align-items:center;
    justify-content:center;
}

.orbit{
    position:absolute;
    inset:1%;
    border:2px solid #43e6ff88;
    border-radius:50%;
    transform:rotateX(66deg) rotateZ(-15deg);
    box-shadow:0 0 22px #43e6ff55;
}

.orbit2{
    position:absolute;
    inset:9%;
    border:1px solid #ffd84a77;
    border-radius:50%;
    transform:rotateX(66deg) rotateZ(25deg);
}

/*
   No external image.
   JANJUA logo is created directly with HTML/CSS.
*/
.logoPlate{
    width:72%;
    height:72%;
    border-radius:50%;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    border:7px double #ffd84a;

    background:
      radial-gradient(circle,
      #174e45,
      #073529 58%,
      #031b18);

    box-shadow:
      0 0 25px #ffd84a55,
      inset 0 0 35px #000;

    animation:logoAnimation 5s infinite alternate;
}

@keyframes logoAnimation{
    to{
        transform:scale(1.045) rotate(1deg);
    }
}

.logoMoon{
    font-size:clamp(30px,6vw,65px);
}

.logoName{
    font-size:clamp(28px,6vw,64px);
    font-weight:1000;
    color:#ffd84a;
    text-shadow:2px 3px 4px #000;
}

.logoTraders{
    font-size:clamp(12px,2.2vw,24px);
    font-weight:bold;
    letter-spacing:4px;
}

.logoTag{
    font-size:clamp(8px,1.5vw,15px);
    margin-top:6px;
    color:#ffe9a3;
}

/* =================================================
   SATELLITE ONLY
================================================= */

.satelliteOrbit{
    position:absolute;
    inset:-4%;
    animation:satelliteRotation 8s linear infinite;
}

@keyframes satelliteRotation{
    to{
        transform:rotate(360deg);
    }
}

.satellite{
    position:absolute;
    top:-5px;
    left:50%;
    transform:translateX(-50%);
    width:78px;
    height:48px;
}

.satelliteBody{
    position:absolute;
    left:25px;
    top:11px;
    width:30px;
    height:22px;
    border-radius:6px;

    border:1px solid white;

    background:
      linear-gradient(
      135deg,
      white,
      #44e6ff,
      #145a81);

    box-shadow:0 0 17px #44e6ff;
}

.satellitePanel{
    position:absolute;
    top:6px;
    width:22px;
    height:29px;

    border:1px solid #baf7ff;

    background:
      repeating-linear-gradient(
      90deg,
      #44e6ff 0 4px,
      #073e62 4px 7px);
}

.panelLeft{
    left:0;
}

.panelRight{
    right:0;
}

.satelliteAntenna{
    position:absolute;
    left:38px;
    top:-7px;
    width:2px;
    height:15px;
    background:white;
}

.satelliteAntenna:after{
    content:"";
    position:absolute;
    left:-3px;
    top:-4px;
    width:8px;
    height:8px;
    border-radius:50%;
    background:#ffd84a;
    box-shadow:0 0 12px #ffd84a;
}

/* =================================================
   RAIN ONLY
================================================= */

#rain{
    position:absolute;
    inset:0;
    z-index:7;
    pointer-events:none;
    overflow:hidden;
}

.raindrop{
    position:absolute;
    top:-12%;
    width:2px;
    height:30px;

    background:
      linear-gradient(
      transparent,
      #8eeeff);

    opacity:.55;

    animation:
      rainFall linear infinite;
}

@keyframes rainFall{
    to{
        transform:
        translateY(125vh)
        translateX(-12vw);
    }
}

/* =================================================
   URDU TEXT BUTTONS
================================================= */

.bottomButtons{
    position:absolute;
    left:2%;
    right:2%;
    bottom:3%;
    z-index:40;

    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
}

.textButton{
    min-width:105px;

    padding:9px 11px;

    border-radius:14px;

    background:#04192eea;

    border:1px solid #43e6ff66;

    box-shadow:0 8px 20px #0008;

    text-align:center;

    color:white;

    cursor:pointer;

    animation:
      textFloat 2.3s ease-in-out infinite alternate;
}

.textButton:hover{
    border-color:#ffd84a;
    transform:translateY(-7px) scale(1.03);
}

.textButton b{
    display:block;
    font-size:clamp(11px,1.8vw,18px);
}

.textButton span{
    display:block;
    margin-top:2px;
    font-size:9px;
    color:#b8edff;
}

@keyframes textFloat{
    to{
        transform:translateY(-5px);
    }
}

/* Popup */
#popup{
    position:absolute;

    left:50%;
    bottom:16%;

    transform:
      translateX(-50%)
      translateY(20px);

    width:min(90vw,650px);

    padding:17px 20px;

    border-radius:18px;

    background:#031427f2;

    border:1px solid #ffd84a99;

    box-shadow:0 12px 45px #000a;

    text-align:center;

    z-index:60;

    opacity:0;
    pointer-events:none;

    transition:.3s;
}

#popup.active{
    opacity:1;
    transform:
      translateX(-50%)
      translateY(0);
}

#popup h2{
    color:#ffd84a;
    margin-bottom:7px;
}

#popup p{
    font-size:16px;
    line-height:1.8;
}

/* Buttons */
#fullscreen,
#admin{
    position:absolute;
    z-index:80;

    border:0;
    border-radius:10px;

    padding:9px 12px;

    background:#06182be8;
    color:white;

    opacity:.45;

    cursor:pointer;
}

#fullscreen{
    left:12px;
    top:12px;
}

#admin{
    right:12px;
    top:12px;
}

#fullscreen:hover,
#admin:hover{
    opacity:1;
}

/* Admin */
#adminPanel{
    position:absolute;

    right:12px;
    top:58px;

    width:min(330px,90vw);
    max-height:82vh;

    overflow:auto;

    z-index:90;

    display:none;

    background:#031427f7;

    border:1px solid #43e6ff66;

    border-radius:15px;

    padding:14px;
}

#adminPanel.open{
    display:block;
}

#adminPanel h3{
    color:#ffd84a;
    margin-bottom:9px;
}

.field{
    margin:7px 0;
}

.field label{
    display:block;
    font-size:12px;
    margin-bottom:4px;
}

.field input,
.field select{
    width:100%;
    padding:8px;

    border-radius:7px;

    border:1px solid #315777;

    background:#071c33;
    color:white;
}

.panelButton{
    width:100%;
    border:0;
    border-radius:8px;
    padding:9px;
    margin-top:6px;

    background:#08789e;
    color:white;

    font-weight:bold;
}

/* Music */
.musicButtons{
    display:flex;
    gap:5px;
}

.musicButtons button{
    flex:1;
    border:0;
    border-radius:7px;
    padding:7px;
    background:#0a3154;
    color:white;
}

@media(max-width:700px){

    .brand h1{
        font-size:35px;
    }

    .brand p{
        display:none;
    }

    .logoArea{
        width:82vw;
        height:82vw;
    }

    .sale{
        top:17%;
        right:2%;
    }

    .textButton{
        min-width:88px;
        padding:7px;
    }

    .textButton b{
        font-size:11px;
    }

    .textButton span{
        font-size:8px;
    }
}
</style>
</head>

<script>

/* =====================================================
FULL SCREEN
===================================================== */

const app =
document.getElementById("app");

document
.getElementById("fullscreen")
.addEventListener("click", async () => {

    try {

        if (!document.fullscreenElement) {

            await app.requestFullscreen();

        } else {

            await document.exitFullscreen();

        }

    } catch (error) {

        console.log(error);

    }

});


/* =====================================================
CLICKABLE URDU TEXT
===================================================== */

const popup =
document.getElementById("popup");

document
.querySelectorAll(".textButton")
.forEach(button => {

    button.addEventListener("click", () => {

        popup.querySelector("h2")
            .textContent =
            button.dataset.title;

        popup.querySelector("p")
            .textContent =
            button.dataset.text;

        popup.classList.add("active");

        clearTimeout(window.popupTimer);

        window.popupTimer =
            setTimeout(() => {

                popup.classList.remove("active");

            },4500);

    });

});


/* =====================================================
ADMIN
===================================================== */

const adminPanel =
document.getElementById("adminPanel");

document
.getElementById("admin")
.addEventListener("click", () => {

    adminPanel.classList.toggle("open");

});

document
.getElementById("closePanel")
.addEventListener("click", () => {

    adminPanel.classList.remove("open");

});


/* =====================================================
EDIT TEXT
===================================================== */

document
.getElementById("editBrand")
.addEventListener("input", e => {

    document
    .getElementById("brandName")
    .textContent =
    e.target.value;

});


document
.getElementById("editSubtitle")
.addEventListener("input", e => {

    document
    .getElementById("brandSubtitle")
    .textContent =
    e.target.value;

});


document
.getElementById("editBadge")
.addEventListener("input", e => {

    document
    .getElementById("topBadge")
    .textContent =
    e.target.value;

});


document
.getElementById("editSale")
.addEventListener("input", e => {

    document
    .getElementById("saleText")
    .textContent =
    e.target.value;

});


/* =====================================================
COLOR
===================================================== */

document
.getElementById("editColor")
.addEventListener("input", e => {

    const color =
        e.target.value;

    document
    .getElementById("brandName")
    .style.color =
    color;

    document
    .getElementById("topBadge")
    .style.color =
    color;

    document
    .getElementById("topBadge")
    .style.borderColor =
    color;

});


/* =====================================================
BACKGROUND COLOR PRESETS
===================================================== */

document
.getElementById("backgroundStyle")
.addEventListener("change", e => {

    const backgrounds = {

        blue:
        "radial-gradient(circle at 50% 45%,#174d7d,#0b315b 40%,#041b36 72%,#010914)",

        dark:
        "radial-gradient(circle at 50% 45%,#202b38,#101722,#030609,#000)",

        purple:
        "radial-gradient(circle at 50% 45%,#533b91,#24164c,#0a061c,#000)",

        green:
        "radial-gradient(circle at 50% 45%,#17634c,#08372b,#021811,#000)",

        gold:
        "radial-gradient(circle at 50% 45%,#735a22,#392b0c,#100b02,#000)"

    };

    app.style.background =
        backgrounds[e.target.value];

});


/* =====================================================
RAIN
===================================================== */

const rain =
document.getElementById("rain");

for(let i=0;i<120;i++){

    const drop =
        document.createElement("i");

    drop.className =
        "raindrop";

    drop.style.left =
        Math.random()*100 + "%";

    drop.style.animationDelay =
        Math.random()*1.5 + "s";

    drop.style.animationDuration =
        (0.7 +
        Math.random()*0.8) + "s";

    rain.appendChild(drop);

}

document
.getElementById("rainMode")
.addEventListener("change", e => {

    rain.style.display =
        e.target.value === "on"
        ? "block"
        : "none";

});


/* =====================================================
OFFLINE SOUND
===================================================== */

let audio = null;
let timer = null;
let noteIndex = 0;

function stopMusic(){

    if(timer){

        clearTimeout(timer);

    }

    timer = null;

    if(audio){

        try{

            audio.close();

        }catch(error){}

    }

    audio = null;

}


function startMusic(type){

    stopMusic();

    if(type === "off"){

        return;

    }

    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

    if(!AudioContext){

        alert(
            "اس browser میں Offline Audio دستیاب نہیں۔"
        );

        return;

    }

    audio =
        new AudioContext();

    const master =
        audio.createGain();

    master.gain.value =
        0.025;

    master.connect(
        audio.destination
    );


    let bpm = 72;

    if(type === "beat"){

        bpm = 92;

    }

    if(type === "digital"){

        bpm = 118;

    }


    const interval =
        60000 / bpm;

    noteIndex = 0;


    function playNote(){

        if(!audio){

            return;

        }


        const now =
            audio.currentTime;


        const oscillator =
            audio.createOscillator();

        const gain =
            audio.createGain();


        const notes =

            type === "beat"

            ? [110,146,165,123]

            : type === "digital"

            ? [220,277,330,277]

            : [196,220,247,220];


        oscillator.type =
            type === "digital"
            ? "square"
            : "sine";


        oscillator.frequency.value =
            notes[
                noteIndex %
                notes.length
            ];


        gain.gain.setValueAtTime(
            0.0001,
            now
        );


        gain.gain.exponentialRampToValueAtTime(
            0.16,
            now + 0.02
        );


        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            now + 0.20
        );


        oscillator.connect(gain);

        gain.connect(master);


        oscillator.start(now);

        oscillator.stop(
            now + 0.22
        );


        noteIndex++;


        timer =
            setTimeout(
                playNote,
                interval
            );

    }


    playNote();

}


document
.getElementById("startMusic")
.addEventListener("click", () => {

    startMusic(
        document
        .getElementById("musicType")
        .value
    );

});


document
.getElementById("stopMusic")
.addEventListener(
    "click",
    stopMusic
);


/* =====================================================
SUBTLE DIGITAL BACKGROUND
===================================================== */

const canvas =
document.getElementById(
    "backgroundCanvas"
);

const ctx =
canvas.getContext("2d");

let W = 0;
let H = 0;
let frame = 0;


function resizeCanvas(){

    W =
        canvas.width =
        window.innerWidth;

    H =
        canvas.height =
        window.innerHeight;

}

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();


function drawBackground(){

    frame++;

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    /*
       صرف ہلکی digital grid۔
       کوئی birds/cars/train/animals نہیں۔
    */

    ctx.strokeStyle =
        "rgba(70,225,255,.08)";


    for(
        let x =
        (frame * .3) % 55;

        x < W;

        x += 55
    ){

        ctx.beginPath();

        ctx.moveTo(x,0);

        ctx.lineTo(x,H);

        ctx.stroke();

    }


    for(
        let y =
        (frame * .2) % 55;

        y < H;

        y += 55
    ){

        ctx.beginPath();

        ctx.moveTo(0,y);

        ctx.lineTo(W,y);

        ctx.stroke();

    }


    requestAnimationFrame(
        drawBackground
    );

}


drawBackground();

</script>
