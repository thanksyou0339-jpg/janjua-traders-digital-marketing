<!DOCTYPE html>

<html lang="ur" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Janjua Traders - Order Form</title>


<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        Arial,
        "Noto Nastaliq Urdu",
        sans-serif;

    background: #f5f6f8;

    color: #222;
}


.container {

    width: min(680px, 94%);

    margin: 25px auto;
}


.header {

    background: #111827;

    color: white;

    text-align: center;

    padding: 22px 15px;

    border-radius:
        16px 16px 0 0;
}


.header h1 {

    margin: 0 0 6px;

    font-size: 25px;
}


.header p {

    margin: 0;

    opacity: .9;
}


.card {

    background: white;

    padding: 22px;

    border-radius:
        0 0 16px 16px;

    box-shadow:
        0 5px 22px rgba(0,0,0,.08);
}


.product-box {

    display: flex;

    gap: 15px;

    align-items: center;

    background: #f8fafc;

    padding: 14px;

    border-radius: 12px;

    margin-bottom: 20px;
}


.product-box img {

    width: 95px;

    height: 95px;

    object-fit: cover;

    border-radius: 10px;

    background: #eee;
}


.product-box h2 {

    margin: 0 0 8px;

    font-size: 20px;
}


.price {

    font-size: 21px;

    font-weight: bold;
}


.old-price {

    color: #888;

    margin-right: 8px;
}


label {

    display: block;

    font-weight: bold;

    margin: 14px 0 6px;
}


input,
textarea,
select {

    width: 100%;

    padding: 12px;

    border:
        1px solid #d1d5db;

    border-radius: 9px;

    font-size: 16px;

    background: white;
}


textarea {

    min-height: 90px;

    resize: vertical;
}


.grid {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 12px;
}


.total {

    margin-top: 18px;

    background: #f3f4f6;

    padding: 15px;

    border-radius: 10px;

    font-size: 18px;
}


.total div {

    display: flex;

    justify-content:
        space-between;

    margin: 5px 0;
}


.total .grand {

    border-top:
        1px solid #ccc;

    padding-top: 10px;

    margin-top: 10px;

    font-size: 21px;

    font-weight: bold;
}


button {

    width: 100%;

    border: 0;

    padding: 14px;

    margin-top: 18px;

    border-radius: 10px;

    background: #111827;

    color: white;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;
}


button:disabled {

    opacity: .6;
}


.message {

    display: none;

    margin-top: 15px;

    padding: 12px;

    border-radius: 9px;

    text-align: center;
}


.success {

    background: #dcfce7;

    color: #166534;
}


.error {

    background: #fee2e2;

    color: #991b1b;
}


.note {

    text-align: center;

    color: #666;

    font-size: 13px;

    margin-top: 14px;
}


@media(max-width:520px) {

    .grid {

        grid-template-columns: 1fr;
    }

    .product-box {

        align-items: flex-start;
    }

    .product-box img {

        width: 80px;

        height: 80px;
    }

}

</style>

</head>


<body>


<div class="container">


    <div class="header">

        <h1>
            JANJUA TRADERS
        </h1>

        <p>
            Online Shopping Store
        </p>

    </div>


    <div class="card">


        <!-- PRODUCT -->

        <div class="product-box">

            <img
                id="productImage"
                src=""
                alt="Product"
            >

            <div>

                <h2 id="productName">
                    Product
                </h2>

                <div>

                    <span
                        id="productPrice"
                        class="price"
                    >
                        Rs. 0
                    </span>

                    <del
                        id="oldPrice"
                        class="old-price"
                    ></del>

                </div>

            </div>

        </div>


        <!-- ORDER FORM -->

        <form
            id="orderForm"
            action="https://formsubmit.co/thanksyou0339@gmail.com"
            method="POST"
            novalidate
        >


            <!-- FORMSUBMIT -->

            <input
                type="hidden"
                name="_subject"
                id="emailSubject"
                value="New Janjua Traders Order"
            >

            <input
                type="hidden"
                name="_template"
                value="table"
            >

            <input
                type="hidden"
                name="_captcha"
                value="false"
            >

            <input
                type="hidden"
                name="_url"
                id="formUrl"
            >


            <!-- INTERNAL INFORMATION -->

            <input
                type="hidden"
                name="Order_ID"
                id="orderId"
            >

            <input
                type="hidden"
                name="Product"
                id="formProduct"
            >

            <input
                type="hidden"
                name="Product_Description"
                id="formDescription"
            >

            <input
                type="hidden"
                name="Product_Price"
                id="formProductPrice"
            >

            <input
                type="hidden"
                name="Old_Price"
                id="formOldPrice"
            >

            <input
                type="hidden"
                name="Supplier"
                id="formSupplier"
            >

            <input
                type="hidden"
                name="Product_ID"
                id="formProductId"
            >

            <input
                type="hidden"
                name="Product_Link"
                id="formProductLink"
            >

            <input
                type="hidden"
                name="Product_Image"
                id="formProductImage"
            >

            <input
                type="hidden"
                name="Delivery_Charges"
                id="formDeliveryPrice"
                value="0"
            >

            <input
                type="hidden"
                name="Total_Amount"
                id="formTotalPrice"
            >


            <!-- CUSTOMER -->

            <label for="customerName">
                نام
            </label>

            <input
                id="customerName"
                name="Customer_Name"
                type="text"
                required
                placeholder="اپنا نام لکھیں"
            >


            <label for="mobile">
                موبائل / WhatsApp
            </label>

            <input
                id="mobile"
                name="Mobile_WhatsApp"
                type="tel"
                required
                placeholder="03XXXXXXXXX"
            >


            <label for="address">
                مکمل Delivery Address
            </label>

            <textarea
                id="address"
                name="Delivery_Address"
                required
                placeholder="گھر نمبر، گلی، علاقہ، شہر"
            ></textarea>


            <div class="grid">


                <div>

                    <label for="quantity">
                        Quantity
                    </label>

                    <input
                        id="quantity"
                        name="Quantity"
                        type="number"
                        min="1"
                        max="10"
                        value="1"
                        required
                    >

                </div>


                <div>

                    <label for="platform">
                        Order Source
                    </label>

                    <select
                        id="platform"
                        name="Platform"
                    >

                        <option value="Janjua Traders Website">
                            Janjua Traders Website
                        </option>

                    </select>

                </div>


            </div>


            <div class="grid">


                <div>

                    <label for="color">
                        Color
                    </label>

                    <input
                        id="color"
                        name="Color"
                        type="text"
                        placeholder="اگر ضروری ہو"
                    >

                </div>


                <div>

                    <label for="size">
                        Size
                    </label>

                    <input
                        id="size"
                        name="Size"
                        type="text"
                        placeholder="اگر ضروری ہو"
                    >

                </div>


            </div>


            <!-- TOTAL -->

            <div class="total">


                <div>

                    <span>
                        Product Price
                    </span>

                    <strong
                        id="visibleProductTotal"
                    >
                        Rs. 0
                    </strong>

                </div>


                <div>

                    <span>
                        Delivery
                    </span>

                    <strong>
                        Rs. 0
                    </strong>

                </div>


                <div class="grand">

                    <span>
                        Total
                    </span>

                    <strong
                        id="visibleTotal"
                    >
                        Rs. 0
                    </strong>

                </div>


            </div>


            <button
                type="submit"
                id="submitBtn"
            >
                ORDER CONFIRM کریں
            </button>


            <div
                id="successMessage"
                class="message success"
            >
                آپ کا Order کامیابی سے submit ہو گیا ہے۔
                شکریہ!
            </div>


            <div
                id="errorMessage"
                class="message error"
            >
                Order submit نہیں ہو سکا۔
                براہِ کرم دوبارہ کوشش کریں۔
            </div>


            <div class="note">

                آپ کی معلومات صرف
                Order processing کے لیے استعمال کی جائیں گی۔

            </div>


        </form>

    </div>

</div>


<script src="order-form-script.js"></script>

</body>

</html>
