<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Janjua Traders - Online Shop</title>

<link rel="stylesheet"
      href="shop-style.css">

</head>


<body>


<!-- HEADER -->

<header class="shop-header">

    <div class="shop-logo">
        JANJUA TRADERS
    </div>

    <div class="shop-subtitle">
        Online Shopping Store
    </div>


    <!-- SEARCH -->

    <div class="search-box">

        <input
            type="search"
            id="searchBox"
            placeholder="🔍 Product تلاش کریں"
        >

    </div>

</header>



<!-- CATEGORY BAR -->

<nav class="category-bar">

    <button onclick="showCategory('All')">
        All
    </button>

    <button onclick="showCategory('Shoes')">
        Shoes
    </button>

    <button onclick="showCategory('Clothes')">
        Clothes
    </button>

    <button onclick="showCategory('Beauty')">
        Beauty
    </button>

    <button onclick="showCategory('Electronics')">
        Electronics
    </button>

</nav>



<!-- PRODUCTS -->

<main class="shop-container">

    <div
        id="productGrid"
        class="product-grid"
    ></div>

</main>



<!-- FOOTER -->

<footer class="shop-footer">

    <strong>
        JANJUA TRADERS
    </strong>

    <p>
        Online Shopping Store
    </p>

</footer>



<!-- JAVASCRIPT -->

<script src="products.js"></script>

<script src="shop-script.js"></script>


</body>

</html>
